<h1>Каталог</h1>
@if (games.isLoading()) {
  <p class="muted">Загружаем каталог…</p>
} @else if (games.error()) {
  <p>Не удалось загрузить каталог. <button class="button" (click)="games.reload()">Повторить</button></p>
} @else if (games.hasValue()) {
  <p class="muted">Найдено игр: {{ games.value().total }}</p>
  <div class="grid">
    @for (game of games.value().items; track game.id) {
      <app-game-card [game]="game" (addToCart)="cart.add($event)" />
    }
  </div>
}
