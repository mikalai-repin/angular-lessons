<a routerLink="/">← В каталог</a>
@if (game.isLoading()) {
  <p class="muted">Загружаем…</p>
} @else if (game.error()) {
  <h1>Игра не найдена</h1>
} @else if (game.hasValue()) {
  @let g = game.value();
  <h1>{{ g.title }}</h1>
  <p>{{ g.description }}</p>
  <p class="muted">
    Игроков: {{ g.players.min }}–{{ g.players.max }} ·
    {{ g.playTime }} мин · {{ g.age }}+
  </p>
  <button
    class="button"
    [disabled]="g.inStock === 0"
    (click)="cart.add(g)"
  >
    В корзину — {{ g.price }} ₽
  </button>
}
