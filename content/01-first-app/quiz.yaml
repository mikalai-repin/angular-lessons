# Квиз главы «Первое приложение». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Чем Angular как фреймворк отличается от библиотеки вроде React?
    options:
      - Роутинг, формы, запросы к серверу и DI уже входят в него и согласованы между собой
      - Он отвечает только за интерфейс, а роутинг и формы подбирают из сторонних библиотек
      - Он работает без компиляции, поэтому шаблоны пишут на обычном HTML без расширений
      - Он подходит только для серверного рендеринга и не умеет работать в браузере
    explanation: |
      Библиотека вроде React отвечает за интерфейс, остальное подбирают отдельно. В Angular роутер (`@angular/router`), формы (`@angular/forms`), HTTP (`@angular/common/http`) и внедрение зависимостей входят во фреймворк (шаг «Что такое Angular»).
    step: 01-what-is-angular

  - question: |
      Где компилируются шаблоны в превью этого курса, а где — в настоящем проекте Angular CLI?
    options:
      - В превью — JIT в браузере при запуске, в проекте — AOT при сборке
      - В превью — AOT на сервере курса, в проекте — JIT в браузере пользователя
      - В обоих случаях — AOT при сборке, JIT в Angular 22 больше не используется
      - В обоих случаях — JIT в браузере, AOT нужен только для серверного рендеринга
    explanation: |
      JIT (just-in-time) компилирует шаблоны в браузере при запуске — так работает превью. AOT (ahead-of-time) — при сборке проекта, так работает Angular CLI. Функция шаблона получается одинаковой (шаги «Что такое Angular» и «Под капотом: компилятор»).
    step: 01-what-is-angular

  - question: |
      В статье о «современном Angular» вы видите `NgModule`, `*ngIf` и `@Input()`. Как к этому относиться?
    options:
      - Это код старых версий Angular — он работает, но в новом коде так не пишут
      - Это код AngularJS — другого фреймворка, и в Angular 22 он не запустится
      - Это современный стиль Angular 22, рекомендованный руководством по стилю
      - Это синтаксис только для AOT-сборки, в JIT-превью он не поддерживается
    explanation: |
      `NgModule`, `*ngIf`, `@Input()`, конструкторный DI и zone.js — прошлое Angular. Такой код работает и встречается в проектах, поэтому курс показывает его во врезках «Вы встретите в старом коде», но пишет по-современному. AngularJS — это версии 1.x, совсем другой фреймворк (шаг «Что такое Angular»).
    step: 01-what-is-angular

  - question: |
      Приложение запускают с классом без декоратора. Что будет?

      ```ts
      export class App {}

      bootstrapApplication(App);
      ```
    options:
      - 'Ошибка NG0906: класс `App` — не компонент Angular'
      - Пустой компонент `App` с пустым шаблоном внутри `<app-root>`
      - 'Ошибка TypeScript, и код в превью не запустится совсем'
      - Angular сам добавит декоратор `@Component` с селектором `app-root`
    explanation: |
      Без `@Component` класс для Angular обычный: `NG0906: The App is not an Angular component, make sure it has the @Component decorator.` Декоратор сообщает Angular, что класс — компонент, и хранит его метаданные (шаг «Первый компонент»).
    step: 02-first-component

  - question: |
      Что означает `selector: 'app-root'` в метаданных компонента?
    options:
      - Angular найдёт на странице элемент `<app-root>` и отрисует шаблон внутри него
      - Angular создаст новый элемент `<app-root>` в конце `<body>` и отрисует шаблон в нём
      - Класс компонента будет доступен в других файлах под именем `app-root`
      - Шаблон компонента будет сохранён в файле `app-root.html` при сборке
    explanation: |
      `selector` — CSS-селектор места на странице. Компонент вставляет свою разметку внутрь найденного элемента — **хост-элемента**. Сам `<app-root>` лежит в `index.html` (шаг «Первый компонент»).
    step: 02-first-component

  - question: |
      Из `@Component` убрали строку `selector`. Что сообщит Angular?
    options:
      - Что селектор `ng-component` не нашёлся на странице (NG05104)
      - Что у компонента обязательно должен быть селектор (ошибка компиляции)
      - Ничего — компонент отрисуется в `<app-root>`, как и раньше
      - Ничего — компонент создастся, но его шаблон не попадёт на страницу
    explanation: |
      Компонент без селектора получает селектор по умолчанию `ng-component`. Такого элемента на странице нет: `NG05104: The selector "ng-component" did not match any elements` (шаг «Первый компонент»).
    step: 02-first-component

  - question: |
      В старом коде компонента написано `standalone: true`. Что это значит в Angular 22?
    options:
      - То же, что без этой строки — компоненты standalone по умолчанию
      - Компонент нельзя использовать без объявления в `NgModule`
      - Компонент отрисовывается в отдельном iframe со своими стилями
      - Компонент компилируется только в JIT, без AOT-сборки
    explanation: |
      До Angular 14 компонент объявляли в `@NgModule`. Потом появились standalone-компоненты, и с Angular 19 все компоненты такие по умолчанию. `standalone: true` — та же настройка, записанная явно (шаг «Первый компонент»).
    step: 02-first-component

  - question: |
      Селектор компонента поменяли на `'app-shop'`, а на странице есть только `<app-root>`. Почему в консоли два одинаковых сообщения NG05104?

      ```ts
      bootstrapApplication(App, appConfig).catch((err) => console.error(err));
      ```
    options:
      - Одно выводит обработчик ошибок Angular (с ERROR), второе — наш `.catch`
      - Angular дважды пытается найти элемент и дважды выводит ошибку сам
      - Одно сообщение — от TypeScript в редакторе, второе — от браузера
      - Первое — ошибка сборки превью, второе — ошибка во время работы
    explanation: |
      Ошибка одна. Сообщение с пометкой `ERROR` выводит встроенный обработчик ошибок Angular, а второе — `.catch` в `main.ts`, потому что промис запуска отклонён (шаг «Запуск приложения»).
    step: 03-bootstrap

  - question: |
      Найдётся ли заголовок из шаблона `App` в каждом из двух мест?

      ```ts
      bootstrapApplication(App).then(() => {
        console.log(document.querySelector('h1')); // (1)
      });
      console.log(document.querySelector('h1')); // (2)
      ```
    options:
      - (1) — да, (2) — нет, запуск асинхронный
      - (1) — нет, (2) — да, `.then` выполняется раньше отрисовки
      - Да в обоих местах — `bootstrapApplication` отрисовывает сразу
      - Нет в обоих местах — шаблон появляется только после первого клика
    explanation: |
      `bootstrapApplication` возвращает промис, который разрешается объектом `ApplicationRef`, когда компонент создан и отрисован. Сразу после вызова заголовка ещё нет, а внутри `.then` он на месте (шаг «Запуск приложения»).
    step: 03-bootstrap

  - question: |
      В `app.css` компонента `App` есть правило `h1 { color: var(--brand); }`. На какие заголовки оно подействует?
    options:
      - Только на `<h1>` из шаблона `App`, даже вложенные компоненты оно не тронет
      - На все `<h1>` на странице, потому что `app.css` подключён в `<head>`
      - На `<h1>` в `App` и во всех вложенных в него компонентах
      - Ни на какие — стили компонента нужно ещё подключить в `styles.css`
    explanation: |
      Стили компонента действуют только на его шаблон — это инкапсуляция стилей. Глобальные стили, действующие на всю страницу, лежат в `styles.css` (шаг «Шаблон и стили в файлах»).
    step: 04-template-files

  - question: |
      Как Angular по умолчанию (`ViewEncapsulation.Emulated`) добивается того, что стили компонента не «протекают»?
    options:
      - Метит элементы шаблона атрибутом `_ngcontent-…` и переписывает селекторы стилей под него
      - Помещает шаблон каждого компонента в теневой DOM (Shadow DOM) браузера
      - Отрисовывает каждый компонент в отдельном iframe со своими стилями
      - Вычисляет стили в JavaScript и записывает их в атрибут `style` каждого элемента
    explanation: |
      Элементы шаблона получают атрибут `_ngcontent-ng-c…`, хост — `_nghost-ng-c…`, а правило из `app.css` превращается в `h1[_ngcontent-ng-c…]`. Настоящий теневой DOM — отдельный режим `ShadowDom` (шаг «Шаблон и стили в файлах»).
    step: 04-template-files

  - question: |
      Что изменится, если убрать `appConfig` с `provideBrowserGlobalErrorListeners()` из запуска?

      ```ts
      setTimeout(() => {
        throw new Error('Проверка обработчика ошибок');
      }, 1000);
      ```
    options:
      - Ошибка выведется без пометки ERROR — мимо обработчика ошибок Angular
      - Ошибка не выведется совсем — Angular перестанет её перехватывать
      - Приложение не запустится — без провайдеров `bootstrapApplication` не работает
      - Ничего — ошибки в `setTimeout` Angular перехватывает всегда
    explanation: |
      Ошибка в `setTimeout` происходит вне Angular. `provideBrowserGlobalErrorListeners()` подписывается на события `error` и `unhandledrejection` и передаёт такие ошибки `ErrorHandler` — отсюда `ERROR`. Без неё это необработанная ошибка браузера (шаг «Конфигурация приложения»).
    step: 05-app-config

  - question: |
      Редактор подчеркнул строку и показал ошибку с меткой TS, а превью при этом работает. Как к этому относиться?
    options:
      - Исправить — код запускается, но в этом месте, скорее всего, сломается
      - Можно не обращать внимания — раз превью работает, ошибки нет
      - Это ошибка шаблона, её найдёт только AOT-сборка в настоящем проекте
      - Это предупреждение режима разработки, в продакшен-сборке его не будет
    explanation: |
      Ошибки типов не мешают запуску. В шаге про отладку `appRef.component` дал `TypeError: Cannot read properties of undefined (reading 'length')`, хотя TypeScript заранее подсказал `Did you mean 'components'?`. Правило: ошибки TS не игнорируем (шаг «Отладка»).
    step: 06-debugging

  - question: |
      Что делает блок `if (rf & 2)` в скомпилированной функции шаблона?
    options:
      - Обновляет то, что зависит от данных, — например, текст из поля компонента
      - Создаёт элементы шаблона при первой отрисовке компонента
      - Удаляет элементы шаблона, когда компонент уничтожается
      - Проверяет шаблон на ошибки перед тем, как его отрисовать
    explanation: |
      `rf & 1` — режим создания: построить элементы. `rf & 2` — режим обновления: Angular вызывает функцию шаблона и меняет только то, что зависит от данных, например `textInterpolate(ctx.title)`, а не перестраивает страницу (шаг «Под капотом: компилятор»).
    step: 07-compiler
