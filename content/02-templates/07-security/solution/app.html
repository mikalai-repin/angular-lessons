<header class="header">
  <span class="logo">♞ Ход конём</span>
</header>
<main class="page">
  <h1>Магазин настольных игр</h1>
  <input
    #searchBox
    class="search"
    type="search"
    placeholder="Найти игру"
    (keydown.enter)="search(searchBox.value)"
  />
  <p class="muted" [hidden]="!searchBox.value">
    Ищем: «{{ searchBox.value }}»
  </p>

  @let soldOut = inStock === 0;
  @let discount = ((1 - price / oldPrice) * 100).toFixed(0);

  <article class="card" [class.sold-out]="soldOut">
    <img class="cover" [src]="cover" [alt]="title" />
    <div class="body">
      <h2 class="title">{{ title }}</h2>
      <span
        class="rating"
        role="img"
        [attr.aria-label]="'Рейтинг: ' + rating + ' из 5'"
      >
        <span
          class="stars"
          [style.width.%]="(rating / 5) * 100"
        ></span>
      </span>
      <p class="price">
        {{ price }} ₽
        <s class="old-price">{{ oldPrice }} ₽</s>
        <span class="badge">−{{ discount }} %</span>
      </p>
      <p class="description" [innerHTML]="description"></p>
      <button
        class="button"
        [disabled]="soldOut"
        (click)="addToCart()"
      >
        В корзину
      </button>
    </div>
  </article>
</main>
