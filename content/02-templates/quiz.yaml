# Квиз главы «Шаблоны и привязки». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Что произойдёт в превью с таким шаблоном?

      ```html
      <p>{{ Math.round(4.6) }}</p>
      ```
    options:
      - "Ошибка `Cannot read properties of undefined (reading 'round')` — шаблон ищет `Math` в компоненте"
      - 'На странице появится 5 — шаблон видит все глобальные объекты браузера'
      - 'Компилятор шаблонов остановит запуск: вызовы методов в шаблоне запрещены'
      - 'На странице появится текст `Math.round(4.6)` — выражение не вычисляется'
    explanation: |
      Имена в выражении шаблона ищутся в контексте шаблона — экземпляре компонента. Компилятор превращает `Math` в `ctx.Math`, а такого поля у `App` нет. То же с `window`, `console`, `JSON` (шаги «Интерполяция» и «Под капотом: контекст шаблона»).
    step: 01-interpolation

  - question: |
      Какое из этих выражений компилятор шаблонов **не** пропустит?
    options:
      - '`{{ price++ }}`'
      - '`` {{ `Цена: ${price} ₽` }} ``'
      - '`{{ typeof price }}`'
      - "`{{ game?.title ?? '—' }}`"
    explanation: |
      В шаблоне нельзя присваивания, `++` и `--`, `new`, несколько выражений через `;` и побитовые операторы. Шаблонные строки, `typeof`, `?.` и `??` в Angular 22 работают (шаг «Интерполяция»).
    step: 01-interpolation

  - question: |
      В классе `protected readonly note = null;`. Что выведет `<p>[{{ note }}]</p>`?
    options:
      - '`[]` — `null` и `undefined` выводятся пустой строкой'
      - '`[null]` — значение превращается в строку как в JavaScript'
      - '`[undefined]` — Angular заменяет `null` на `undefined`'
      - 'Ничего — абзац с `null` внутри не отрисуется совсем'
    explanation: |
      Интерполяция превращает результат в строку по своим правилам: `undefined` и `null` — пустая строка, `false` — `false`, объект — `[object Object]` (шаг «Интерполяция»).
    step: 01-interpolation

  - question: |
      Какая из кнопок будет активной?

      ```html
      <button disabled="false">A</button>
      <button [disabled]="false">B</button>
      ```
    options:
      - Только B — в свойство записано логическое `false`
      - Только A — атрибут со значением `"false"` выключает блокировку
      - Обе — значение `false` в обоих случаях снимает блокировку
      - Ни одна — у обеих кнопок есть `disabled`, значит, обе неактивны
    explanation: |
      Для атрибута важно только, есть ли он, а строка `"false"` — просто текст: кнопка A неактивна. Привязка `[disabled]` пишет в **свойство** DOM логическое `false` — кнопка B активна (шаг «Привязка свойств»).
    step: 02-property-binding

  - question: |
      В шаблоне опечатка: `<img [scr]="cover" />`. Что будет в превью?
    options:
      - NG0303 в консоли, приложение работает дальше без этой привязки
      - Ошибка компиляции, и превью остаётся пустым, пока опечатку не исправят
      - Ничего — Angular запишет значение в новый атрибут `scr` у картинки
      - Ничего — Angular сам исправит опечатку и запишет значение в `src`
    explanation: |
      Angular знает свойства стандартных элементов: `NG0303: Can't bind to 'scr' since it isn't a known property of 'img'`. В превью это ошибка во время работы, приложение продолжает работать. AOT-сборка найдёт ту же опечатку заранее — `NG8002` (шаг «Привязка свойств»).
    step: 02-property-binding

  - question: |
      `<p [data-id]="title">` даёт `NG0303`. Как записать значение в атрибут `data-id`?
    options:
      - '`[attr.data-id]="title"` — привязка атрибута через `setAttribute`'
      - '`[dataId]="title"` — у каждого атрибута есть свойство в camelCase'
      - '`[class.data-id]="title"` — атрибуты `data-*` пишет привязка класса'
      - '`data-id="title"` — без скобок Angular вычислит выражение сам'
    explanation: |
      У атрибутов `data-*` нет свойства DOM, поэтому нужна привязка атрибута с префиксом `attr.`. Если значение `null` или `undefined`, Angular удалит атрибут (шаг «Атрибуты, классы, стили»).
    step: 03-attr-class-style

  - question: |
      Какой стиль получит элемент при `rating = 4.6`?

      ```html
      <span class="stars" [style.width.%]="(rating / 5) * 100"></span>
      ```
    options:
      - '`width: 92%`'
      - '`width: 92px`'
      - '`width: 0.92`'
      - '`width: 4.6%`'
    explanation: |
      `[style.width]` — свойство CSS `width`, а `.%` — единица, которую Angular допишет к числу: (4.6 / 5) × 100 = 92 (шаг «Атрибуты, классы, стили»).
    step: 03-attr-class-style

  - question: |
      Поле поиска с обработчиком `(keydown.enter)="search(searchBox.value)"`. Покупатель нажимает Shift+Enter. Что будет?
    options:
      - Обработчик не сработает — фильтр учитывает и клавиши-модификаторы
      - Обработчик сработает — `.enter` реагирует на любое нажатие Enter
      - Обработчик сработает дважды — отдельно на Shift и отдельно на Enter
      - Обработчик сработает, но `searchBox.value` будет пустой строкой
    explanation: |
      `(keydown.enter)` срабатывает только на Enter без модификаторов. Для Shift+Enter есть отдельный фильтр — `(keydown.shift.enter)` (шаг «События»).
    step: 04-events

  - question: |
      В шаблоне опечатка в имени метода: `(click)="addToKart()"`. Когда появится ошибка?
    options:
      - 'Только при щелчке: `ERROR TypeError: ctx.addToKart is not a function`'
      - 'Сразу при запуске: компилятор JIT проверит имена методов'
      - 'Никогда — Angular молча пропустит вызов несуществующего метода'
      - 'При запуске, и кнопка не отрисуется, пока опечатку не исправят'
    explanation: |
      Обработчик выполняется только при событии, и только тогда выясняется, что у `ctx` (экземпляра компонента) нет такого метода (шаг «События»).
    step: 04-events

  - question: |
      Покупатель печатает в поле, но не нажимает Enter. Почему абзац не обновляется?

      ```html
      <input #searchBox (keydown.enter)="search(searchBox.value)" />
      <p>Ищем: «{{ searchBox.value }}»</p>
      ```
    options:
      - Angular перепроверяет шаблон после событий с обработчиком, а их не было
      - Ссылка `#searchBox` запоминает значение поля только при первой отрисовке
      - Интерполяция читает атрибут `value`, а он не меняется при наборе
      - Абзац обновляется раз в секунду, нужно просто подождать
    explanation: |
      Angular не следит ни за DOM, ни за полями класса. Он перепроверяет шаблон в определённые моменты, например после события, на которое в шаблоне есть обработчик. Пустой `(input)="0"` заставляет абзац обновляться на каждую букву (шаг «Ссылки на элементы»).
    step: 05-template-refs

  - question: |
      В обработчике написали присваивание переменной `@let`. Что будет?

      ```html
      @let soldOut = inStock === 0;
      <button (click)="soldOut = true">Снять с продажи</button>
      ```
    options:
      - 'В превью ошибки не будет, а AOT-сборка остановится с NG8015'
      - 'Ошибка и в превью, и в AOT: переменная шаблона — константа'
      - 'Ошибки нигде не будет — присваивать в обработчиках разрешено'
      - 'В превью ошибка NG8015, а AOT-сборка проходит без замечаний'
    explanation: |
      Переменная шаблона — константа, но JIT-компилятор в превью этого не проверяет: ошибки нет, код работает не так, как ожидается. AOT с проверкой шаблонов останавливает сборку: `NG8015: Cannot assign to @let declaration 'soldOut'` (шаг «Переменные в шаблоне»).
    step: 06-let

  - question: |
      В `description` лежит строка `'Клад <b>меняется</b> каждую партию'`. Как её покажут две записи?

      ```html
      <p>{{ description }}</p>
      <p [innerHTML]="description"></p>
      ```
    options:
      - Первая — теги как текст, вторая — «меняется» жирным после санитизации
      - Обе — «меняется» жирным, интерполяция тоже разбирает HTML
      - Обе — теги как текст, `innerHTML` в Angular экранирует разметку
      - Первая — «меняется» жирным, вторая — пусто, `innerHTML` запрещён
    explanation: |
      Интерполяция всегда вставляет текст — защита от XSS. `[innerHTML]` вставляет разметку, но сначала санитизирует её: `<b>` остаётся, а скрипты, `onerror` и ссылки `javascript:` удаляются (шаг «Безопасность шаблонов»).
    step: 07-security

  - question: |
      В описании оказалась ссылка `<a href="javascript:alert(3)">`. Что сделает с ней `[innerHTML]`?
    options:
      - Превратит адрес в `unsafe:javascript:alert(3)` и предупредит в консоли
      - Оставит ссылку как есть — `alert` выполнится при щелчке
      - Выполнит `alert(3)` сразу при вставке разметки в страницу
      - Остановит приложение с ошибкой санитизации до исправления данных
    explanation: |
      Санитизация не выполняет и не пропускает опасное: адрес становится `unsafe:javascript:alert(3)`, а в консоли — `WARNING: sanitizing unsafe URL value javascript:alert(3)` (шаг «Безопасность шаблонов»).
    step: 07-security

  - question: |
      В практикуме старую цену и бейдж скрывают `[hidden]`. Почему подсказка советует ставить его на обёртку, а не на `.badge`?
    options:
      - Свой `display` в CSS класса может перекрыть `hidden`
      - '`[hidden]` работает только на элементах `<span>`'
      - '`[hidden]` нельзя ставить на элемент с классом'
      - Так шаблон компилируется быстрее в превью
    explanation: |
      У класса `.badge` может появиться свой `display` в CSS — и тогда он перекроет `hidden`, и бейдж останется на месте. Обёртка без своих стилей такой проблемы не имеет (шаг «Практикум: карточка игры»).
    step: 08-practice

  - question: |
      В шаблоне `{{ priceLabel() }}`, а метод пишет в консоль при каждом вызове. Когда появятся новые строки?
    options:
      - При запуске и после каждого щелчка «В корзину», но не во время набора в поиске
      - Только один раз при запуске — Angular запоминает результат метода
      - При каждом нажатии клавиши в поиске и при каждом щелчке по странице
      - Только когда меняется цена — Angular следит за полями, которые читает метод
    explanation: |
      Блок обновления выполняется при каждой проверке компонента, и метод вызывается заново. Щелчок по кнопке с обработчиком помечает компонент «грязным» — проверка будет. Набор в поле без обработчика проверку не запускает (шаг «Под капотом: контекст шаблона»).
    step: 09-template-context
