# Квиз главы «Сигналы». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Кнопка «В корзину» увеличивает обычное поле в таймере. Что будет в шапке через секунду после **первого** нажатия?

      ```ts
      protected cartCount = 0;

      protected addToCart() {
        setTimeout(() => this.cartCount++, 500);
      }
      ```

      ```html
      <span class="cart">В корзине: {{ cartCount }}</span>
      ```
    options:
      - '`0` — после таймера проверку шаблона никто не запросил'
      - '`1` — Angular заметит, что поле класса изменилось'
      - '`1` — Angular перехватывает таймеры и проверяет после них'
      - 'Ошибка в консоли — менять поля класса в таймере нельзя'
    explanation: |
      Angular в режиме зонлесс не следит за полями класса и не перехватывает таймеры. Проверка после клика проходит сразу, пока таймер не сработал, а после таймера её никто не запрашивает. Экран всё время отстаёт на одно нажатие (шаг «Проблема»).
    step: 01-problem

  - question: |
      Счётчик с таймером отстаёт. В `@Component` указали `changeDetection: ChangeDetectionStrategy.Eager`. Что изменится?
    options:
      - Ничего — после таймера проверка не запускается вообще
      - Счётчик заработает — `Eager` проверяет компонент после таймеров
      - Счётчик заработает — без OnPush Angular следит за полями
      - Приложение не запустится — стратегии `Eager` в Angular 22 нет
    explanation: |
      `Eager` означает «проверять этот компонент при каждой проверке», но после таймера проверки нет вообще. OnPush тут ни при чём: дело в том, что об изменении никто не сообщил (шаг «Проблема»).
    step: 01-problem

  - question: |
      `cartCount` — это `signal(0)`, а в шаблоне забыли скобки. Что покажет превью?

      ```html
      <span class="cart">В корзине: {{ cartCount }}</span>
      ```
    options:
      - '`[Signal: 0]`, и после нажатий текст не меняется'
      - '`0`, и счётчик растёт — Angular сам вызовет сигнал'
      - '`0`, но после нажатий текст больше не меняется'
      - 'Ошибку NG8109, и превью останется пустым'
    explanation: |
      Шаблон вывел сам сигнал, а не его значение. Сигнал не прочитан, поэтому шаблон от него не зависит. Предупреждение `NG8109` выдаёт сборка настоящего проекта, превью такую проверку не делает (шаг «signal»).
    step: 02-signal

  - question: |
      Поле объявлено как `protected readonly cartCount = signal(0);`. Что будет, если в `addToCart` написать `this.cartCount++`?
    options:
      - 'Ошибка TypeScript: поле `cartCount` только для чтения'
      - 'Счётчик вырастет — `++` вызывает у сигнала `update`'
      - 'Счётчик не вырастет, но и ошибки никакой не будет'
      - 'Счётчик вырастет, но шаблон об этом изменении не узнает'
    explanation: |
      TypeScript сообщит `Cannot assign to 'cartCount' because it is a read-only property`. Сигнал нельзя заменить, можно только изменить его значение через `set` или `update` (шаг «signal»).
    step: 02-signal

  - question: |
      В функцию вычисляемого сигнала добавили вывод в консоль, бейдж скидки есть в шаблоне. Какие действия добавят новую строку `Считаем скидку`?

      ```ts
      protected readonly discount = computed(() => {
        console.log('Считаем скидку');
        const { price, oldPrice } = this.game();
        return oldPrice ? Math.round((1 - price / oldPrice) * 100) : 0;
      });
      ```
    options:
      - Переключение игры — да, «В корзину» и поиск — нет
      - Переключение игры и каждый щелчок «В корзину»
      - Никакие — `computed` вычисляется один раз при создании
      - Любая проверка шаблона, в том числе после поиска
    explanation: |
      Клик заставляет Angular перепроверить шаблон, и шаблон вызывает `discount()`, но зависимость `game` не изменилась — возвращается запомненное значение. Новое вычисление — только после смены игры, при следующем чтении (шаг «computed»).
    step: 03-computed

  - question: |
      Корзина — `signal<CartItem[]>([])`, из неё вычисляются `cartCount` и `cartTotal`. Что будет на экране после двух нажатий «В корзину» с таким кодом?

      ```ts
      protected addToCart() {
        this.cart().push({ game: this.game(), quantity: 1 });
      }
      ```
    options:
      - Мини-корзина появится, но пустая, а в шапке `0 · 0 ₽`
      - Шапка и мини-корзина обновятся — массив же изменился
      - На экране ничего не изменится, мини-корзины так и не видно
      - Ошибка в консоли — массив в сигнале менять запрещено
    explanation: |
      `push` меняет массив, но сигнал об этом не знает: `set` и `update` никто не вызвал. Вычисляемые сигналы вернули запомненные значения. А `[hidden]="cart().length === 0"` читает массив напрямую и после клика увидел новую длину (шаг «Неизменяемые данные»).
    step: 04-immutability

  - question: |
      После `this.cart().push(…)` решили сообщить сигналу об изменении вручную: `this.cart.set(this.cart())`. Что будет?
    options:
      - Ничего — тот же массив по `Object.is` равен старому
      - Сигнал оповестит всех читателей — для этого и есть `set`
      - Ошибка — в `set` нельзя передать значение того же сигнала
      - Сигнал сравнит массивы поэлементно и заметит новую позицию
    explanation: |
      Сигнал сравнивает новое значение со старым через `Object.is`, то есть массивы и объекты — по ссылке. Равное значение никому не сообщается. Поэтому значения в сигналах не меняют, а заменяют (шаг «Неизменяемые данные»).
    step: 04-immutability

  - question: |
      Корзина пуста, открыт «Остров сокровищ». Эффект в конструкторе пишет `Корзина: …` при каждом изменении корзины. В `addToCart` вызов `this.cart.update(…)` скопировали, и он выполняется дважды подряд. Что появится в консоли после одного нажатия «В корзину»?
    options:
      - 'Одна строка `Корзина: Остров сокровищ × 2`'
      - 'Две строки: сначала с `× 1`, потом с `× 2`'
      - 'Две одинаковые строки `Корзина: Остров сокровищ × 2`'
      - 'Ни одной — эффект выполнился при запуске и больше не запустится'
    explanation: |
      Эффект срабатывает не в момент `update`, а позже: Angular собирает изменения и выполняет эффекты компонента вместе с проверкой компонента. Поэтому несколько изменений подряд дают один запуск эффекта. По той же причине строка `console.log('addToCart закончился')` в конце `addToCart` окажется в консоли раньше строки `Корзина: …` (шаг «effect»).
    step: 05-effect

  - question: |
      Вызов `effect(…)` перенесли из конструктора в метод `addToCart`. Что будет?
    options:
      - Приложение запустится, а при щелчке будет ошибка NG0203
      - Эффект создастся и будет работать, как из конструктора
      - Приложение не запустится — компилятор найдёт ошибку заранее
      - Ошибки нет, но эффект выполнится один раз и больше никогда
    explanation: |
      Эффект создают, пока Angular создаёт компонент: в конструкторе или инициализаторе поля — в контексте внедрения. Вне его при нажатии будет `NG0203: effect() can only be used within an injection context…` (шаг «effect»).
    step: 05-effect

  - question: |
      Эффект читает название открытой игры через `untracked`. Что будет, если листать игры, а потом добавить игру в корзину?

      ```ts
      effect(() => {
        const summary = this.cartSummary() || 'пусто';
        const title = untracked(() => this.game().title);
        console.log(`Корзина: ${summary} (на экране — ${title})`);
      });
      ```
    options:
      - При листании строк нет, при добавлении — название открытой игры
      - При листании строк нет, при добавлении — игра, открытая при запуске
      - Строка при каждой смене игры — как и без `untracked`
      - При листании строк нет, при добавлении — пустое название игры
    explanation: |
      `untracked` не записывает прочитанные внутри сигналы в зависимости, поэтому смена игры эффект не запускает. Но значение он читает текущее: `untracked` решает только, будет ли перезапуск (шаг «untracked»).
    step: 06-untracked

  - question: |
      Количество сделали таким связанным сигналом. Покупатель выбрал 3 у «Острова сокровищ» и перешёл к следующей игре, которая есть в наличии. Какое количество он увидит?

      ```ts
      protected readonly quantity = linkedSignal<number>(() => (this.soldOut() ? 0 : 1));
      ```
    options:
      - 3 — `soldOut` остался `false`, сброса не было
      - 1 — `soldOut` зависит от игры, а игра сменилась
      - 0 — при пересчёте зависимости значение обнуляется
      - Ошибку — в `linkedSignal` нельзя читать `computed`
    explanation: |
      Связанный сигнал сбрасывается, когда меняется **значение** его зависимости. Игра поменялась, а `soldOut` у неё тот же — `false`, поэтому для `quantity` «ничего не изменилось». Читать вычисляемые сигналы в `linkedSignal` можно: основной вариант читает `game()`, а `game` — тоже `computed`. Читайте тот сигнал, изменение которого должно сбрасывать значение, — здесь `game()` (шаг «linkedSignal»).
    step: 07-linked-signal

  - question: |
      Что будет, если не указать тип `<number>`?

      ```ts
      protected readonly quantity = linkedSignal(() => (this.game().inStock > 0 ? 1 : 0));

      protected increaseQuantity() {
        this.quantity.update((quantity) => Math.min(quantity + 1, this.game().inStock));
      }
      ```
    options:
      - 'Ошибка типов: тип сигнала `0 | 1`, а функция вернёт `number`'
      - 'Ошибки нет — TypeScript выведет `number`, как у `signal(0)`'
      - 'Ошибка во время работы — число больше 1 не запишется'
      - 'Ошибка типов — у связанного сигнала нет метода `update`'
    explanation: |
      Без `<number>` TypeScript выводит тип из функции, а она возвращает `0` или `1`. Тогда `update` с функцией, которая возвращает `number`, не скомпилируется: TS2322. У `signal(0)` такой проблемы нет — тип выводится из начального значения (шаг «linkedSignal»).
    step: 07-linked-signal

  - question: |
      В практикуме нужно показать, сколько штук открытой игры уже в корзине, сколько ещё можно добавить и сколько осталось до бесплатной доставки. Сколько **новых изменяемых** сигналов для этого нужно?
    options:
      - Ни одного — всё вычисляется из `cart` и `game`
      - Три — по одному на каждое новое значение
      - Один — объект с тремя полями, его заменяют целиком
      - Два — для склада и доставки, остальное вычисляется
    explanation: |
      `inCart`, `available` и `deliveryLeft` — вычисляемые сигналы, а единственный изменяемый сигнал корзины остаётся прежним. Так все места на экране, зависящие от корзины, обновляются сами и не расходятся друг с другом (шаг «Практикум: мини-корзина»).
    step: 08-practice

  - question: |
      Корзина пуста. Граф сигналов показывает `inCart (computed): читает cart`, хотя в коде есть `this.game()`. Почему?

      ```ts
      this.cart().find((item) => item.game.id === this.game().id)?.quantity ?? 0
      ```
    options:
      - '`find` не вызвал колбэк, и `this.game()` не был прочитан'
      - 'Angular разбирает код и пропускает сигналы в колбэках'
      - 'Вычисляемые сигналы в зависимости не записываются'
      - 'Зависимости записываются только при запуске приложения'
    explanation: |
      Зависимостью становится то, что действительно прочитано во время выполнения: сигнал при чтении связывает себя с активным потребителем. Зависимости — то, что прочитано в последний раз, и после каждого пересчёта они записываются заново. С непустой корзиной будет `читает cart, game` (шаг «Под капотом: граф сигналов»).
    step: 09-signal-graph

  - question: |
      В `soldOut` добавили вывод `soldOut пересчитан`, а в конструктор — эффект `effect(() => console.log('Эффект: soldOut =', this.soldOut()))`. Игры листают от первой до седьмой, «Маяка», — первой, которой нет в наличии. Что появляется в консоли при листании?
    options:
      - '`soldOut` — на каждой игре, эффект — только на «Маяке»'
      - '`soldOut` и эффект — оба при каждом переключении игры'
      - '`soldOut` и эффект молчат до «Маяка», там — оба сразу'
      - 'Эффект — при каждом переключении, `soldOut` — на «Маяке»'
    explanation: |
      Игра изменилась, и `soldOut` пересчитался. Но результат, `false`, равен старому — версия не выросла, и эффекту незачем запускаться. Это отсечение по равенству (шаг «Под капотом: граф сигналов»).
    step: 09-signal-graph
