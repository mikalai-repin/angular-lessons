# Квиз главы «Управляющие блоки». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Поле ввода с набранным текстом убрали со страницы и вернули обратно. Чем отличается результат у `@if` и у `[hidden]`?
    options:
      - 'С `@if` поле создаётся заново, пустым, а с `[hidden]` текст на месте'
      - 'С `[hidden]` поле создаётся заново, пустым, а с `@if` текст на месте'
      - 'В обоих случаях текст на месте — Angular запоминает состояние поля'
      - 'В обоих случаях поле пустое — браузер очищает спрятанные поля'
    explanation: |
      `@if` удаляет разметку целиком: при возврате поле создаётся заново. `[hidden]` только прячет элемент, и его состояние — текст, фокус, прокрутка — сохраняется (шаг «@if»).
    step: 01-if

  - question: |
      Что покажет этот блок, если `price()` возвращает `0`?

      ```html
      @if (price(); as p) {
        <p>{{ p }} ₽</p>
      } @else {
        <p>Цена не указана</p>
      }
      ```
    options:
      - '«Цена не указана» — `as` проверяет истинность, а `0` ложен'
      - '«0 ₽» — `as` пропускает в блок всё, кроме `null` и `undefined`'
      - 'Ничего — при нуле не создаётся ни одна из двух веток блока'
      - 'Ошибку в консоли — `as` нельзя применять к числовому сигналу'
    explanation: |
      `@if (x; as y)` проверяет значение на истинность, а `0` по правилам JavaScript ложен — блок уходит в `@else`. Если ноль — нормальное значение, условие пишут явно: `@if (count() > 0)` (шаг «@if»).
    step: 01-if

  - question: |
      Что будет, если написать цикл без `track`?

      ```html
      @for (game of games) {
        <h2>{{ game.title }}</h2>
      }
      ```
    options:
      - 'Ошибка компиляции: `@for loop must have a "track" expression`'
      - 'Список отрисуется, а ключом Angular сам возьмёт номер элемента'
      - 'Список отрисуется, а элементы Angular будет сравнивать по ссылке'
      - 'Ничего не отрисуется, но и ошибки в консоли превью не будет'
    explanation: |
      В `@for` выражение отслеживания обязательно: без него шаблон не компилируется — `Errors during JIT compilation of template for App: @for loop must have a "track" expression`. У старого `*ngFor` `trackBy` был необязательным (шаг «@for»).
    step: 02-for

  - question: |
      Как вычисляется `inCartCount` в этом цикле?

      ```html
      @for (game of games; track game.id) {
        @let inCartCount = inCart().get(game.id) ?? 0;
        <button [disabled]="inCartCount >= game.inStock">В корзину</button>
      }
      ```
    options:
      - 'Для каждой плитки заново, со своей `game` этой плитки'
      - 'Один раз для всего шаблона, по первой игре массива'
      - 'Один раз для всего шаблона, по последней игре массива'
      - 'Никак — переменную `@let` внутри `@for` объявить нельзя'
    explanation: |
      `@let` внутри `@for` вычисляется для каждой плитки заново, со своей `game`. Поэтому у игры, которой нет в наличии, кнопка неактивна сразу: `0 >= 0` (шаг «@for»).
    step: 02-for

  - question: |
      В строке корзины вывели переменные `@for`. Что покажет **вторая** из трёх позиций?

      ```html
      <span>{{ $index }}/{{ $count }} first={{ $first }} last={{ $last }} odd={{ $odd }}</span>
      ```
    options:
      - '`1/3 first=false last=false odd=true`'
      - '`2/3 first=false last=false odd=false`'
      - '`1/2 first=false last=true odd=true`'
      - '`2/3 first=false last=false odd=true`'
    explanation: |
      `$index` считает с нуля, поэтому у второй позиции он равен 1, а 1 — нечётный номер: `$odd` истинно. `$count` — сколько всего элементов, 3 (шаг «Переменные @for»).
    step: 03-for-variables

  - question: |
      Почему в строках корзины `track item.game.id`, а не `track item`?
    options:
      - 'При смене количества позиция заменяется новым объектом — для Angular она новая'
      - 'Выражение `track` принимает только строки и числа, объект ключом быть не может'
      - 'Ключ `item` подошёл бы так же: позиции корзины никогда не заменяются копиями'
      - 'Ключ `item` сравнивал бы позиции по содержимому, а это медленнее, чем по id'
    explanation: |
      Мы не меняем позицию корзины, а заменяем её новым объектом. Ключ по самому объекту увидел бы «новую» позицию: объекты сравниваются как ссылки, а не по содержимому. А id игры однозначно и постоянно определяет позицию (шаги «Переменные @for» и «Под капотом: как работает track»).
    step: 03-for-variables

  - question: |
      Когда показывается блок `@empty`, идущий сразу после `@for`?
    options:
      - 'Когда в перебираемом массиве нет ни одного элемента'
      - 'Когда у элемента массива пустое поле, указанное в `track`'
      - 'Когда сигнал, переданный в `@for`, ещё ни разу не менялся'
      - 'После каждого прохода цикла, как разделитель элементов'
    explanation: |
      `@empty` — разметка для пустого массива. Без него пришлось бы писать отдельный `@if (visibleGames().length === 0)` и следить, чтобы условие совпадало с тем, что перебирает `@for` (шаг «@empty»).
    step: 04-empty

  - question: |
      В главе 2 абзац «Ищем» не обновлялся при наборе. Почему каталог из шага «@empty» меняется на каждую букву?
    options:
      - '`(input)` пишет текст в сигнал, а от него зависят `visibleGames` и шаблон'
      - 'Блок `@for` сам следит за полями ввода на странице и перерисовывает список'
      - 'Вычисляемый сигнал `visibleGames` сам перечитывает поле поиска по таймеру'
      - 'Ссылка `#searchBox` сообщает Angular о каждом изменении значения поля'
    explanation: |
      Тогда в поле не было обработчика `(input)`, и Angular не знал, что что-то изменилось. Теперь обработчик записывает текст в сигнал `query`, от него зависит `visibleGames`, а от него — шаблон (шаг «@empty»).
    step: 04-empty

  - question: |
      Что покажет блок для игры с категорией `'family'`?

      ```html
      @switch (game.category) {
        @case ('family')
        @case ('kids') { Для всей семьи }
        @case ('party') { Для компании }
      }
      ```
    options:
      - '«Для всей семьи» — `@case` подряд без тела объединяют значения'
      - "Ничего — у `@case ('family')` нет тела, и вариант пустой"
      - '«Для всей семьи» и «Для компании» — варианты проваливаются'
      - 'Ошибку компиляции — у каждого `@case` должно быть своё тело'
    explanation: |
      `@case` подряд без тела объединяют несколько значений: для `family` и `kids` одна и та же разметка. Проваливания, как в `switch` JavaScript без `break`, нет — показывается только первый совпавший вариант (шаг «@switch»).
    step: 05-switch

  - question: |
      В `@switch (game.category)` перечислены все пять категорий и стоит `@default never;`. Удалили `@case ('kids')`. Что будет?
    options:
      - 'Сборка `ngc` упадёт с `TS2322`, а превью ошибку не покажет'
      - 'И сборка `ngc`, и превью покажут ошибку `TS2322` при запуске'
      - 'Сборка `ngc` пройдёт, а превью упадёт на детских играх'
      - 'Ничего нигде — `@default never;` просто оставит бейдж пустым'
    explanation: |
      `@default never;` говорит проверке шаблонов, что после всех `@case` значение имеет тип `never`. `ngc` находит неразобранный вариант: `Type '"kids"' is not assignable to type 'never'`. Превью (JIT) такую проверку не делает (шаг «@switch»).
    step: 05-switch

  - question: |
      Что появится на странице, если добавить в конец `app.html` такой код?

      ```html
      <ng-template>
        <p>Скидки недели</p>
      </ng-template>
      ```
    options:
      - 'Ничего — шаблон отрисовывается, только когда его попросят'
      - 'Абзац «Скидки недели» внутри тега `<ng-template>` в DOM'
      - 'Абзац «Скидки недели» без обёртки, как у `ng-container`'
      - 'Абзац «Скидки недели», но без привязок и обработчиков внутри'
    explanation: |
      `<ng-template>` — кусок разметки, который не отрисовывается сам. Angular компилирует его в функцию отрисовки и хранит, а показывает, только когда кто-то попросит, например директива `NgTemplateOutlet` (шаг «ng-container и ng-template»).
    step: 06-ng-template

  - question: |
      Шаблон цены `priceTpl` вставляют в `<p class="price">` директивой `*ngTemplateOutlet`. Зачем её ставят на `<ng-container>`?
    options:
      - 'Директиве нужен элемент, а `ng-container` не создаёт лишнего тега'
      - '`ng-container` сам подключает `NgTemplateOutlet` без `imports`'
      - '`ng-container` станет тегом-обёрткой, к которой цепляются стили'
      - '`ng-container` типизирует переменную `game` внутри шаблона'
    explanation: |
      `*ngTemplateOutlet` — директива, и ей нужен элемент, а `ng-container` не создаёт тега в DOM: лишнего тега внутри `<p>` не появится. Директиву всё равно нужно подключить в `imports`, иначе — `NG0303`, а `let-game` внутри `ng-template` остаётся `any` (шаг «ng-container и ng-template»).
    step: 06-ng-template

  - question: |
      У поля поиска есть только обработчик `(input)="query.set(searchBox.value)"`. После «Сбросить фильтры» `query()` пуст, а в поле остался старый текст. Почему?
    options:
      - 'Обработчик передаёт значение в сигнал, но не обратно — нужна привязка `[value]`'
      - 'Обработчик связывает поле с сигналом в обе стороны, но сброс нужен через `update`'
      - 'Поле очистится само, но только при следующей проверке компонента после сброса'
      - 'Поле ввода можно только читать через ссылку `#searchBox`, привязка `[value]` не поможет'
    explanation: |
      Обработчик `(input)` передаёт значение из поля в сигнал, но не обратно. Чтобы сброс был виден на экране, нужна привязка свойства: `[value]="query()"`, `[checked]="inStockOnly()"`, `[value]="sortBy()"` (шаг «Практикум: витрина»).
    step: 07-practice

  - question: |
      В каталоге поставили `track $index` и выбрали «Сначала дешёвые». Что произойдёт с плитками?
    options:
      - 'Ни одна не переместится — на тех же местах перепишутся тексты'
      - 'Плитки переставятся без пересоздания, как с ключом `track game.id`'
      - 'Все плитки удалятся и создадутся заново уже в новом порядке'
      - 'Ничего — порядок плиток на экране останется прежним до перезагрузки'
    explanation: |
      Наблюдатель показал: создано 0, перемещено 0, текстов переписано 28. Ключ плитки — её номер, поэтому Angular считает плитку номер 0 той же и переписывает в ней название и цену. Фокус, текст в поле, прокрутка останутся на месте, а игра под ними сменится (шаг «Под капотом: как работает track»).
    step: 08-track

  - question: |
      `visibleGames` возвращает копии игр — `GAMES.map((game) => ({ ...game }))`, а в шаблоне `track game`. Что будет при сортировке?
    options:
      - 'Все плитки пересоздадутся, а в консоли появится предупреждение NG0956'
      - 'Плитки переставятся без пересоздания — копии равны по содержимому'
      - 'Тексты в плитках перепишутся, а сами плитки останутся на своих местах'
      - 'Все плитки пересоздадутся, а в консоли появится предупреждение NG0955'
    explanation: |
      `track game` сравнивает по ссылке, а ни один новый объект не равен старому: создано 12, удалено 12. В режиме разработки Angular предупреждает: `NG0956: The configured tracking expression (track by identity) caused re-creation of the entire collection`. NG0955 Angular выдаёт при повторяющихся ключах, например `track game.category` (шаг «Под капотом: как работает track»).
    step: 08-track
