# Квиз главы «Компоненты и их связь». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `app.html` стоит `<app-game-card />`, а `GameCard` убрали из `imports` декоратора `App`. Что будет в превью?
    options:
      - 'NG0304 в консоли, на месте тега — пустой неизвестный элемент'
      - 'Карточки отрисуются: Angular находит компоненты по селектору сам'
      - 'Карточки отрисуются, но без стилей из `game-card.css`'
      - 'NG8001 в консоли превью, на месте тега — пустой неизвестный элемент'
    explanation: |
      Глобального реестра компонентов нет: компилятор ищет компонент для незнакомого тега только в `imports` этого компонента. Не нашёл — для браузера `<app-game-card>` просто неизвестный элемент, а в консоли `NG0304: 'app-game-card' is not a known element`. `NG8001` — ошибка сборки настоящего проекта, её видно ещё до запуска, а не в консоли превью (шаг «Свой компонент»).
    step: 01-component

  - question: |
      В карточке пока `game = GAMES[0]`, а `App` выводит `<app-game-card />` внутри `@for (game of visibleGames(); …)`. Почему все карточки показывают одну игру?
    options:
      - 'Все экземпляры берут `GAMES[0]`, а `game` из `@for` — у `App`'
      - '`@for` создаёт один экземпляр `GameCard` и повторяет его разметку'
      - 'Переменная `game` из `@for` перекрыта полем `game` карточки'
      - 'Поле `game` у всех экземпляров одно общее, как статическое'
    explanation: |
      `@for` создаёт двенадцать экземпляров `GameCard`, у каждого своё поле `game`, но каждый берёт его из `GAMES[0]`. Переменная `game` из `@for` принадлежит шаблону `App`, и карточка о ней ничего не знает — передать её внутрь можно только входом (шаг «Свой компонент»).
    step: 01-component

  - question: |
      У `GameCard` вход `game = input.required<Game>()`, а родитель забыл `[game]="game"`. Что будет в превью?
    options:
      - 'Ошибка NG0950 при первом чтении `game()`, имени входа в ней нет'
      - 'Ошибка NG8008 в консоли с точным именем входа `game`'
      - 'Карточки отрисуются, `game()` вернёт `undefined` без ошибок'
      - 'Пропадёт только первая карточка, остальные отрисуются'
    explanation: |
      Первая же карточка читает `game()`, а значения нет: `NG0950: Input is required but no value is available yet.`, и каталог исчезает целиком. Точную `NG8008: Required input 'game' from component GameCard must be specified` выдаёт сборка настоящего проекта, а не превью (шаг «Входы»).
    step: 02-inputs

  - question: |
      Карточка хочет сама сменить свою игру: в классе написали `this.game.set(other)`, где `game = input.required<Game>()`. Что будет?
    options:
      - 'Ошибка TypeScript: у `InputSignal` нет метода `set`'
      - 'Игра сменится в карточке, а родитель получит событие `gameChange`'
      - 'Игра сменится и в карточке, и в переменной `game` у родителя'
      - 'Игра сменится в карточке до следующего значения от родителя'
    explanation: |
      Вход меняет только Angular: TypeScript ответит `Property 'set' does not exist on type 'InputSignal<Game>'`. Данные текут сверху вниз — значение входа задаёт родитель (шаг «Входы»).
    step: 02-inputs

  - question: |
      Что окажется в `$event` у родителя?

      ```ts
      readonly add = output();
      ```

      ```html
      <app-game-card [game]="game" (add)="addToCart($event)" />
      ```
    options:
      - 'Ничего: у выхода без типа `$event` — это `void`'
      - 'Объект `MouseEvent` щелчка по кнопке «В корзину»'
      - 'Значение входа `game` — Angular передаёт его сам'
      - 'Объект `Event`, у которого можно вызвать `preventDefault`'
    explanation: |
      Значение события задают типом в `output<Game>()` и аргументом `emit`. У `output()` без типа `$event` — `void`, и проверка шаблонов в настоящем проекте ответит `TS2345: Argument of type 'void' is not assignable to parameter of type 'Game'` (шаг «События компонента»).
    step: 03-outputs

  - question: |
      Карточка вызывает `add.emit()`. Кто может обработать это событие?
    options:
      - 'Только компонент, в чьём шаблоне стоит `<app-game-card>`'
      - 'Все предки карточки — выход всплывает, как событие `click`'
      - 'Только корневой компонент `App`, где хранится состояние'
      - 'Любой компонент приложения, подписанный на имя `add`'
    explanation: |
      Выход не всплывает: его слышит только тот, в чьём шаблоне стоит тег компонента. Если родитель хочет передать событие выше, он объявляет свой выход. Это не объект `Event`, а синхронный вызов функций-подписчиков (шаг «События компонента»).
    step: 03-outputs

  - question: |
      В `App` есть `minRating = signal(0)`. Что будет с такой привязкой?

      ```html
      <app-rating [(value)]="minRating()" />
      ```
    options:
      - 'Шаблон не скомпилируется: `Unsupported expression in a two-way binding`'
      - 'Работает так же, как `[(value)]="minRating"` — Angular сам уберёт вызов'
      - 'Работает только вниз: щелчки по звёздам не дойдут до `minRating`'
      - 'Angular запишет значение из `valueChange` в новое поле `minRating()`'
    explanation: |
      В `[(value)]` пишут сам сигнал, без вызова: Angular нужен не текущий результат, а сигнал, в который можно записать новое значение. Справа может стоять изменяемый сигнал или поле, которому можно присвоить значение (шаг «Двусторонняя привязка»).
    step: 04-model

  - question: |
      В карточке звёзды привязаны в одну сторону: `<app-rating [value]="game().rating" />`, а в `Rating` — `value = model(0)`. У «Драконьей почты» рейтинг 4,3. Покупатель щёлкает по второй звезде. Что будет?
    options:
      - 'Звёзд станет две, а рейтинг игры в данных останется 4,3'
      - 'Ничего: при привязке `[value]` модель доступна только для чтения'
      - 'Звёзд станет две, и рейтинг игры в данных тоже станет 2'
      - 'Звёзд станет две на миг, затем привязка вернёт 4,3'
    explanation: |
      Модель поменяла **своё** значение и отправила `valueChange`, но его никто не слушает: `[value]` — односторонняя привязка. Вход не изменился, поэтому Angular не перезаписал модель — даже после сортировки звёзд по-прежнему две (шаг «Двусторонняя привязка»).
    step: 04-model

  - question: |
      В `Rating` объявили вход без преобразования и проверяют его в `select`. Что получится у карточки?

      ```ts
      readonly readonly = input(false);
      ```

      ```html
      <app-rating [value]="game().rating" readonly />
      ```
    options:
      - 'Во вход придёт пустая строка, она ложна — звёзды всё ещё меняются'
      - 'Во вход придёт `true`, как у атрибута `disabled` кнопки'
      - 'Во вход придёт строка `readonly` — звёзды перестанут меняться'
      - 'Атрибут без скобок во вход не попадёт, превью покажет ошибку'
    explanation: |
      `readonly` без квадратных скобок — статический атрибут, и его значение во вход приходит как есть, строкой. У атрибута без значения это `''`, а пустая строка ложна. Превью проглотит это молча, проверка шаблонов выдаст `TS2322`. Решение — `transform: booleanAttribute`, для которого пустая строка — `true` (шаг «Преобразование входов»).
    step: 05-input-transforms

  - question: |
      В карточке есть только один слот: `<ng-content select="[sticker]" />`. Что будет со строкой «Подарочная упаковка»?

      ```html
      <app-game-card [game]="game">
        <span sticker class="sticker">Хит</span>
        <p class="muted">Подарочная упаковка</p>
      </app-game-card>
      ```
    options:
      - 'Не покажется: она не подходит к `[sticker]`, а слота без `select` нет'
      - 'Покажется в конце карточки, куда попадает неподошедшее содержимое'
      - 'Покажется в слоте `[sticker]`, ведь он у карточки единственный'
      - 'Покажется перед шаблоном карточки, как у обычного HTML-элемента'
    explanation: |
      Всё, что не подошло ни одному `select`, попадает в слот без `select` — `<ng-content />`. Если такого слота нет, неподошедшее содержимое не показывается вообще. Само по себе содержимое компонента Angular не показывает: у компонента свой шаблон (шаг «Проекция содержимого»).
    step: 06-content-projection

  - question: |
      Что окажется на элементе `<app-rating>` в карточке, где `readonly()` — `true`?

      ```ts
      host: {
        '[attr.aria-valuenow]': 'readonly() ? null : value()',
      },
      ```
    options:
      - 'Атрибута `aria-valuenow` не будет совсем'
      - 'Атрибут `aria-valuenow` со строкой `null`'
      - 'Атрибут `aria-valuenow` с пустым значением'
      - 'Атрибут `aria-valuenow` с рейтингом игры'
    explanation: |
      Поле `host` — те же привязки, что в шаблоне, только для хост-элемента. У привязки атрибута значение `null` удаляет атрибут — звёздам-картинке значение ползунка не нужно (шаг «Хост-элемент»).
    step: 07-host

  - question: |
      В декоратор `GameCard` добавили `host: { class: 'tile' }`, а в `game-card.css` осталось правило `.tile { background: … }`. Что будет?
    options:
      - 'Класс у `<app-game-card>` появится, а фона не будет'
      - 'Класс у `<app-game-card>` появится, и фон тоже появится'
      - 'Класса не будет: в `host` можно писать только привязки'
      - 'Фон появится у всех элементов с классом `tile` на странице'
    explanation: |
      Правило из `game-card.css` описывает элементы **шаблона** карточки, а хост — не часть её шаблона: он стоит в шаблоне `App`. Для хоста в стилях компонента есть селектор `:host` (шаг «Стили компонента»).
    step: 08-styles

  - question: |
      Карточке поставили `encapsulation: ViewEncapsulation.ShadowDom`. Что изменится?
    options:
      - 'Кнопка станет системной: глобальный `.button` не проникнет внутрь'
      - 'Плитки потеряют фон: переменные CSS не проходят в теневой корень'
      - 'Ничего: `ShadowDom` — другое название режима по умолчанию'
      - 'Стили карточки станут глобальными и подействуют на всю страницу'
    explanation: |
      Angular создаёт у каждой карточки теневой корень, куда стили страницы не проникают: глобальный `.button` из `styles.css` остаётся снаружи. Переменные CSS наследуются сквозь теневую границу, поэтому фон и цвета на месте. Стили становятся глобальными в режиме `None` (шаг «Стили компонента»).
    step: 08-styles

  - question: |
      В строке корзины написали `<app-quantity [(value)]="item.quantity" />`, где `cart` — сигнал с массивом. Покупатель нажимает «+». Что будет?
    options:
      - 'Число и сумма строки изменятся, а шапка и «Итого» — нет'
      - 'Обновится всё: `[(value)]` сам заменит корзину новым массивом'
      - 'Ничего не изменится: `[(value)]` записывает только в сигналы'
      - 'Шаблон не скомпилируется: справа от `[( )]` должен быть сигнал'
    explanation: |
      `item.quantity` — не сигнал, а поле, и `[(value)]` превращается в присваивание `item.quantity = $event`. Объект в корзине изменили на месте, а сигнал `cart` об этом не знает. Поэтому привязку делят на `[value]` и `(valueChange)` и в обработчике заменяют корзину новым массивом (шаг «Практикум: выбор количества»).
    step: 09-practice

  - question: |
      Стикер «Хит» в DOM лежит внутри `<app-game-card>`, а оформлен правилом из `app.css`. Почему стили `App` до него достают?
    options:
      - 'Его создал шаблон `App`, и на нём метка `_ngcontent` от `App`'
      - 'Стили родителя действуют на всё внутри дочерних компонентов'
      - 'На нём метка `_ngcontent` от `GameCard`, как на всём внутри карточки'
      - 'Стили корневого компонента `App` всегда глобальные'
    explanation: |
      Элемент принадлежит тому компоненту, чей шаблон его создал, а не тому, внутри которого он оказался в DOM. Стикер помечен `_ngcontent` с идентификатором `App`, а селекторы из `app.css` переписаны с той же меткой. Внутрь самой карточки стили `App` не проникают (шаг «Под капотом: инкапсуляция стилей»).
    step: 10-encapsulation
