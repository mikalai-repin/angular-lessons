# Квиз главы «Жизненный цикл и DOM». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `GameDetails` добавили конструктор. Что будет, когда покупатель откроет окно?

      ```ts
      constructor() {
        console.log('GameDetails: конструктор', this.game().title);
      }
      ```
    options:
      - 'Ошибка NG0950: в момент вызова конструктора входа ещё нет'
      - 'В консоли название игры: входы записаны до вызова конструктора'
      - 'В консоли `undefined`: вход ещё пуст, но ошибки при этом нет'
      - 'Ошибка NG0203: входы нельзя читать вне контекста внедрения'
    explanation: |
      Конструктор — обычный конструктор класса: Angular вызывает `new GameDetails()` и только потом записывает значения входов. Обязательный вход, прочитанный слишком рано, бросает `NG0950: Input is required but no value is available yet.` Входы читают в `computed`, `effect` и шаблоне (шаг «Когда что происходит»).
    step: 01-lifecycle

  - question: |
      Окно «Подробнее» выводится в блоке `@if (selectedGame(); as game)`. Покупатель закрыл окно и открыл его снова. Что происходит с `GameDetails`?
    options:
      - 'Прежний экземпляр уничтожен, создан новый: конструктор выполнится снова'
      - Экземпляр хранится скрытым, а при открытии Angular лишь меняет его входы
      - Конструктор вызывается повторно, но для того же экземпляра, что и раньше
      - 'Angular прячет хост атрибутом `hidden`, а сам компонент продолжает жить'
    explanation: |
      Сигнал получил игру — `@if` **создал** `GameDetails`, сигнал стал `null` — `@if` компонент **уничтожил**. Каждое открытие окна — новый экземпляр класса: строки из конструктора появляются в консоли ещё раз (шаг «Когда что происходит»).
    step: 01-lifecycle

  - question: |
      В `App` объявлен запрос `viewChildren(Rating)`. На странице 13 рейтингов со звёздами: фильтр «Рейтинг от» в шаблоне `App` и по одному в каждой из 12 карточек `GameCard`. Сколько экземпляров вернёт запрос?
    options:
      - 'Один: запрос к представлению ищет только в шаблоне `App`'
      - 'Тринадцать: запрос к представлению обходит всё дерево компонентов'
      - 'Двенадцать: запрос находит только компоненты внутри блока `@for`'
      - 'Ноль: запрос по классу находит лишь элементы со ссылкой `#имя`'
    explanation: |
      Запрос к представлению ищет только в **собственном шаблоне** компонента. В шаблоне `App` один `<app-rating>` — фильтр. Звёзды карточек лежат в шаблоне `GameCard`, и запрос `App` до них не дотягивается — так же, как стили `App` не дотягиваются до элементов карточки (шаг «Доступ к элементам»).
    step: 02-view-child

  - question: |
      Что выведет консоль, когда покупатель откроет «Остров сокровищ»?

      ```ts
      constructor() {
        effect(() => {
          const dialog = this.dialogRef().nativeElement;
          console.log('effect: заголовок', JSON.stringify(dialog.querySelector('h2')?.textContent));
          dialog.showModal();
        });
        afterNextRender(() => {
          console.log('afterNextRender: заголовок', JSON.stringify(this.dialogRef().nativeElement.querySelector('h2')?.textContent));
        });
      }
      ```
    options:
      - 'В эффекте `""`, в `afterNextRender` — `"Остров сокровищ"`'
      - 'Оба раза `"Остров сокровищ"`: `<dialog>` уже в документе'
      - 'Оба раза `""`: тексты шаблона Angular обновит ещё позже'
      - 'В эффекте `"Остров сокровищ"`, в `afterNextRender` — `""`'
    explanation: |
      Окно откроется: элемент `<dialog>` к моменту эффекта уже создан и вставлен в документ. Но заголовок в нём ещё пустой — тексты и привязки Angular обновит после эффекта. `afterNextRender` выполняется, когда отрисовка закончена во всём приложении и все шаблоны обновлены. Эффект — для сигналов, для DOM — функции после отрисовки (шаг «После отрисовки»).
    step: 03-after-next-render

  - question: |
      Функции после отрисовки выполняются **только в браузере**. Что это даёт компоненту, который вызывает `showModal()` или создаёт `IntersectionObserver` в `afterNextRender`, а не в конструкторе?
    options:
      - Тот же компонент без изменений работает и при серверной отрисовке
      - Наблюдатель Angular отключит сам, когда компонент будет уничтожен
      - 'Внутри функции можно вызывать `inject()`, как в конструкторе'
      - Функция выполнится раньше эффектов, сразу после конструктора
    explanation: |
      При серверной отрисовке (SSR) Angular строит HTML на сервере, где нет настоящего DOM, и `afterNextRender` там просто не вызывается. Поэтому всё, что трогает DOM или API браузера, принято делать в функциях после отрисовки — тогда тот же компонент без изменений работает и на сервере (шаг «После отрисовки»). Наблюдатель при этом всё равно отключают сами в `DestroyRef.onDestroy`, а `inject()` внутри `afterNextRender` бросает NG0203 (шаг «Практикум: „Показать ещё“»).
    step: 03-after-next-render

  - question: |
      Из `Countdown` удалили строку `inject(DestroyRef).onDestroy(() => clearInterval(timer))`. Окно игры со скидкой открыли и закрыли три раза. Что происходит после этого?
    options:
      - 'Три таймера тикают и держат в памяти свои экземпляры `Countdown`'
      - Таймеров нет — Angular остановил их сам, когда уничтожил компоненты
      - Тикает один таймер — каждый новый `setInterval` заменяет предыдущий
      - Таймеры остановлены — без компонента на экране `setInterval` не идёт
    explanation: |
      Таймер компонент создал сам, за пределами Angular, и Angular о нём не знает. После третьего открытия тикают три таймера, и после закрытия окон они продолжают писать в сигналы компонентов, которых на экране нет: функция таймера ссылается на `this`. Это утечка (шаг «Уборка»).
    step: 04-destroy-ref

  - question: |
      Что из этого компонент должен убрать сам, когда его уничтожают?
    options:
      - Слушатель, добавленный через `addEventListener` на `window`
      - Обработчик `(click)` на кнопке в шаблоне этого компонента
      - Обработчик `(window:resize)` в метаданных `host` компонента
      - 'Эффект, созданный в этом компоненте вызовом `effect()`'
    explanation: |
      Убирать нужно то, что создано в обход шаблона: таймеры, слушатели через `addEventListener`, наблюдатели, соединения. Слушатели из шаблона и из `host` Angular снимает сам, эффекты компонента уничтожаются вместе с ним (шаг «Уборка»).
    step: 04-destroy-ref

  - question: |
      В `Tabs` по ошибке написали `viewChildren(Tab)` вместо `contentChildren(Tab)`. Что вернёт запрос?

      ```html
      <!-- шаблон GameDetails -->
      <app-tabs>
        <app-tab label="Описание">…</app-tab>
        <app-tab label="Характеристики">…</app-tab>
      </app-tabs>
      ```
    options:
      - 'Пустой массив: в шаблоне `Tabs` нет ни одного `<app-tab>`'
      - 'Обе вкладки: запрос видит всё, что лежит внутри хоста `<app-tabs>`'
      - 'Обе вкладки, но только после хука `ngAfterContentInit` в `Tabs`'
      - 'Только первую вкладку: `viewChildren` останавливается на первой'
    explanation: |
      Вкладки — **содержимое** `<app-tabs>`: их объявил и создал `GameDetails`. В шаблоне `Tabs` только кнопки и `<ng-content>`, поэтому запрос к представлению возвращает пустой массив. Компоненты из содержимого находит запрос к содержимому — `contentChildren()` (шаг «Дочерние из проекции»).
    step: 05-content-children

  - question: |
      Вкладку «Характеристики» обернули в `<div>` внутри `<app-tabs>`. Что будет с запросом `contentChildren(Tab)` в `Tabs`?
    options:
      - 'Не найдёт её: по умолчанию он ищет только прямых детей содержимого'
      - 'Найдёт её: запрос к содержимому по умолчанию ищет на любой глубине'
      - 'Найдёт её, но поставит последней, независимо от места в разметке'
      - 'Кнопки не будет, но сама вкладка останется видна всегда'
    explanation: |
      По умолчанию `contentChildren()` ищет только среди прямых детей содержимого. Кнопки «Характеристики» нет, а сама вкладка не видна никогда: `Tabs` её не нашёл, и её `active` так и осталось `false`. На любой глубине ищет запрос с опцией `descendants: true` (шаг «Дочерние из проекции»).
    step: 05-content-children

  - question: |
      Замер кнопки выбранной вкладки в `afterRenderEffect` перенесли из фазы `read` в фазу `earlyRead`. При открытии окна полоски нет: ширина кнопки — 0. Почему?
    options:
      - 'Окно открывается в фазе `mixedReadWrite`, уже после `earlyRead`'
      - '`earlyRead` не следит за сигналами и выполняется лишь однажды'
      - '`earlyRead` выполняется только после первого изменения сигнала'
      - '`earlyRead` выполняется на сервере, где у элементов нет размеров'
    explanation: |
      Фазы идут в строгом порядке для всех компонентов: `earlyRead → write → mixedReadWrite → read`. Окно открывает `afterNextRender` в `GameDetails` — функция без фазы, то есть `mixedReadWrite`. В фазе `earlyRead` `<dialog>` ещё закрыт, а у закрытого окна ширина любой кнопки — 0. После щелчка по вкладке полоска появляется и дальше работает правильно. В фазе `read` замер идёт последним (шаг «Замер после отрисовки»).
    step: 06-after-render-effect

  - question: |
      В `GameDetails` вывод в консоль добавили в конструктор, `effect`, `afterNextRender` и хуки `ngOnChanges`, `ngOnInit`, `ngAfterViewInit`. В каком порядке появятся строки при открытии окна?
    options:
      - constructor → ngOnChanges → ngOnInit → effect → ngAfterViewInit → afterNextRender
      - constructor → ngOnInit → ngOnChanges → effect → afterNextRender → ngAfterViewInit
      - ngOnChanges → constructor → ngOnInit → ngAfterViewInit → effect → afterNextRender
      - constructor → effect → ngOnChanges → ngOnInit → afterNextRender → ngAfterViewInit
    explanation: |
      `ngOnChanges` и `ngOnInit` вызываются сразу после записи входов, эффект — после них, во время проверки компонента. `ngAfterViewInit` — ещё внутри проверки, когда созданы шаблон и дочерние компоненты, а `afterNextRender` — после того, как отрисовка закончена во всём приложении (шаг «Классические хуки»).
    step: 07-lifecycle-hooks

  - question: |
      Для какой задачи `ngOnChanges` и в новом коде уместнее инструментов на сигналах?
    options:
      - 'Узнать прошлое значение входа (`previousValue`)'
      - 'Посчитать новое значение из нескольких входов компонента'
      - 'Остановить таймер, когда компонент уничтожают'
      - 'Поработать с DOM после того, как изменились входы'
    explanation: |
      Сигналы хранят только текущее значение, а `changes` даёт для каждого изменившегося входа `previousValue` и `currentValue`. Посчитать из входа — `computed`, отреагировать на вход — `effect`, работа с DOM — `afterNextRender` и `afterRenderEffect`, уборка — `DestroyRef` (шаг «Классические хуки»).
    step: 07-lifecycle-hooks

  - question: |
      Что будет, когда `LoadMore` появится на странице?

      ```ts
      constructor() {
        const host = inject<ElementRef<HTMLElement>>(ElementRef).nativeElement;
        afterNextRender(() => {
          const observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              this.more.emit();
            }
          });
          observer.observe(host);
          inject(DestroyRef).onDestroy(() => observer.disconnect());
        });
      }
      ```
    options:
      - 'Ошибка NG0203: функция выполнится позже, вне контекста внедрения'
      - 'Всё работает: `afterNextRender` вызван в конструкторе, контекст тот же'
      - 'Ошибка NG0951: к моменту отрисовки `DestroyRef` ещё не создан'
      - 'Всё работает: `inject()` разрешён в любом коде компонента'
    explanation: |
      `afterNextRender` вызывают в контексте внедрения, но сама функция выполняется позже, когда контекста уже нет, — ошибка NG0203 (`inject()` function must be called from an injection context). `ElementRef` и `DestroyRef` получают в конструкторе, сохраняют в переменные и используют внутри `afterNextRender` (шаг «Практикум: „Показать ещё“»).
    step: 08-practice

  - question: |
      В каталоге 6 карточек. Покупатель нажал «В корзину» у одной из них. Шаблоны каких компонентов Angular обновит?
    options:
      - '`App`, `Quantity` и эту карточку, а остальные пять пропустит'
      - '`App` и все шесть карточек: родитель проверяет всех своих детей'
      - 'Только эту карточку: событие не помечает предков компонента'
      - 'Все компоненты приложения: после события проверяется всё дерево'
    explanation: |
      Событие помечает «грязным» представление карточки и всех её предков до корня. `App` обновляется, мини-корзина получает `Quantity`, а карточка — новое `[inCart]`. Остальные пять карточек не помечены, их входы прежние, и Angular их пропускает (стратегия OnPush, шаг «Под капотом: обнаружение изменений»).
    step: 09-change-detection

  - question: |
      Окно со скидкой открыто. Таймер `Countdown` раз в секунду пишет в сигнал `now`, который читает его шаблон. Шаблоны каких компонентов Angular обновляет каждую секунду?
    options:
      - 'Только `Countdown`: предки получают лишь флаг для спуска к нему'
      - '`App`, `GameDetails` и `Countdown`: сигнал помечает всех предков'
      - 'Ничьи: запись в сигнал вне события шаблона проверку не запускает'
      - 'Всё дерево: таймер считается источником изменений везде'
    explanation: |
      Сигнал знает своих потребителей и помечает только шаблон `Countdown`. Предков не помечают грязными: им ставят флаг «внутри есть кого обновить», и Angular спускается через `App` и `GameDetails`, не обновляя их шаблонов. В журнале каждую секунду — `Проверены: Countdown` (шаг «Под капотом: обнаружение изменений»).
    step: 09-change-detection
