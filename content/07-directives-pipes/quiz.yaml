# Квиз главы «Директивы и пайпы». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Цена игры 1990 ₽, старая цена 2490 ₽, локаль `ru`. Что покажет стикер, если заключить пайп в скобки?

      ```html
      −{{ 1 - (game.price / oldPrice | percent) }}
      ```
    options:
      - '`−NaN` — пайп вернул строку, а `1 - строка` не число'
      - '`−20 %` — скобки не меняют того, что пайп выполняется последним'
      - '`−0.2` — внутри скобок пайп не применяется к выражению'
      - 'Ошибка компиляции — пайп нельзя заключать в круглые скобки'
    explanation: |
      У `|` самый низкий приоритет: без скобок пайп получает результат всего выражения, `1 - 1990 / 2490`. Со скобками он получил только `game.price / oldPrice` и вернул строку `'80 %'`, а `1 - '80 %'` — `NaN` (шаг «Встроенные пайпы»).
    step: 01-builtin-pipes

  - question: |
      В `app.config.ts` оставили провайдер `{ provide: LOCALE_ID, useValue: 'ru' }`, но удалили `registerLocaleData(localeRu)`. Что будет?
    options:
      - Ошибка NG02100 с NG0701 внутри — нет данных локали `ru`
      - Цены в формате `en-US` — пайпы откатятся на встроенную локаль
      - Ничего не изменится — правила всех языков встроены в Angular
      - Пайпы выведут исходные числа без всякого форматирования
    explanation: |
      `LOCALE_ID` говорит, какая локаль у приложения, а `registerLocaleData` даёт сами правила. В Angular встроены только правила `en-US`, остальные подключают отдельными модулями из `@angular/common/locales/`. Без них `percent` ловит ошибку `NG0701: Missing locale data for the locale "ru"` и сообщает о ней своей ошибкой NG02100, а отрисовка `App` обрывается (шаг «Встроенные пайпы»).
    step: 01-builtin-pipes

  - question: |
      Что будет с такой привязкой в `host` компонента `Rating`?

      ```ts
      host: {
        '[attr.aria-label]': "'Рейтинг ' + (value() | number) + ' из 5'",
      },
      ```
    options:
      - 'Ошибка разбора — в выражениях `host` пайпов нет'
      - 'Подпись «Рейтинг 4,6 из 5» — как в шаблоне компонента'
      - 'Подпись «Рейтинг 4,6 из 5», если `DecimalPipe` есть в `imports`'
      - 'NG0302 — пайп `number` не найден в `imports` компонента'
    explanation: |
      Пайпы работают только в шаблоне: `Parser Error: Host binding expression cannot contain pipes`. Поэтому подпись считает `computed` в классе, а число форматирует функция `formatNumber` из `@angular/common` — та же, что внутри пайпа `number` (шаг «Свой пайп»).
    step: 02-custom-pipe

  - question: |
      `PricePipe` убрали из `imports` у `GameCard`, а в шаблоне карточки остался `{{ game().price | price }}`. Что будет в превью?
    options:
      - Ошибка NG0302 в консоли, и каталог исчезает целиком
      - Ничего — объявленный пайп виден во всём приложении
      - Карточки покажут исходное число без форматирования
      - Карточки покажут текст выражения вместо цены
    explanation: |
      Пайп, как компонент и директиву, добавляют в `imports` каждого компонента, в шаблоне которого он есть. Без него — `NG0302: The pipe 'price' could not be found in the 'GameCard' component`, и каталог исчезает целиком. В настоящем проекте та же ошибка появится при сборке — `NG8004` (шаг «Свой пайп»).
    step: 02-custom-pipe

  - question: |
      `DurationPipe` превращает 60 минут в «1 ч», а с параметром `'long'` — в «1 час». Что выведет цепочка при `playTime = 60`?

      ```html
      {{ game().playTime | duration: 'long' | uppercase }}
      ```
    options:
      - '`1 ЧАС` — `uppercase` получает строку от `duration`'
      - '`1 Ч` — параметр `long` достаётся последнему пайпу'
      - '`60` — `uppercase` получает исходное число, а не строку'
      - 'Ошибка — в одном выражении может быть только один пайп'
    explanation: |
      Пайпы в цепочке выполняются слева направо: сначала `duration` с параметром `'long'`, потом `uppercase` получает его результат — «1 ЧАС» (шаг «Параметры пайпа»).
    step: 03-pipe-params

  - question: |
      Параметр `format` у пайпа `duration` объявлен с типом `'short' | 'long'`, а длинный формат `transform` выбирает для любого значения, кроме `'short'`. В шаблоне опечатка: `duration: 'lng'`. Что будет?
    options:
      - Превью молча покажет длинный формат, а сборка проекта остановится
      - Превью и сборка покажут короткий формат — неверный параметр отбросится
      - Превью покажет ошибку NG0302 — пайп с таким параметром не найден
      - Превью и сборка покажут длинный формат — типы параметров не проверяются
    explanation: |
      Параметры пайпа — следующие аргументы `transform`. В `transform` любое значение, кроме `'short'`, ведёт в ветку длинного формата, а JIT в превью не проверяет типы в шаблонах. Компилятор шаблонов в настоящем проекте проверяет параметры пайпа как аргументы функции: `TS2345` (шаг «Параметры пайпа»).
    step: 03-pipe-params

  - question: |
      В `transform` чистого `PlayersPipe` стоит `console.log`. Нажали «В корзину» у одной карточки: у неё изменился `inCart`, и карточка проверялась. Сколько раз вызовется `transform`?
    options:
      - Ни разу — `game().players` остался тем же объектом
      - Один раз — у той карточки, которая проверялась
      - Шесть раз — по одному на каждую карточку
      - Два раза — до и после изменения `inCart`
    explanation: |
      Чистый пайп при каждой проверке сравнивает значение и параметры с прошлыми через `Object.is`. Совпали — Angular берёт сохранённый результат и `transform` не вызывает. Один вызов на проверку карточки дал бы нечистый пайп (`pure: false`) (шаг «Чистые и нечистые пайпы»).
    step: 04-pure-pipes

  - question: |
      В массив, который получает чистый пайп, добавили элемент через `push`. Что вернёт пайп при следующей проверке?
    options:
      - Старый результат — ссылка та же, значит, «не изменилось»
      - Новый результат — пайп сравнивает массивы поэлементно
      - Новый результат — пайп вызывается при каждой проверке шаблона
      - Ошибка — менять на месте значение, переданное пайпу, запрещено
    explanation: |
      Чистый пайп — кэш по аргументам: `Object.is` для того же массива говорит «не изменилось». Поэтому курс заменяет массивы и объекты новыми. Нечистыми среди встроенных сделаны те, что смотрят внутрь значения: `json`, `keyvalue`, `slice` (шаг «Чистые и нечистые пайпы»).
    step: 04-pure-pipes

  - question: |
      `Tooltip` убрали из `imports` у `App`. Что будет с двумя стикерами в шаблоне `App`?

      ```html
      <span [appTooltip]="'Рейтинг ' + (hitRating | number)">Хит</span>
      <span appTooltip="Цена действует до конца дня">−20 %</span>
      ```
    options:
      - У первого NG0303 в консоли, у второго подсказки просто нет
      - У обоих NG0303 в консоли — Angular не нашёл директиву
      - У обоих подсказки просто нет, а консоль остаётся пустой
      - Превью не запустится, пока директиву не вернут в `imports`
    explanation: |
      Без директивы `[appTooltip]` — привязка без хозяина: Angular пробует записать её в свойство DOM и сообщает `NG0303: Can't bind to 'appTooltip'`. Статический `appTooltip="…"` без директивы — обычный атрибут HTML, придраться не к чему (шаг «Директива атрибута»).
    step: 05-directive

  - question: |
      Почему стили подсказки `.tooltip` лежат в глобальном `styles.css`, а не рядом с директивой `Tooltip`?
    options:
      - У директивы нет стилей, а стили компонентов не дотянутся до `<body>`
      - Подсказка создаётся внутри хоста, и стили хоста исказили бы её
      - Элемент подсказки создаёт шаблон `App`, а стили `App` и есть глобальные
      - '`styleUrl` у директивы работает только в настоящем проекте, не в превью'
    explanation: |
      Директива — компонент без шаблона и стилей. Подсказка создаётся в обход шаблонов и добавляется в `document.body`, а не внутрь хоста, а эмулированная инкапсуляция привязывает стили компонентов к элементам их шаблона (шаг «Директива атрибута»).
    step: 05-directive

  - question: |
      `LoadMore` подключает `InView` через `hostDirectives: [InView]`. Что будет при прокрутке до кнопки, если в `app.html` написать так?

      ```html
      <app-load-more (more)="showMore()" (appInView)="log()" />
      ```
    options:
      - '`log()` молчит, ошибок нет — выходы хост-директивы закрыты'
      - '`log()` срабатывает — выходы хост-директивы видны снаружи'
      - 'Ошибка в консоли — у `app-load-more` нет выхода `appInView`'
      - '`log()` срабатывает, а `more` молчит — подписчик у выхода один'
    explanation: |
      Входы и выходы хост-директивы по умолчанию закрыты: это детали устройства `LoadMore`. `(appInView)` на элементе без такого выхода Angular считает обычным событием DOM, которое никто не отправит. Открывают явно: `{ directive: InView, outputs: ['appInView'] }` (шаг «Композиция директив»).
    step: 06-host-directives

  - question: |
      Почему в конструкторе `LoadMore` работает `inject(InView)`, если `InView` подключена через `hostDirectives`?
    options:
      - Хост-директивы создаются раньше компонента, который их подключил
      - '`inject` находит `InView` по атрибуту `appInView` у `<app-load-more>`'
      - '`inject` откладывает подписку, пока директивы не будут созданы'
      - '`LoadMore` наследует `InView`, и `inject` возвращает сам `LoadMore`'
    explanation: |
      Лог в конструкторах показывает «InView: конструктор», потом «LoadMore: конструктор». Директива стоит на том же элементе, и `inject(InView)` выдаёт её уже созданный экземпляр. Атрибута `appInView` у `<app-load-more>` нет, а наследования нет вовсе: это композиция (шаги «Композиция директив» и «Под капотом: директивы и компоненты»).
    step: 06-host-directives

  - question: |
      Почему адрес для `[attr.src]` в `LazyImage` — `computed` из `seen` и входа `appLazy`, а не `src.set(адрес)` в момент появления?
    options:
      - Так адрес всегда берётся из текущего значения входа `appLazy`
      - Привязки в `host` принимают только `computed`, а не простые сигналы
      - Менять сигнал внутри `subscribe` нельзя, только в шаблоне
      - С `computed` браузер загружает картинку ещё до её появления
    explanation: |
      `computed` пересчитывается, когда меняются прочитанные сигналы: если родитель передаст другую картинку, `src` поменяется сам. Пока `seen` — `false`, `computed` даёт `null`, и привязка `[attr.src]` удаляет атрибут (шаг «Практикум: ленивая картинка»).
    step: 07-practice

  - question: |
      У `<app-rating [value]="…" [appTooltip]="…">` в DOM нет атрибута `appTooltip`. Почему директива с селектором `[appTooltip]` всё равно на нём создаётся?
    options:
      - Селектор сравнивается и с именами привязок элемента
      - Angular сначала пишет атрибут в DOM, потом ищет директивы
      - Директиву находит `querySelectorAll` по готовому DOM страницы
      - Селектор в квадратных скобках совпадает только с привязками
    explanation: |
      В скомпилированном шаблоне у элемента есть массив атрибутов: статические и, после маркера `3`, **имена** привязок. С ним Angular и сравнивает селекторы, поэтому `[appTooltip]="…"` подходит так же, как статический `appTooltip="…"` (шаг «Под капотом: директивы и компоненты»).
    step: 08-directives-inside

  - question: |
      `Tooltip` сделали компонентом: `@Component` вместо `@Directive`, тот же селектор `[appTooltip]` и пустой шаблон `template: ''`. Что будет на звёздах карточки `<app-rating … [appTooltip]="…">`?
    options:
      - 'NG0300: на элементе совпали два компонента, `Rating` и `Tooltip`'
      - 'Всё как раньше — пустой шаблон ничего не добавит в элемент'
      - 'Победит `Tooltip` — его шаблон заменит звёзды рейтинга'
      - 'Создастся только `Rating` — второй компонент Angular пропустит'
    explanation: |
      Компонент владеет содержимым элемента и рисует в нём свой шаблон, а два шаблона в одном элементе не поместятся: `NG0300: Multiple components match node with tagname app-rating`. Компонент на элементе — один, директив — сколько угодно (шаг «Под капотом: директивы и компоненты»).
    step: 08-directives-inside
