# Квиз главы «Сервисы и внедрение зависимостей». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Корзину сделали глобальной переменной, а журнал перенесли в её конструктор. Что будет при запуске?

      ```ts
      export class CartStore {
        constructor() {
          effect(() => console.log('Корзина:', this.summary() || 'пусто'));
        }
      }

      export const cartStore = new CartStore();
      ```
    options:
      - 'Ошибка NG0203: `effect()` вызван вне контекста внедрения'
      - 'Эффект заработает, но только после запуска всего приложения'
      - 'Эффект выполнится один раз и больше не будет запускаться'
      - 'Ошибка NG0201: для `CartStore` не нашлось провайдера'
    explanation: |
      `new CartStore()` выполняется при загрузке модуля — раньше, чем запустилось приложение. Эффекту нужно знать, чей он, а объект, созданный в стороне от Angular, ничьим не является (шаг «Зачем внедрение зависимостей»).
    step: 01-why-di

  - question: |
      Корзина — глобальная переменная `cartStore`, её импортируют все компоненты. Что мешает показать магазин с заранее заполненной корзиной?
    options:
      - Для подмены корзины придётся править `import` в каждом файле
      - Сигналы в глобальном объекте не обновляют шаблоны компонентов
      - Глобальный объект нельзя изменить после загрузки его модуля
      - TypeScript не даёт экспортировать экземпляр класса из модуля
    explanation: |
      Каждый компонент сам решил, какую именно корзину берёт, поэтому подменить её можно только правкой каждого `import`. С DI компонент только просит корзину, а какой экземпляр он получит, решает конфигурация приложения в одном месте (шаг «Зачем внедрение зависимостей»).
    step: 01-why-di

  - question: |
      `CartStore` с `@Service()` просят `App`, шапка и шесть карточек. В конструкторе сервиса — `console.log('CartStore: создан экземпляр')`. Сколько таких строк будет в консоли?
    options:
      - Одна — экземпляр создаётся при первом `inject()` и выдаётся всем
      - Восемь — каждый вызов `inject()` создаёт свой экземпляр сервиса
      - Две — одна для `App` и шапки, другая общая для всех карточек
      - Ни одной — сервисы создаются до запуска, когда консоль ещё пуста
    explanation: |
      `@Service()` делает сервис доступным во всём приложении, его выдаёт корневой инжектор. Инжектор создаёт экземпляр при первом запросе и запоминает, остальные получают тот же объект (шаг «Первый сервис»).
    step: 02-first-service

  - question: |
      У `CartStore` удалили декоратор `@Service()`, а шапка по-прежнему пишет `inject(CartStore)`. Что будет?
    options:
      - 'Ошибка NG0201: инжектор не знает, как получить `CartStore`'
      - 'Angular создаст экземпляр сам, декоратор нужен только для AOT'
      - 'Ошибка NG0203: `inject()` вызвана вне контекста внедрения'
      - 'Ошибки нет, но каждый компонент получит свою пустую корзину'
    explanation: |
      Без декоратора это обычный класс, и Angular не станет создавать его сам: `NG0201: No provider found for CartStore` — «нет провайдера» (шаг «Первый сервис»).
    step: 02-first-service

  - question: |
      Что будет при щелчке «В корзину»?

      ```ts
      protected buy() {
        inject(CartStore).add(this.game());
      }
      ```
    options:
      - 'Ошибка NG0203: обработчик выполняется вне контекста внедрения'
      - 'Игра попадёт в корзину: метод компонента видит его инжектор'
      - 'Игра попадёт в новую корзину: каждый вызов создаёт экземпляр'
      - 'Ошибка ещё при запуске: компилятор запрещает `inject()` в методах'
    explanation: |
      Контекст внедрения есть только пока Angular создаёт объект. Обработчик события выполняется позже, текущего инжектора уже нет. Поэтому зависимость получают в поле, а в методе пользуются ею: `this.cart.add(…)` (шаг «Контекст внедрения»).
    step: 03-injection-context

  - question: |
      Зачем `injectNow()` первой строкой вызывает `assertInInjectionContext(injectNow)`, если `inject()` внутри и так бросит NG0203?
    options:
      - Проверка срабатывает до `setInterval` и называет функцию в ошибке
      - Она создаёт контекст внедрения, если его нет, как `runInInjectionContext`
      - Без неё функцию нельзя будет вызвать в инициализаторе поля
      - Она нужна TypeScript, чтобы вывести тип возвращаемого сигнала
    explanation: |
      Без проверки ошибка говорит о `DestroyRef`, который вы не просили, а `setInterval`, запущенный до `inject(DestroyRef)`, тикает вечно. `assertInInjectionContext` проверяет контекст до побочных эффектов и называет функцию, которую вызвали не там (шаг «Контекст внедрения»).
    step: 03-injection-context

  - question: |
      В конструкторе `CartStore` есть `effect()`. Какой провайдер в `app.config.ts` приведёт к ошибке NG0203?
    options:
      - '`{ provide: CartStore, useValue: new DemoCartStore() }`'
      - '`{ provide: CartStore, useFactory: () => (isDevMode() ? new DemoCartStore() : new CartStore()) }`'
      - '`{ provide: CartStore, useClass: DemoCartStore }`'
      - 'Две строки: `DemoCartStore` и `{ provide: CartStore, useExisting: DemoCartStore }`'
    explanation: |
      `useValue` получает объект, созданный при загрузке `app.config.ts`, — вне Angular. Фабрику `useFactory` вызывает инжектор в контексте внедрения, поэтому `new` внутри неё эффект не ломает; `useClass` тоже создаёт экземпляр в контексте внедрения, а `useExisting` ничего не создаёт и выдаёт то, что выдаётся по `DemoCartStore` (шаг «Провайдеры»).
    step: 04-providers

  - question: |
      Что напишет шапка в консоль?

      ```ts
      // app.config.ts
      DemoCartStore,
      { provide: CartStore, useClass: DemoCartStore },

      // header.ts
      protected readonly cart = inject(CartStore);
      constructor() {
        console.log('один и тот же?', this.cart === inject(DemoCartStore));
      }
      ```
    options:
      - '`один и тот же? false` — две записи `useClass` дают два экземпляра'
      - '`один и тот же? true` — `useClass` выдаёт уже созданный экземпляр'
      - '`один и тот же? true` — у сервиса всегда один экземпляр на приложение'
      - 'NG0201 — класс с `autoProvided: false` нельзя получить по имени'
    explanation: |
      `DemoCartStore` в списке — короткая запись `{ provide: DemoCartStore, useClass: DemoCartStore }`, и каждая запись с `useClass` создаёт свой экземпляр. С `useExisting: DemoCartStore` выйдет `true`: «по токену `CartStore` выдай то, что выдаёшь по `DemoCartStore`» (шаг «Провайдеры»).
    step: 04-providers

  - question: |
      Токен `SHOP_CONFIG` с фабрикой объявлен в `shop-config.ts`, компоненты просят его. Что даст такой провайдер в `app.config.ts`?

      ```ts
      { provide: new InjectionToken('SHOP_CONFIG'), useValue: { freeDeliveryFrom: 3000, fewLeft: 5, hitRating: 4.8, pageSize: 6 } },
      ```
    options:
      - Ничего — это другой ключ, компоненты получат значение из фабрики
      - Акция заработает — токены сравниваются по строке описания
      - 'Ошибка NG0201 — у нового токена нет ни фабрики, ни значения'
      - Ошибка TypeScript — два токена с одинаковым описанием
    explanation: |
      Ключом служит сам объект токена, а строка — только описание для сообщений об ошибках. Провайдер молча не действует. Токен создают один раз, экспортируют и импортируют везде, где он нужен (шаг «Токены»).
    step: 05-tokens

  - question: |
      У `SHOP_CONFIG` удалили `factory`, а провайдера для него в `app.config.ts` нет. Что будет при `inject(SHOP_CONFIG)`?
    options:
      - 'Ошибка NG0201: для токена не нашлось провайдера'
      - '`inject()` вернёт `undefined` — значения у токена нет'
      - "`inject()` вернёт строку описания — `'SHOP_CONFIG'`"
      - 'Ошибка TypeScript: токен без фабрики нельзя внедрить'
    explanation: |
      Токен без фабрики — только ключ: значение должен дать провайдер. Иначе `NG0201: No provider found for InjectionToken SHOP_CONFIG`. Так делают, когда у настройки нет разумного значения по умолчанию (шаг «Токены»).
    step: 05-tokens

  - question: |
      В `@Component` у `GameCard` добавили `providers: [CartStore]`. Покупатель дважды нажимает «В корзину» у «Драконьей почты». Что он увидит?
    options:
      - 'Карточка — «В корзине: 2 шт.», а шапка и мини-корзина не изменятся'
      - 'Карточка и шапка обновятся: провайдер ведёт к той же корзине'
      - 'Шапка обновится, а карточка — нет: она смотрит в корневую корзину'
      - 'Ошибку NG0200: `CartStore` уже есть в корневом инжекторе'
    explanation: |
      `providers` кладёт провайдер в инжектор элемента каждой карточки, и поиск находит его раньше корневого: у каждой карточки своя пустая `CartStore`. Шапка и `App` по-прежнему получают корневую корзину (шаг «Иерархия инжекторов»).
    step: 06-hierarchy

  - question: |
      Вкладка просит `inject(TABS)`, а провайдер `TABS` есть только у `<app-tabs>`. Что будет с такой вкладкой?

      ```html
      <app-tabs>…</app-tabs>
      <app-tab label="Отзывы">Отзывов пока нет</app-tab>
      ```
    options:
      - 'Ошибка NG0201: на пути поиска вкладки нет `<app-tabs>`'
      - 'Вкладка найдёт соседний `<app-tabs>` в том же шаблоне'
      - '`inject()` вернёт `null`, и вкладка будет видна всегда'
      - 'Angular создаст для этой вкладки свой новый экземпляр `Tabs`'
    explanation: |
      Поиск идёт от элемента вверх по предкам, а соседний `<app-tabs>` вкладке не предок: поиск дошёл до инжектора окружения и не нашёл `TABS`. `null` вместо ошибки дал бы флаг `{ optional: true }` (шаг «Иерархия инжекторов»).
    step: 06-hierarchy

  - question: |
      `CartStore` получает аналитику через `injectAsync(() => import('./analytics').then((m) => m.Analytics), { prefetch: onIdle })`. Какие строки аналитики будут в консоли сразу после запуска, до щелчков?
    options:
      - «Модуль загружен» есть, а «экземпляр создан» — только после щелчка
      - Обе строки — `prefetch` загружает модуль и сразу создаёт экземпляр
      - Никаких — модуль загрузится только при первом вызове `analytics()`
      - Только «экземпляр создан» — модуль входит в основной код приложения
    explanation: |
      `prefetch: onIdle` загружает модуль, когда браузер освободился, а экземпляр Angular создаёт при первом вызове `this.analytics()` — в `add`. Загрузка модуля и создание экземпляра — разные моменты (шаг «Ленивые сервисы»).
    step: 07-lazy-services

  - question: |
      Покупатель отметил игру сердечком, отфильтровал каталог так, что её карточка исчезла, и сбросил фильтры. Почему сердечко на месте?
    options:
      - Избранное хранится в сервисе, а карточку просто создали заново
      - Angular не уничтожает карточку, а только прячет её при фильтрации
      - Избранное хранит `App` и заново передаёт его карточке входом
      - Новая карточка с тем же `track` наследует сигналы прежней
    explanation: |
      Карточку уничтожили и создали заново, а избранное живёт в `FavoritesStore`, а не в карточке. `App` об избранном не знает вовсе: шапка и карточки — соседи, и без сервиса `App` снова стал бы курьером (шаг «Практикум: избранное»).
    step: 08-practice

  - question: |
      Почему `FavoritesStore` с `@Service()` не нужно перечислять в `appConfig.providers`?
    options:
      - "Корневой инжектор видит в `ɵprov` `providedIn: 'root'` и создаёт запись сам"
      - 'Компилятор при сборке сам дописывает все сервисы в `appConfig.providers` приложения'
      - '`NullInjector` создаёт экземпляр любого класса, которого нет в записях'
      - 'Сервисы хранятся не в инжекторах, а в статических полях своих классов'
    explanation: |
      Не найдя записи в `records`, `R3Injector.get` смотрит на `ɵprov` токена: при `providedIn: 'root'` корневой инжектор создаёт запись тут же. Поэтому `FavoritesStore` нет среди 40 провайдеров в журнале, а `NullInjector` только бросает NG0201 (шаг «Под капотом: как ищется зависимость»).
    step: 09-di-inside
