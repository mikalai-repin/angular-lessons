# Квиз главы «Состояние приложения». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `CartStore` — `readonly items = this.state.asReadonly();`. Компонент по кнопке вызывает:

      ```ts
      this.cart.items.update((items) => items.map((item) => ({ ...item, quantity: 99 })));
      ```

      Что будет в превью?
    options:
      - 'TS2339 в консоли, при щелчке — `TypeError`, корзина не изменится'
      - 'Количество станет 99: `asReadonly()` закрывает только метод `set`'
      - 'Превью не запустится, пока ошибку TS2339 не исправят в коде'
      - 'Количество станет 99, но экран не обновится до следующего события'
    explanation: |
      `asReadonly()` возвращает `Signal<T>` — тот же сигнал, но без `set` и `update`. TypeScript отвечает `TS2339: Property 'update' does not exist…`, но ошибки TypeScript в превью запуск не останавливают, а щелчок даёт `ERROR TypeError: this.cart.items.update is not a function` (шаг «Хранилище на сигналах»).
    step: 01-store

  - question: |
      В сервисе поле `readonly items = signal<CartItem[]>([]);`. От чего защищает `readonly`?
    options:
      - 'Только от записи в само поле: `set` и `update` доступны всем'
      - 'От любых изменений: `set` и `update` сможет вызвать только сервис'
      - 'От изменения массива на месте: `push` и `splice` станут недоступны'
      - 'От всего сразу: Angular заморозит сигнал и массив при выполнении'
    explanation: |
      `readonly` защищает только само поле: другой сигнал в него не положить. А вызвать `set` или `update` может кто угодно, у кого есть корзина, — это показал эксперимент «Хочу 99». Поэтому состояние делают закрытым сигналом, а наружу отдают `asReadonly()` (шаг «Хранилище на сигналах»).
    step: 01-store

  - question: |
      Какая вкладка открыта в окне «Подробнее» — где по правилам главы хранить это значение?
    options:
      - 'В сигнале самого компонента — это состояние интерфейса'
      - 'В сервисе-хранилище — это состояние приложения'
      - 'В `computed` хранилища — это производное состояние'
      - 'В `SHOP_CONFIG` — это настройка внешнего вида магазина'
    explanation: |
      Выбранная вкладка нужна одному компоненту и живёт, пока он на экране, — это состояние интерфейса, его место в сигналах компонента. Вычислить её не из чего: её выбирает покупатель. Проверочный вопрос: «что должно случиться с этим значением, когда компонент исчезнет?» (шаг «Хранилище на сигналах»).
    step: 01-store

  - question: |
      Почему в `localStorage` корзину сохраняют как `{ id, quantity }`, а не позиции с играми целиком?
    options:
      - 'Цена и остаток устареют — при загрузке их берут из каталога'
      - 'Так корзину не сможет прочитать чужой скрипт на странице'
      - '`JSON.stringify` не умеет сохранять вложенные объекты игр'
      - 'Объект игры нельзя сохранить: его поля объявлены `readonly`'
    explanation: |
      Цена может измениться, игру могут убрать из каталога, остаток на складе уменьшится, а в `localStorage` останется снимок недельной давности. Поэтому сохраняют минимум — id игры и количество, а название, цену и остаток при загрузке берут из каталога `GAMES`. Секретом корзина от этого не становится: `localStorage` читает любой скрипт на странице (шаг «Сохранение в localStorage»).
    step: 02-persistence

  - question: |
      В `localStorage` под ключом корзины лежит строка `{oops`, а из `loadCart()` убрали `try`/`catch`:

      ```ts
      private readonly state = signal<readonly CartItem[]>(loadCart());
      ```

      Что будет при запуске?
    options:
      - 'Превью пустое: `SyntaxError` в инициализаторе сломал создание `CartStore`'
      - 'Магазин откроется с пустой корзиной, а в консоли будет предупреждение'
      - 'Магазин откроется, сломается только мини-корзина, остальное работает'
      - 'Angular сам удалит испорченную запись и запустит магазин заново'
    explanation: |
      Исключение в инициализаторе поля ломает создание `CartStore`, без корзины не создаётся шапка — и всё приложение: в консоли `ERROR SyntaxError: Expected property name or '}' in JSON…`. С `try`/`catch` магазин запускается с пустой корзиной (шаг «Сохранение в localStorage»).
    step: 02-persistence

  - question: |
      Почему сумму к оплате не хранят в состоянии корзины и не обновляют эффектом, который следит за позициями?
    options:
      - 'Сумма вычисляется из позиций — это работа `computed`, а не эффекта'
      - 'Эффект нельзя создать в сервисе — только в конструкторе компонента'
      - 'Эффект не замечает изменений сигнала из другого поля сервиса'
      - 'В хранилище разрешён только один сигнал — с позициями корзины'
    explanation: |
      Всё, что можно вычислить из состояния, — производное состояние: `computed` пересчитывается сам, и забыть обновить его невозможно. Документация Angular предостерегает: «избегайте эффектов для распространения изменений состояния» — лишние проходы обнаружения изменений, а то и бесконечные циклы (шаг «Производное состояние»).
    step: 03-derived-state

  - question: |
      `subtotal` читают шапка, мини-корзина, `delivery`, `deliveryLeft` и `total`. В него добавили журнал:

      ```ts
      readonly subtotal = computed(() => {
        console.log('subtotal пересчитан');
        return this.items().reduce((sum, item) => sum + item.game.price * item.quantity, 0);
      });
      ```

      Сколько строк появится после «+» в мини-корзине и после щелчка по сердечку избранного?
    options:
      - 'После «+» — одна, после сердечка — ни одной'
      - 'После «+» — пять, после сердечка — ни одной'
      - 'После «+» — одна, после сердечка — тоже одна'
      - 'После «+» — пять, после сердечка — тоже пять'
    explanation: |
      `computed` хранит результат, и все пять читателей получают его из кэша, пока позиции не изменились: одно вычисление на каждое изменение корзины. Сигнал избранного `subtotal` не читал, поэтому его не касается (шаг «Производное состояние»).
    step: 03-derived-state

  - question: |
      Почему применённый промокод хранят в `linkedSignal` от `subtotal`, а не в `computed` или `signal`?
    options:
      - 'В `computed` не записать, а `signal` не пересмотрят при смене суммы'
      - '`linkedSignal` сохраняет промокод в `localStorage` между запусками'
      - 'Только у `linkedSignal` есть метод `asReadonly()` для чтения снаружи'
      - '`computed` и `signal` нельзя объявлять в сервисе вместе с `effect`'
    explanation: |
      Промокод выбирает покупатель — это изменяемое состояние, но его нужно пересматривать, когда сумма товаров падает ниже порога. В `computed` промокод не записать, а обычный `signal` никто не пересмотрит. `linkedSignal` — изменяемое состояние, которое пересматривается при изменении источника (шаг «Промокод»).
    step: 04-promo-code

  - question: |
      Правило «корзина опустела — промокод снимается» записали так (и убрали сброс промокода из `clear()`):

      ```ts
      readonly isEmpty = computed(() => this.items().length === 0);
      private readonly promoState = linkedSignal<boolean, Promo | null>({
        source: this.isEmpty,
        computation: () => null,
      });
      ```

      Покупатель применил `KNIGHT10`, очистил корзину и положил игру снова. Что с промокодом?
    options:
      - 'На месте: пока корзина пуста, промокод никто не читал'
      - 'Снят: `isEmpty` побывал `true`, и `computation` вернул `null`'
      - 'Снят: `linkedSignal` пересчитывается на каждое изменение `isEmpty`'
      - 'Ошибка: источником `linkedSignal` не может быть `computed`'
    explanation: |
      `linkedSignal` ленив: он пересчитывается, только когда его читают, и смотрит, изменился ли источник с прошлого чтения. Пока корзина пуста, мини-корзины нет на экране, а при следующем чтении `isEmpty` снова `false` — источник «не изменился». Переход «корзина опустела» — событие, его место в действии `clear()` (шаг «Промокод»).
    step: 04-promo-code

  - question: |
      Карточка и мини-корзина уже не дают положить больше, чем есть на складе. Зачем практикум переносит это правило в хранилище?
    options:
      - 'Иначе `add` из нового компонента положит в корзину и сотую коробку'
      - 'Шаблон не умеет сравнивать значение сигнала с полем `inStock`'
      - 'Выключенная кнопка в превью всё равно принимает щелчки покупателя'
      - 'Без этого `computed` в хранилище перестанут пересчитываться'
    explanation: |
      Пока правило живёт в шаблонах, хранилище о складе не знает: `add` положит и сотую коробку, если его вызовет компонент, который про правило не слышал, а `loadCart()` поверит `localStorage`. Правило должно жить там же, где состояние, которое оно охраняет (шаг «Практикум: правила склада»).
    step: 05-practice

  - question: |
      У «Ночного экспресса» (id 4) на складе 3 коробки, у «Маяка» (id 7) — ни одной, «Драконьей почты» (id 2) хватает на две коробки. После практикума первой строкой `main.ts` записали:

      ```ts
      localStorage.setItem('hod-konem:cart:v1', '[{"id":4,"quantity":99},{"id":7,"quantity":1},{"id":2,"quantity":2}]');
      ```

      Что окажется в корзине?
    options:
      - '«Ночной экспресс» × 3 и «Драконья почта» × 2'
      - '«Ночной экспресс» × 99, «Маяк» × 1, «Драконья почта» × 2'
      - 'Ничего: `loadCart()` отбросит запись целиком из-за негодных позиций'
      - '«Ночной экспресс» × 3, «Маяк» × 1, «Драконья почта» × 2'
    explanation: |
      `loadCart()` уменьшает количество до остатка на складе и отбрасывает игры, которых на складе нет: 99 урезано до 3, «Маяка» нет. Эффект тут же сохраняет исправленную корзину (шаг «Практикум: правила склада»).
    step: 05-practice

  - question: |
      Каталог игр приходит с сервера. Где ему место по классификации главы?
    options:
      - 'В `httpResource` или `resource` — это данные сервера'
      - 'В `CartStore` — всё общее для компонентов лежит в хранилище'
      - 'В `localStorage` — чтобы не загружать каталог при запуске'
      - 'В адресе страницы — как строка поиска и фильтры каталога'
    explanation: |
      Хозяин данных сервера — сервер, а приложение держит копию: загружает, показывает загрузку и ошибки, отменяет устаревшие запросы. Это задача `httpResource` и `resource` (глава 11), а не хранилища: если складывать ответы сервера в хранилище руками, оно превращается в самодельный кэш. В адресе живут строка поиска, фильтры и номер страницы, а не сами данные (шаг «Когда нужна библиотека»).
    step: 06-libraries

  - question: |
      Какой довод глава называет поводом подумать о библиотеке состояния вроде NgRx?
    options:
      - 'Нужен журнал: какое действие что изменило в состоянии'
      - 'Состояние читают несколько компонентов в разных местах'
      - 'Корзину нужно сохранять между запусками в `localStorage`'
      - 'Итоги корзины вычисляются из позиций по цепочке'
    explanation: |
      Журнал изменений — сильная сторона классического Store: Redux DevTools показывает, какое действие что изменило. Общее состояние, сохранение в `localStorage` и производные итоги глава сделала средствами самого Angular — сервисом, `effect` и `computed` (шаг «Когда нужна библиотека»).
    step: 06-libraries
