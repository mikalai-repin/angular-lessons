<h1>Каталог</h1>
<input
  #searchBox
  class="search"
  type="search"
  placeholder="Найти игру"
  [value]="q()"
  (input)="setFilters({ q: searchBox.value || null }, true)"
/>

<div class="filters">
  <label>
    <input
      #inStockBox
      type="checkbox"
      [checked]="inStock()"
      (change)="
        setFilters({ inStock: inStockBox.checked || null })
      "
    />
    Только в наличии
  </label>
  <span class="rating-filter">
    Рейтинг от
    <app-rating
      [value]="rating()"
      (valueChange)="setFilters({ rating: $event || null })"
    />
  </span>
  <select
    #sortSelect
    aria-label="Сортировка"
    [value]="sort()"
    (change)="
      setFilters({
        sort:
          sortSelect.value === 'default'
            ? null
            : sortSelect.value,
      })
    "
  >
    <option value="default">По умолчанию</option>
    <option value="cheap">Сначала дешёвые</option>
    <option value="expensive">Сначала дорогие</option>
    <option value="rating">По рейтингу</option>
  </select>
</div>

<div class="grid">
  @for (game of shownGames(); track game.id) {
    <app-game-card [game]="game">
      @if (game.rating >= hitRating) {
        <span
          sticker
          class="sticker"
          [appTooltip]="
            'Рейтинг ' + (hitRating | number) + ' и выше'
          "
          >Хит</span
        >
      }
      @if (game.oldPrice; as oldPrice) {
        <span
          sticker
          class="sticker sale"
          appTooltip="Цена действует до конца дня"
        >
          −{{ 1 - game.price / oldPrice | percent }}
        </span>
      }
    </app-game-card>
  } @empty {
    <div class="empty">
      <p class="muted">Ничего не найдено</p>
      <button class="link-button" (click)="resetFilters()">
        Сбросить фильтры
      </button>
    </div>
  }
</div>
@if (shownCount() < visibleGames().length) {
  <app-load-more (more)="showMore()" />
}
