# Квиз главы «Роутинг». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В `app.config.ts` забыли `provideRouter(routes)`, а `<router-outlet />` в каркасе на месте. Что будет в превью?
    options:
      - Под шапкой пусто и ни одной ошибки — роутер не запущен, навигации нет
      - 'Ошибка NG04002 в консоли — роутер не нашёл ни одного маршрута'
      - Покажется первый маршрут карты — роутер подключится сам по импорту
      - Превью не запустится — `<router-outlet>` без роутера не компилируется
    explanation: |
      Без `provideRouter` роутер не запущен, и навигации не происходит вовсе — пусто и тихо. Так же тихо выглядит забытый `<router-outlet>`: «пустая страница без ошибок» почти всегда значит, что карта, `provideRouter` или `<router-outlet>` не на месте (шаг «Маршруты»).
    step: 01-routes

  - question: |
      Покупатель на странице `/catalog`. Какие ссылки получат класс `active`?

      ```html
      <a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page">Главная</a>
      <a routerLink="/catalog" routerLinkActive="active" ariaCurrentWhenActive="page">Каталог</a>
      ```
    options:
      - Обе — без `exact` ссылка активна, если адрес начинается с её адреса
      - Только «Каталог» — `routerLinkActive` требует полного совпадения адреса
      - Только «Главная» — активной считается первая подходящая ссылка в меню
      - Ни одна — класс `active` ставит не `routerLinkActive`, а `ariaCurrentWhenActive`
    explanation: |
      По умолчанию ссылка активна, если адрес **начинается** с её адреса, а с `/` начинается любой адрес: подчёркнуты обе ссылки, и у обеих `aria-current="page"`. Поэтому у ссылки на главную нужен `[routerLinkActiveOptions]="{ exact: true }"` (шаг «Ссылки»).
    step: 02-links

  - question: |
      Из `provideRouter(routes, withComponentInputBinding())` убрали `withComponentInputBinding()`. Что покажет `/games/4`, если на странице `readonly id = input.required(…)`?
    options:
      - 'Пустую страницу и NG0950 — у обязательного входа нет значения'
      - 'Страницу игры — роутер передаёт параметры во входы всегда'
      - '«Игра не найдена» — во вход `id` придёт `NaN` вместо числа'
      - 'Ошибку NG04002 — маршрут `games/:id` без этой функции не подходит'
    explanation: |
      Без `withComponentInputBinding()` роутер создаёт `GamePage`, но входы компонента не трогает: параметр остаётся внутри роутера, и обязательный вход остаётся без значения — `NG0950: Input is required but no value is available yet.` (шаг «Параметры маршрута»).
    step: 03-params

  - question: |
      Покупатель переходит с `/games/1` на `/games/3`, не уходя со страницы игры. Что сделает роутер с `GamePage`?
    options:
      - Оставит тот же экземпляр и положит во вход `id` новое значение
      - Уничтожит страницу и создаст новую — у адреса другой параметр
      - Ничего — новый `id` страница получит только после перезагрузки
      - Создаст вторую страницу рядом с первой в том же `router-outlet`
    explanation: |
      Маршрут тот же — `games/:id`, — поэтому роутер не пересоздаёт компонент, а только меняет вход. Всё, что зависит от `id`, должно быть реактивным — `computed`, а не значение, вычисленное один раз в конструкторе (шаг «Параметры маршрута»).
    step: 03-params

  - question: |
      Вход каталога объявили без преобразования, а `visibleGames` вызывает `this.q().trim()`. Что будет на `/catalog` без параметров?

      ```ts
      readonly q = input('');
      ```
    options:
      - "Ошибка `Cannot read properties of undefined (reading 'trim')`"
      - Каталог целиком — во входе останется значение по умолчанию `''`
      - Ошибка TypeScript — вход строкового типа не может быть `undefined`
      - 'Ошибка NG0950 — у входа `q` нет значения из адреса'
    explanation: |
      Значение по умолчанию действует, только пока роутер ничего не передал. А роутер передаёт всегда: нет параметра в адресе — во вход приходит `undefined`. TypeScript этого не замечает, поэтому у каждого входа из адреса есть преобразование (шаг «Query-параметры»).
    step: 04-query-params

  - question: |
      Адрес — `/catalog?q=кот`. Что станет с поиском после такого вызова?

      ```ts
      this.router.navigate([], {
        relativeTo: this.route,
        queryParams: { sort: 'cheap' },
      });
      ```
    options:
      - Пропадёт из адреса — останется только переданный параметр `sort`
      - Останется — `navigate` меняет в адресе только переданные параметры
      - Останется — `relativeTo` сохраняет query-параметры текущей страницы
      - Пропадёт вместе с каталогом — `navigate([])` ведёт на главную `/`
    explanation: |
      `navigate([], { relativeTo: this.route })` остаётся на той же странице, но query-параметры не сохраняет сам. Без `queryParamsHandling: 'merge'` в адресе остаются только переданные параметры: смена сортировки стёрла бы поиск (шаг «Query-параметры»).
    step: 04-query-params

  - question: |
      В детях маршрута `account` у переадресации убрали `pathMatch`. Что будет?

      ```ts
      { path: '', redirectTo: 'favorites' },
      ```
    options:
      - 'Магазин не запустится — ошибка NG04014 при проверке карты маршрутов'
      - 'Всё как раньше — переадресация с пустого пути не требует `pathMatch`'
      - 'Ошибка NG04014 появится только при переходе в кабинет `/account`'
      - '«Заказы» тоже будут уводить в избранное, но без ошибок в консоли'
    explanation: |
      Роутер проверяет карту маршрутов при запуске, и ошибка в карте — ошибка всего приложения: `NG04014: … please provide 'pathMatch'`. Angular требует явно указать `pathMatch` у переадресации с пустого пути, потому что по префиксу она сработала бы и для `/account/orders` (шаг «Вложенные маршруты»).
    step: 05-child-routes

  - question: |
      В шаблоне `Account` (маршрут `/account`) стоит `<a routerLink="orders">`. Куда ведёт ссылка?
    options:
      - На `/account/orders` — от маршрута компонента, где стоит ссылка
      - На `/orders` — путь в `routerLink` всегда считается от корня сайта
      - На `/account/favorites/orders` — от текущего адреса в браузере
      - Никуда — без `/` в начале `routerLink` выдаст ошибку в консоли
    explanation: |
      Ссылка без косой черты в начале — относительная: она строится от маршрута компонента, в шаблоне которого стоит. Для `Account` это `/account`. `routerLink="/orders"` с косой чертой — абсолютная ссылка от корня (шаг «Вложенные маршруты»).
    step: 05-child-routes

  - question: |
      Кабинет загружается через `loadChildren`, а в `account.routes.ts` первая строка — `console.log('Кабинет: модуль загружен')`. Покупатель открывает главную, потом кабинет, главную и снова кабинет. Сколько раз появится строка?
    options:
      - Один раз — при первом переходе в кабинет
      - Один раз — сразу при запуске на главной
      - Дважды — при каждом переходе в кабинет
      - Ни разу — в превью ленивые модули не грузятся
    explanation: |
      Роутер вызывает `loadChildren`, когда адрес впервые начнётся с `/account`. Модуль загружается один раз, дальше роутер берёт маршруты из памяти. При запуске строка появится только с предзагрузкой `withPreloading(PreloadAllModules)` (шаг «Ленивая загрузка»).
    step: 06-lazy-loading

  - question: |
      Корзина пуста, покупатель вводит в адресной строке `/checkout`. Что будет?

      ```ts
      export const cartNotEmptyGuard: CanActivateFn = () => {
        const cart = inject(CartStore);
        const router = inject(Router);
        return cart.items().length > 0 || router.createUrlTree(['/cart']);
      };
      ```
    options:
      - Адрес станет `/cart` — роутер отменит переход и начнёт новый туда
      - 'Ошибка NG04002 — маршрут `checkout` пропущен, других подходящих нет'
      - Откроется `/checkout`, а `UrlTree` лишь запомнит адрес для «Назад»
      - Ошибка — гард обязан вернуть `true` или `false`, а не `UrlTree`
    explanation: |
      `UrlTree` из `router.createUrlTree([…])` — это переадресация: роутер отменяет текущий переход и начинает новый по этому адресу. NG04002 давал `canMatch` с ответом `false` (шаг «Гарды»).
    step: 07-guards

  - question: |
      Чем гард `canMatch`, вернувший `false`, отличается от `canActivate`, вернувшего `false`?
    options:
      - '`canMatch` пропускает маршрут, роутер пробует следующие; `canActivate` отменяет переход'
      - '`canMatch` отменяет переход совсем; `canActivate` пропускает маршрут и пробует следующие'
      - '`canMatch` срабатывает после резолверов; `canActivate` — до подбора маршрута по адресу'
      - 'Ничем — оба гарда отменяют переход, и покупатель остаётся там, где был'
    explanation: |
      `canMatch` срабатывает раньше всех, когда роутер только подбирает маршрут: `false` — маршрут пропускается, будто его нет в карте. `false` из `canActivate` отменяет переход, и покупатель остаётся там, где был (шаг «Гарды»).
    step: 07-guards

  - question: |
      Своей `TitleStrategy` нет, у маршрута корзины убрали `title`. Покупатель открывает страницу игры «Остров сокровищ», а потом корзину. Что будет во вкладке?
    options:
      - «Остров сокровищ» — без `title` стратегия не трогает `document.title`
      - Пустая строка — стратегия очищает заголовок страницы без `title`
      - «Корзина» — роутер возьмёт заголовок из `<h1>` новой страницы
      - Адрес страницы `/cart` — его роутер ставит вместо пропущенного `title`
    explanation: |
      Стратегия по умолчанию не трогает `document.title`, если у страницы нет заголовка, и в нём остаётся заголовок прошлой страницы. Своя `ShopTitleStrategy` от этого защищает: без `title` она ставит просто «Ход конём» (шаг «Заголовки и резолверы»).
    step: 08-titles

  - question: |
      Маршрут `'**'` поставили **первым** в карте. Что покажет адрес `/`?

      ```ts
      export const routes: Routes = [
        { path: '**', component: NotFound },
        { path: '', component: Home },
        …
      ];
      ```
    options:
      - '«Нет такой страницы» — `**` подходит к любому адресу и стоит первым'
      - 'Главную — роутер сам проверяет `**` после всех остальных маршрутов'
      - 'Главную — `**` срабатывает только на адресах, где есть сегменты'
      - 'Ничего — роутер остановит запуск с ошибкой о порядке маршрутов'
    explanation: |
      Путь `'**'` подходит к любому адресу, а роутер перебирает маршруты по порядку и берёт первый подходящий. Поэтому `'**'` всегда последний: поставленный первым, он покажет «Нет такой страницы» на любом адресе, даже на `/` (шаг «404, переадресации и переходы»).
    step: 09-not-found

  - question: |
      Зачем `computed` хлебных крошек читает `router.lastSuccessfulNavigation()`, хотя крошки строятся по `router.routerState`?
    options:
      - '`routerState` — не сигнал, а чтение сигнала пересчитает крошки после перехода'
      - 'Без этого вызова `routerState.snapshot` пуст до первого щелчка по ссылке'
      - 'Этот вызов запускает навигацию, после которой роутер заполнит `routerState`'
      - 'Так `computed` получает дерево маршрутов — у `routerState` его нет'
    explanation: |
      `computed` не узнает об изменении `routerState`: это не сигнал. `lastSuccessfulNavigation` — сигнал с последней завершившейся навигацией: прочитав его, `computed` пересчитывается после каждого перехода (шаг «Практикум: хлебные крошки»).
    step: 10-practice

  - question: |
      В каком порядке роутер проходит этапы навигации на страницу игры с `loadComponent` и резолвером?
    options:
      - 'Распознавание, гарды, резолверы, загрузка компонента, активация'
      - 'Загрузка компонента, распознавание, гарды, резолверы, активация'
      - 'Распознавание, загрузка компонента, резолверы, гарды, активация'
      - 'Гарды, распознавание, загрузка компонента, резолверы, активация'
    explanation: |
      Сначала адрес разбирается и подбираются маршруты (здесь же переадресации и `loadChildren`), потом гарды, затем резолверы, и только после них — `loadComponent`: компонент нужен только для показа, а показывать, может быть, и не придётся, если гард не пустит (шаг «Под капотом: как роутер находит страницу»).
    step: 11-router-inside
