# Квиз главы «HTTP и данные». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Во вкладке «Сеть» включили «Ошибку 500». Что будет с таким кодом?

      ```ts
      fetch('/api/games?sort=rating&size=4')
        .then((response) => response.json())
        .then((page: GamesPage) => this.hits.set(page.items));
      ```
    options:
      - 'Ошибок нет: промис выполнится, а в `hits` попадёт `undefined`'
      - 'Промис отклонится, и в консоли появится необработанная ошибка 500'
      - 'Аннотация `page: GamesPage` проверит ответ и бросит `TypeError`'
      - 'Angular перехватит ответ и выведет в консоль `HttpErrorResponse`'
    explanation: |
      Для `fetch` любой ответ сервера — успех, даже 404 или 500: промис отклоняется, только когда ответа нет совсем. В теле ответа 500 нет `items`, поэтому в сигнал записывается `undefined`. Аннотация типа — обещание компилятору, а не проверка того, что пришло по сети (шаг «Данные с сервера»).
    step: 01-server

  - question: |
      Что произойдёт, если оставить только эту строку, без `.subscribe(…)`?

      ```ts
      this.http.get<GamesPage>('/api/games', {
        params: { sort: 'rating', size: 4 },
      });
      ```
    options:
      - Запроса не будет — Observable запускается только подпиской
      - Запрос уйдёт сразу, как у `fetch`, но ответ никто не получит
      - Запрос уйдёт при первой проверке шаблона компонента `Home`
      - Запрос уйдёт, а ответ `HttpClient` сохранит до первой подписки
    explanation: |
      `get` возвращает Observable — описание работы, а не саму работу. Запрос уходит при подписке, а отписка его отменяет. Без `subscribe` во вкладке «Сеть» запроса нет вообще (шаг «HttpClient»).
    step: 02-http-client

  - question: |
      В Angular 22 `HttpClient` доступен через `inject` и без `provideHttpClient()`. Зачем же её пишут в `app.config.ts`?
    options:
      - 'Через неё передают настройки клиента: интерцепторы, `withXhr()`'
      - Без неё `inject(HttpClient)` бросит ошибку при первом же запросе
      - Она переключает клиент с `XMLHttpRequest` на `fetch` браузера
      - Она включает разбор JSON — без неё `get` вернёт текст ответа
    explanation: |
      `HttpClient` объявлен как сервис корневого инжектора (`providedIn: 'root'`), поэтому работает и без этой строки — с настройками по умолчанию. `provideHttpClient(withInterceptors([…]))` и `provideHttpClient(withXhr())` — способ эти настройки поменять. Без строки хиты на месте: JSON разбирает сам `HttpClient`, а `fetch` и так используется по умолчанию (шаг «HttpClient»).
    step: 02-http-client

  - question: |
      Подборка загрузилась с ошибкой. Сервер починили, покупатель нажал «Повторить». Что он увидит, пока идёт повторный запрос?

      ```html
      @if (hits.hasValue()) {
        … карточки …
      } @else if (hits.error()) {
        <p>Не удалось загрузить хиты. <button (click)="hits.reload()">Повторить</button></p>
      } @else if (hits.isLoading()) {
        … заглушки …
      }
      ```
    options:
      - '«Не удалось загрузить» — `error()` всё ещё помнит прошлую ошибку'
      - 'Заглушки — `reload()` сразу сбрасывает ошибку в `undefined`'
      - 'Пустое место — во время повтора ни одна ветка не подходит'
      - 'Сразу прежние карточки — `reload()` возвращает последний ответ'
    explanation: |
      Пока идёт повторный запрос, `error()` возвращает прошлую ошибку, и ветка с ошибкой стоит раньше загрузки. Покупателю покажется, что кнопка не работает. Поэтому сначала проверяют `isLoading()`, потом ошибку (шаг «httpResource»).
    step: 03-http-resource

  - question: |
      Включена «Ошибка 500». Что покажет такой шаблон каталога?

      ```html
      @if (games.value()) {
        … сетка …
      } @else if (games.isLoading()) {
        … заглушки …
      } @else {
        <p>Не удалось загрузить каталог.</p>
      }
      ```
    options:
      - 'Пустоту под фильтрами, а в консоли — ошибку `ResourceValueError`'
      - 'Сообщение «Не удалось загрузить» — `value()` вернёт `undefined`'
      - 'Заглушки — при ошибке ресурс остаётся в состоянии загрузки'
      - 'Пустую сетку — при ошибке `value()` возвращает пустой ответ'
    explanation: |
      У ресурса с ошибкой `value()` не возвращает `undefined`, а бросает исключение. Шаблон получил его и не смог обновиться дальше. Отсюда правило: сначала `hasValue()` или проверка ошибки, потом `value()` (шаг «Параметры запроса из сигналов»).
    step: 04-params

  - question: |
      Параметр `q` запроса каталога читается прямо из входа `this.q()`. Покупатель быстро набирает «кот», задержка ответа 300 мс. Что будет во вкладке «Сеть»?
    options:
      - Четыре запроса — без поиска, «к», «ко», «кот»; «к» и «ко» отменены
      - Один запрос на «кот» — ресурс сам ждёт, пока покупатель допечатает
      - Четыре запроса, все доходят до конца, на экране — последний пришедший
      - Один запрос без поиска — ресурс не следит за изменениями входов
    explanation: |
      Ресурс запоминает сигналы, прочитанные в функции запроса, и на новые параметры отменяет старый запрос и отправляет новый. На экране всегда ответ на последний запрос. Но отменённые запросы всё равно ушли на сервер — это исправляет `debounced` (шаг «Параметры запроса из сигналов»).
    step: 04-params

  - question: |
      Что будет в этом резолвере при открытии `/games/4`?

      ```ts
      export const gameTitleResolver: ResolveFn<string> = async (route) => {
        await Promise.resolve();
        const http = inject(HttpClient);
        …
      };
      ```
    options:
      - 'Ошибка NG0203: после `await` контекста внедрения у функции уже нет'
      - 'Всё работает — в резолвере `inject` можно вызывать где угодно'
      - 'Всё работает — роутер держит контекст, пока резолвер не закончит'
      - 'Ошибка TypeScript — `inject` нельзя вызывать в `async`-функции'
    explanation: |
      Резолвер получает контекст внедрения лишь на время синхронной части вызова. После первого `await` функция продолжается позже, когда контекста уже нет: `NG0203`, резолвер падает, и роутер отменяет навигацию. Поэтому все `inject` — до первого `await` (шаг «Ошибки»).
    step: 05-errors

  - question: |
      На странице игры `game = httpResource<Game>(() => `/api/games/${this.id()}`)`. Роутер переходит с `/games/4` на `/games/9`. Что происходит?
    options:
      - Страница та же, меняется вход `id`, и ресурс загружает игру 9
      - Страница создаётся заново, и новый ресурс загружает игру 9
      - Ресурс не замечает перехода, и на странице остаётся игра 4
      - Ресурс загружает обе игры и показывает ту, что пришла последней
    explanation: |
      Роутер не пересоздаёт страницу, а только меняет её вход `id`. Функция запроса читает этот вход, поэтому ресурс следит за ним. Мы проверили: конструктор `GamePage` второй раз не вызывается, а в «Сети» появляется `GET /api/games/9` (шаг «Ошибки»).
    step: 05-errors

  - question: |
      Загрузчик `resource` вызывает `fetch`, но не передаёт ему `abortSignal`. Что будет, когда список избранного изменится раньше ответа?
    options:
      - Старые запросы дойдут до конца, но ресурс выбросит их результат
      - Ответ устаревшего запроса попадёт на экран, если придёт последним
      - Ресурс отменит их сам — передавать `abortSignal` не обязательно
      - Ресурс не заметит изменения — без `abortSignal` нет перезагрузки
    explanation: |
      `abortSignal` — сигнал отмены из браузерного `AbortController`, его понимает `fetch`. Передать его дальше — задача загрузчика. Сам ресурс только срабатывает сигналом. Без передачи в `fetch` устаревшие запросы доходят до конца, хотя их результат ресурс всё равно выбрасывает (шаг «resource»).
    step: 06-resource

  - question: |
      `query = debounced(() => this.q(), 300)`. Что возвращает `this.query.value()`, пока покупатель печатает?
    options:
      - Прежнюю строку, которую ресурс уже «догнал»
      - '`undefined`, как у ресурса во время загрузки'
      - Каждую новую строку сразу после нажатия клавиши
      - Пустую строку, пока не пройдёт пауза 300 мс
    explanation: |
      `debounced` возвращает ресурс. Пока покупатель печатает, ресурс «загружается», а `value()` возвращает прежнее значение. Через 300 мс тишины `value()` становится новой строкой — и запрос каталога уходит раз в паузу (шаг «Поиск с задержкой»).
    step: 07-debounced

  - question: |
      Почему последний полученный ответ каталога `found` сделан `linkedSignal`, а не `computed`?
    options:
      - '`computed` не помнит прежних значений — сетка снова замигает'
      - '`computed` не следит за `hasValue()`: это метод, а не сигнал'
      - '`linkedSignal` сам отменяет устаревшие запросы ресурса каталога'
      - '`computed` пересчитывается только при самой первой загрузке'
    explanation: |
      При новых параметрах у ресурса нет значения. `linkedSignal` получает своё прежнее значение в `previous` и оставляет его, пока грузится новый ответ. С `computed` мигание возвращается. Следить за ресурсом `computed` умеет: `hasValue()` читает сигналы ресурса внутри (шаги «httpResource» и «Поиск с задержкой»).
    step: 07-debounced

  - question: |
      Задержка 1500 мс. Покупатель отправил отзыв через `this.http.post(…).subscribe(…)` и сразу ушёл в «Каталог». Что будет с запросом?
    options:
      - '`HttpClient` доведёт его до конца — в «Сети» статус `201`'
      - '`HttpClient` отменит его, как ресурс при уходе со страницы'
      - 'Angular задержит переход в «Каталог» до ответа сервера'
      - 'Запрос уйдёт заново, когда покупатель вернётся к игре'
    explanation: |
      Ресурс сам отменяет загрузку, и для изменения данных это опасно: отзыв мог бы не дойти. Поэтому изменения отправляют через `HttpClient` — запрос делает ровно одно действие и не отменяется сам. Вернувшись к игре, покупатель увидит свой отзыв с сервера (шаг «Изменение данных»).
    step: 08-mutations

  - question: |
      В `addReview` черновик отзыва добавили через `reviews.update(…)`, а у `subscribe` убрали обработчик `error`. Что будет, если сервер ответит 500?
    options:
      - Отзыв навсегда останется с «отправляем…», в консоли — ошибка
      - Ресурс сам уберёт черновик, ведь запрос закончился ошибкой
      - Ресурс перезагрузит отзывы с сервера, и черновик пропадёт
      - Отзыв станет обычным, будто сервер его всё-таки сохранил
    explanation: |
      Черновик записан в ресурс на месте, и убрать его может только наш откат в `error`. Без него отзыв остаётся в списке, хотя сервер его не сохранил, а в консоли — `ERROR HttpErrorResponse`. Оптимистичное обновление без отката обманывает покупателя (шаг «Изменение данных»).
    step: 08-mutations

  - question: |
      В практикуме «Показать ещё» выводят только при `!games.isLoading()`. Зачем это условие?
    options:
      - '`LoadMore` сработает сам при появлении и попросит лишнюю страницу'
      - 'Во время загрузки `found()` — `undefined`, и `total` не прочитать'
      - 'Без него номер страницы сбрасывается в 1 при каждой загрузке'
      - 'Пока страница грузится, `shownGames()` пуст, и кнопка висит под пустотой'
    explanation: |
      `LoadMore` срабатывает и сам, когда появляется на экране. Если оставить его во время загрузки, он может попросить следующую страницу, пока текущая ещё не пришла. Прежний ответ и список при этом не пропадают: `found` и `shownGames` — это `linkedSignal` (шаги «Поиск с задержкой» и «Практикум: каталог страницами»).
    step: 09-practice

  - question: |
      Покупатель отправил отзыв, и сервер ответил сохранённым отзывом, который заменил черновик через `update`. Какой теперь статус у ресурса `reviews`?
    options:
      - "`'local'` — значение записано через `update`, а не загружено"
      - "`'resolved'` — ресурс получил ответ сервера на запрос"
      - "`'reloading'` — после отправки ресурс перезагружает отзывы"
      - "`'idle'` — после `update` ресурсу больше нечего загружать"
    explanation: |
      `set()` и `update()` переводят ресурс в статус `local`. Ответ сервера тоже записан через `update`, поэтому в журнале `Отзывы: resolved → local`, и статус так и остаётся `local` — до смены параметров (шаг «Под капотом: жизненный цикл ресурса»).
    step: 10-resource-inside
