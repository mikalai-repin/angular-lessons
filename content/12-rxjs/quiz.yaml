# Квиз главы «RxJS в Angular». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Что окажется в консоли за первые 3,5 секунды и после них?

      ```ts
      const ticks = new Observable<number>((subscriber) => {
        console.log('Подписка: запускаем таймер');
        let n = 0;
        const timer = setInterval(() => subscriber.next(++n), 1000);
        return () => {
          console.log('Отписка: останавливаем таймер');
          clearInterval(timer);
        };
      });

      const subscription = ticks.subscribe((n) => console.log('Тик', n));
      setTimeout(() => subscription.unsubscribe(), 3500);
      ```
    options:
      - '«Подписка», «Тик» 1–3, «Отписка» — и больше ничего, таймер остановлен'
      - '«Подписка», «Тик» 1–3, «Отписка», а потом «Тик 4», «Тик 5» без конца'
      - '«Подписка» и «Тик» 1–3 — функцию уборки RxJS вызывает только при ошибке'
      - 'Ничего — функция подписки запустится, только когда у потока есть `pipe`'
    explanation: |
      Функция внутри `new Observable` запускается при подписке, а функцию уборки, которую она вернула, RxJS вызывает при отписке (или завершении потока): `clearInterval` останавливает таймер (шаг «Observable»).
    step: 01-observable

  - question: |
      Сколько запросов `GET /api/games/1` появится во вкладке «Сеть»?

      ```ts
      const game = inject(HttpClient).get('/api/games/1');
      game.subscribe();
      game.subscribe();
      ```
    options:
      - 'Два — `HttpClient.get` холодный: запрос на каждую подписку'
      - 'Один — второй подписчик получит тот же ответ, что и первый'
      - 'Один — запрос уходит в момент вызова `get`, а не при подписке'
      - 'Ни одного — без функции в `subscribe` запрос не отправляется'
    explanation: |
      Функция подписки холодного потока выполняется для каждого подписчика заново. Один объект Observable, но две подписки — два запроса. Горячий поток, как `Router.events`, наоборот, шлёт одни события всем, кто подписан в этот момент (шаг «Observable»).
    step: 01-observable

  - question: |
      Что делает цепочка `inject(Router).events.pipe(filter(…), map(…))`, пока на неё никто не подписался?
    options:
      - 'Ничего не запускает — обработка начнётся с подписки на цепочку'
      - 'Убирает из `Router.events` все события, кроме `NavigationEnd`'
      - 'Собирает адреса в массив и отдаёт его, когда навигация закончится'
      - 'Сразу начинает получать события и копит адреса до первой подписки'
    explanation: |
      Оператор возвращает новый поток и не меняет исходный. Цепочка `pipe(filter(…), map(…))` только описывает обработку, как `HttpClient.get` описывает запрос: работа начнётся с `subscribe`, и каждая подписка получит свою цепочку (шаг «Операторы»).
    step: 02-operators

  - question: |
      Из потока просмотров страниц `events.pipe(filter(…), map((event) => event.urlAfterRedirects))` убрали `filter`. Что будет?
    options:
      - 'Редактор подчеркнёт `urlAfterRedirects`, а в журнале 12 записей на переход'
      - 'Превью не запустится, пока TypeScript не перестанет ругаться на `urlAfterRedirects`'
      - 'Ошибок нет, а в журнале по-прежнему один просмотр страницы на каждый переход'
      - 'Поток закончится ошибкой на первом событии, у которого нет `urlAfterRedirects`'
    explanation: |
      Без `filter` в `map` приходит любое событие роутера, а у `NavigationStart`, например, нет `urlAfterRedirects` — редактор это подчеркнёт. Ошибки типов не мешают выполнению: на каждый переход 12 записей, то с адресом, то с `undefined` (шаг «Операторы»).
    step: 02-operators

  - question: |
      В быстром поиске покупатель напечатал «ко», а затем «кот», пока ответ на «ко» ещё не пришёл. Что сделает `switchMap`?
    options:
      - 'Отпишется от запроса на «ко» — запрос отменится, ответа не будет'
      - 'Дождётся ответа на «ко», выдаст его, а затем отправит запрос на «кот»'
      - 'Оставит оба запроса и выдаст оба ответа в том порядке, в каком они придут'
      - 'Пропустит текст «кот», потому что запрос на «ко» ещё не закончился'
    explanation: |
      Когда приходит новое значение, `switchMap` отписывается от прежнего внутреннего потока и подписывается на новый, а отписка у `HttpClient` — отмена запроса. Дождаться прежнего — `concatMap`, оставить оба — `mergeMap`, пропустить новое — `exhaustMap` (шаг «Поиск с отменой»).
    step: 03-switch-map

  - question: |
      Почему `catchError` в быстром поиске стоит **внутри** `switchMap`, на потоке одного запроса?
    options:
      - 'Снаружи ошибка закончила бы весь поток поиска, а не один запрос'
      - '`switchMap` глотает ошибки внутренних потоков, и снаружи их не увидеть'
      - 'Так `distinctUntilChanged` пропустит после сбоя тот же текст ещё раз'
      - 'Внутри `switchMap` оператор `catchError` сам повторяет неудачный запрос'
    explanation: |
      После ошибки поток закончен. Ошибка запроса, которую не поймали внутри `switchMap`, закончила бы весь поток поиска — подписка умрёт, и поиск не будет работать до перезагрузки. Внутри ошибка заканчивает только маленький поток запроса, а `catchError` подставляет вместо неё `of([])` — без повтора. Тот же текст после сбоя `distinctUntilChanged` не пропустит (шаг «Поиск с отменой»).
    step: 03-switch-map

  - question: |
      Поток подсказок построен на `toObservable(this.text)`. Метод `search` пишет в сигнал дважды. Покупатель напечатал «кот». Какие значения после начальной пустой строки получит поток?

      ```ts
      protected search(text: string) {
        this.text.set(text);
        this.text.set(text.toUpperCase());
      }
      ```
    options:
      - '`"К"`, `"КО"`, `"КОТ"` — эффект выполнится, когда оба `set` уже прошли'
      - '`"к"`, `"К"`, `"ко"`, `"КО"`, `"кот"`, `"КОТ"` — каждое значение сигнала'
      - '`"к"`, `"ко"`, `"кот"` — второй `set` в том же методе не учитывается'
      - 'Только `"КОТ"` — `toObservable` сам ждёт паузы в вводе покупателя'
    explanation: |
      `toObservable` создаёт эффект, который читает сигнал и отправляет значение в поток. Значения приходят не в момент `set`, а когда выполняется эффект: два `set` подряд — один запуск, и поток видит только последнее значение (шаг «Мост к сигналам»).
    step: 04-signals-interop

  - question: |
      Что будет, если вызвать `toSignal(of(1))` внутри метода `search`, который вызывает обработчик `(input)`?
    options:
      - 'Ошибка `NG0203`: `toSignal` нужен `DestroyRef`, а его даёт контекст внедрения'
      - 'Ошибка `toSignal() cannot be called from within a reactive context`'
      - 'Ошибки нет: `toSignal` подпишется лениво, при первом чтении сигнала'
      - 'Ошибки нет, но подписку придётся отменить вручную через `unsubscribe`'
    explanation: |
      `toSignal` подписывается на поток и сам отписывается при уничтожении компонента или сервиса — для этого он берёт `DestroyRef`. Поэтому он работает только в контексте внедрения — в инициализаторе поля или конструкторе. В обработчике — ошибка `NG0203`, как у `effect` и `inject`. Ошибка про reactive context — другой случай: вызов внутри `computed` или эффекта (шаг «Мост к сигналам»).
    step: 04-signals-interop

  - question: |
      «Избранное» загружает игры через `forkJoin(ids.map((id) => this.loadGame(id)))`. Из `loadGame` убрали `catchError`, а одной игры больше нет — сервер ответил 404. Что покажет страница?
    options:
      - '«Не удалось загрузить избранное» — ошибка закончила весь `forkJoin`'
      - 'Все игры, кроме пропавшей, — `forkJoin` пропускает потоки с ошибкой'
      - 'Все игры, а на месте пропавшей — пустую карточку со значением `null`'
      - 'Только игры, ответы на которые пришли раньше ответа с ошибкой 404'
    explanation: |
      `forkJoin` ждёт, пока завершится каждый поток, и выдаёт массив последних значений. Если любой поток закончился ошибкой, `forkJoin` тоже заканчивается ошибкой и отписывается от остальных. Поэтому `loadGame` заменяет 404 на `of(null)`, а остальные ошибки пробрасывает через `throwError` (шаг «rxResource»).
    step: 05-rx-resource

  - question: |
      Часы на странице игры переписали так. Покупатель ушёл в каталог и вернулся на игру кнопкой «Назад». Что в консоли?

      ```ts
      interval(1000)
        .pipe(
          tap((n) => console.log('Тик', n)),
          map(() => Date.now()),
        )
        .subscribe((time) => now.set(time));
      ```
    options:
      - 'Два счётчика вперемешку — старый таймер не остановился, рядом новый'
      - 'Один счётчик с нуля — Angular отписал поток при уничтожении страницы'
      - 'Один счётчик продолжает старый — `interval` один на всё приложение'
      - 'Тиков нет — `interval` завершается, когда страницу игры уничтожили'
    explanation: |
      `interval` никогда не завершается сам, а подписку, созданную своими руками, никто не отменил. Это утечка подписки: каждый визит добавляет таймер. Лечится `takeUntilDestroyed()` последним оператором или `toSignal` (шаг «Уборка подписок»).
    step: 06-cleanup

  - question: |
      Какая из подписок в компоненте страницы требует `takeUntilDestroyed()`?
    options:
      - '`inject(Router).events.subscribe(…)` в конструкторе'
      - '`toSignal(interval(1000), { initialValue: 0 })` в поле'
      - '`rxResource` со `stream`, который возвращает `forkJoin`'
      - '`left$ | async` в шаблоне компонента'
    explanation: |
      `toSignal`, `rxResource` и пайп `async` подписываются и отписываются сами. А подписка на `router.events`, `interval`, `Subject` сервиса или события `window`, сделанная вручную, переживёт компонент, если её не убрать (шаг «Уборка подписок»).
    step: 06-cleanup

  - question: |
      Интерцепторы подключили в порядке `[retryInterceptor, loggingInterceptor]` и включили «Ошибку 500». Лог пишет на каждый адрес три строки: `308 мс`, `1112 мс`, `1916 мс`. Почему время копится?

      ```ts
      export const loggingInterceptor: HttpInterceptorFn = (req, next) => {
        const started = performance.now();
        return next(req).pipe(tap({ /* лог со временем от started */ }));
      };
      ```
    options:
      - 'Функция интерцептора выполнилась один раз, `retry` лишь подписывается заново'
      - 'Каждую следующую попытку учебный сервер обрабатывает дольше предыдущей'
      - 'Лог считает время от запуска приложения, а не от начала этого запроса'
      - '`retry` вызывает интерцептор заново, но `started` хранится в кэше запроса'
    explanation: |
      `retry` не вызывает интерцептор заново — он заново подписывается на тот же поток. Код в начале функции (`started`) выполнился один раз, а `tap` внутри потока — при каждой подписке (шаг «Интерцепторы»).
    step: 07-interceptors

  - question: |
      Кэш поставили первым: `withInterceptors([cacheInterceptor, loggingInterceptor, retryInterceptor])`. Что изменится в логе на странице игры?
    options:
      - 'Ответы из кэша пропадут из лога — до лога такой запрос не дойдёт'
      - 'Ничего — лог видит каждый ответ, на каком бы месте в списке он ни стоял'
      - 'Кэш перестанет отвечать — первый в списке интерцептор обязан вызвать `next`'
      - 'Ответы из кэша останутся в логе, но со временем ответа сервера вместо 0 мс'
    explanation: |
      Запрос проходит интерцепторы сверху вниз. Кэш со свежим ответом возвращает `of(cached)` и не вызывает `next`, поэтому до лога ниже него запрос не доходит. Поэтому кэш ставят после лога, но перед повтором (шаг «Кэш запросов»).
    step: 08-cache

  - question: |
      Черновик комментария сохраняет подписка на `toObservable(this.comment)` с операторами `debounceTime(500)`, `distinctUntilChanged()` и `takeUntilDestroyed()`. Покупатель напечатал букву и сразу ушёл со страницы — до сохранения оставалось меньше 500 мс. Почему буква не потеряется?
    options:
      - 'Поток `toObservable` завершится, и `debounceTime` выдаст ждущее значение'
      - '`takeUntilDestroyed` откладывает уничтожение компонента на время паузы'
      - 'Angular перед уходом со страницы сам выполняет все отложенные таймеры'
      - '`toObservable` сам пишет каждое значение сигнала в `localStorage`'
    explanation: |
      Когда компонент уничтожается, поток `toObservable` завершается. `debounceTime`, получив завершение, не выбрасывает ждущее значение, а сразу выдаёт его. С `Subject` из обработчика `(input)` завершать поток было бы некому, и значение пропало бы (шаг «Практикум: черновик комментария»).
    step: 09-practice

  - question: |
      Что выведет RxJS после `price$.next(2000)`?

      ```ts
      const price$ = new BehaviorSubject(1000);
      const discounted$ = price$.pipe(map((price) => price * 0.9));
      combineLatest([price$, discounted$]).subscribe(([price, discounted]) =>
        console.log(`RxJS: ${price} → ${discounted}`),
      );

      price$.next(2000);
      ```
    options:
      - 'Две строки — `2000 → 900`, затем `2000 → 1800`'
      - 'Одну строку `2000 → 1800` — `combineLatest` ждёт оба потока'
      - 'Одну строку `2000 → 900` — `map` пересчитает скидку при чтении'
      - 'Ничего — `combineLatest` выдаёт пару только при подписке'
    explanation: |
      Поток проталкивает значения: `combineLatest` сначала узнаёт о новой цене напрямую и выдаёт пару со старой скидкой, а затем — о новой скидке через `map`. `2000 → 900` — промежуточное состояние. Сигналы вытягивают значение при чтении, и `computed` покажет только `2000 → 1800` (шаг «Под капотом: сигналы и RxJS»).
    step: 10-signals-vs-rxjs
