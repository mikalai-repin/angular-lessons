# Квиз главы «Формы». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Где хранятся данные формы, созданной `form(this.model)`?
    options:
      - 'В сигнале `model`: форма не копирует данные, а работает поверх него'
      - 'Внутри формы: сигнал `model` задаёт только начальные значения полей'
      - 'В элементах `<input>`: форма читает их значения при отправке'
      - 'В копии модели, которую форма синхронизирует с `model` эффектом'
    explanation: |
      Модель — единственный источник правды. Покупатель напечатал букву — изменилась модель; код изменил модель — поле показало новое значение (шаг «Модель формы»).
    step: 01-form-model

  - question: |
      Что будет в превью с такой привязкой?

      ```html
      <input [formField]="loginForm.email()" />
      ```
    options:
      - 'Ошибка `TypeError: this.field(...) is not a function`'
      - 'Поле покажет значение e-mail, но ввод не попадёт в модель'
      - 'Всё работает: скобки у поля формы необязательны'
      - 'Ошибка `NG0303`: у `<input>` нет свойства `formField`'
    explanation: |
      В `[formField]` передают само поле, без скобок. Со скобками директива получает состояние поля и пытается вызвать его как поле. AOT поймал бы ошибку при сборке — `TS2322` (шаг «Модель формы»).
    step: 01-form-model

  - question: |
      Метод удаления открытки собирает **новые** объекты: `postcards.filter(…).map((p) => ({ to: p.to, text: p.text }))`. Что станет с состоянием «тронуто» у оставшихся открыток?
    options:
      - 'Сбросится: для формы новые объекты — это новые открытки'
      - 'Сохранится: форма сопоставляет открытки по индексу в массиве'
      - 'Сохранится: форма сравнивает открытки по значениям их полей'
      - 'Сохранится: «тронуто» лежит в модели рядом с текстом открытки'
    explanation: |
      Форма узнаёт элемент массива по метке-символу, которую записывает в сам объект. Копия через `{ ...postcard }` метку сохраняет, а собранный заново объект — нет: для формы это новая открытка с нетронутыми полями (шаг «Под капотом: дерево полей»).
    step: 12-forms-inside

  - question: |
      В зонлесс-приложении реактивную форму меняют из таймера: `setTimeout(() => form.controls.email.setValue('user@'), 1000)`. Шаблон выводит `{{ form.value.email }}`. Что покажет страница через секунду?
    options:
      - 'В поле — `user@`, а текст в шаблоне останется прежним до следующей проверки'
      - 'И в поле, и в тексте шаблона — `user@`: контрол сообщает Angular об изменении'
      - 'Ничего не изменится: поле ввода обновляется только при вводе покупателя'
      - 'Ошибку: менять контрол вне события шаблона в зонлесс-приложении нельзя'
    explanation: |
      Значение в поле директива записывает сама. А шаблон читает обычное свойство, не сигнал, — Angular не знает, что пора проверить компонент. С zone.js проверка шла после любого `setTimeout` (шаг «Реактивные формы»).
    step: 11-reactive-forms

  - question: |
      Чем отличаются `touched()` и `dirty()` у поля?
    options:
      - '`touched` — покупатель ушёл из поля, `dirty` — покупатель изменил значение'
      - '`touched` — значение изменили кодом, `dirty` — изменил покупатель'
      - '`touched` — в поле есть ошибки, `dirty` — значение отличается от начального'
      - '`touched` — поле в фокусе сейчас, `dirty` — поле хотя бы раз было в фокусе'
    explanation: |
      Поле «тронуто», когда покупатель побывал в нём и ушёл. «Изменено» — когда покупатель что-то напечатал; запись в модель кодом (кнопка «Заполнить тестовыми данными») поле изменённым не делает (шаг «Проверка полей»).
    step: 02-validation

  - question: |
      Покупатель нажал «Войти», а в форме есть ошибки. Что сделает отправка формы?
    options:
      - 'Пометит все поля тронутыми и не вызовет `action`'
      - 'Вызовет `action`, а ошибки покажет после ответа сервера'
      - 'Ничего: кнопку отправки Angular блокирует сам'
      - 'Покажет ошибки только у полей, которые покупатель трогал'
    explanation: |
      Отправка сначала помечает все поля тронутыми — ошибки появляются и в нетронутых полях, — а если ошибки есть, `action` не вызывается и запроса нет (шаг «Отправка формы»).
    step: 03-submit

  - question: |
      Зачем у `<form>` директива `[formRoot]="loginForm"`?
    options:
      - 'Отменить перезагрузку страницы и запустить отправку формы'
      - 'Она блокирует кнопку отправки, пока форма ждёт ответа сервера'
      - 'Она включает проверку полей браузером по атрибутам `required`'
      - 'Без неё клавиша Enter в полях формы ничего не отправляет'
    explanation: |
      `FormRoot` ставит `novalidate`, отменяет поведение браузера по умолчанию и вызывает отправку формы. Без директивы браузер отправил форму сам — превью запустилось заново, запроса к `/api/login` не было (шаг «Отправка формы»).
    step: 03-submit

  - question: |
      `action` вернул `{ kind: 'server', message: 'Неверный e-mail или пароль' }` без `fieldTree`. Где окажется ошибка и когда пропадёт?
    options:
      - 'В ошибках всей формы — до первого изменения любого поля'
      - 'Под последним полем формы — до следующей отправки'
      - 'В консоли как `ERROR`: форма ошибки сервера у себя не хранит'
      - 'В ошибках всей формы — пока её не сбросит `reset()`'
    explanation: |
      Ошибка без `fieldTree` попадает в `loginForm().errors()`. Ошибки отправки живут до первого изменения формы: покупатель исправил поле — ошибка сервера исчезла (шаг «Отправка формы»).
    step: 03-submit

  - question: |
      Правило «телефон или e-mail» записано у поля e-mail. Покупатель печатает телефон, не трогая e-mail. Что с ошибкой у e-mail?

      ```ts
      validate(contacts.email, ({ value, valueOf }) =>
        !value().trim() && !valueOf(contacts.phone).trim()
          ? { kind: 'contact', message: 'Укажите телефон или e-mail…' }
          : undefined,
      );
      ```
    options:
      - 'Исчезает сразу: правило прочитало телефон и пересчиталось само'
      - 'Остаётся, пока покупатель не изменит само поле e-mail'
      - 'Исчезает только при отправке формы, когда правила проверяются'
      - 'Остаётся: `valueOf` читает телефон один раз, при создании формы'
    explanation: |
      Правило выполняется как `computed`: `valueOf(contacts.phone)` читает сигнал значения телефона, поэтому изменение телефона пересчитывает правило e-mail (шаг «Свои проверки»).
    step: 04-custom-validation

  - question: |
      Промокод проверяет `validateHttp`. Сервер ещё не ответил. Какие значения у `valid()` и `invalid()` поля?
    options:
      - '`valid()` — false, `invalid()` — false'
      - '`valid()` — true, `invalid()` — false'
      - '`valid()` — false, `invalid()` — true'
      - '`valid()` — true, `invalid()` — true'
    explanation: |
      Пока проверка ждёт ответа, поле в состоянии `pending`: ошибок нет, но и верным его назвать нельзя. `valid()` — true только без ошибок и без ожидания, `invalid()` — только когда ошибки есть (шаг «Проверка на сервере»).
    step: 05-async-validation

  - question: |
      У поля промокода `required` и `validateHttp`. Поле пустое. Сколько запросов уйдёт на сервер?
    options:
      - 'Ни одного: пока `required` не проходит, `validateHttp` не запускается'
      - 'Один: `GET /api/promo/` с пустым кодом, сервер ответит 404'
      - 'Один на каждую проверку формы — пока поле не заполнят'
      - 'Один — после паузы `debounce`, когда покупатель уйдёт из пустого поля'
    explanation: |
      Асинхронная проверка выполняется, только когда синхронные правила поля уже прошли. Пока `required` не проходит, запроса нет — поэтому `request` не проверяет пустую строку (шаг «Проверка на сервере»).
    step: 05-async-validation

  - question: |
      Адрес скрыт правилом `hidden`, пока выбран самовывоз, и обязателен по правилу `required`. Что будет при самовывозе?
    options:
      - 'Ошибки нет: скрытое поле не проверяется, но из DOM его убирает `@if`'
      - 'Ошибка есть, и форма неверна, пока адрес не заполнят'
      - 'Ошибки нет, и элемент поля Angular убирает со страницы сам, без `@if`'
      - 'Ошибка есть, но её не видно: элемент поля скрыт со страницы'
    explanation: |
      Правила скрытого поля не выполняются, и оно не влияет на состояние формы. Но `hidden` только сообщает, что поле скрыто: убрать его из DOM — работа шаблона, иначе Angular предупредит `NG01916` (шаг «Условные поля»).
    step: 06-conditional-fields

  - question: |
      Что нужно сделать, чтобы добавить в форму ещё одну открытку?
    options:
      - 'Добавить элемент в массив `postcards` модели — поле появится само'
      - 'Вызвать `applyEach` ещё раз для нового элемента массива'
      - 'Создать новое поле функцией `form` и вставить его в `checkoutForm.postcards`'
      - 'Добавить в шаблон ещё один `<input>` с `[formField]`'
    explanation: |
      Элементы поля-массива появляются и исчезают вместе с массивом в модели: форма сама создаёт поле для новой открытки. `applyEach` уже применил правила ко всем элементам, в том числе будущим (шаг «Списки полей»).
    step: 07-field-arrays

  - question: |
      В `contactsSchema = schema<Contacts>(…)` нужно правило «курьеру нужен телефон», а способ доставки — в `checkout.delivery`. Где ему место?
    options:
      - 'В общей схеме формы: вложенная схема видит только свои поля'
      - 'В `contactsSchema`: обратиться к `checkout.delivery` из неё можно'
      - 'В компоненте, в эффекте, который следит за способом доставки'
      - 'В шаблоне: `@if` вокруг поля телефона заменяет правило'
    explanation: |
      Путь схемы контактов начинается с группы контактов, о доставке она не знает. Путь чужой схемы внутри вложенной даёт `NG01908`. Правила, которые связывают части формы, живут в схеме, которая видит их все (шаг «Схемы»).
    step: 08-schemas

  - question: |
      Компонент `Rating` связан с полем формы через `[formField]`. Зачем ему выход `touch`?
    options:
      - 'Сообщить форме, что покупатель закончил с полем: иначе оно не «тронуто»'
      - 'Без `touch` `[formField]` не сможет записать оценку в модель формы'
      - 'Без выхода `touch` не скомпилируется `implements FormValueControl<number>`'
      - 'Через `touch` компонент получает от формы ошибки поля, чтобы их показать'
    explanation: |
      У `<input>` «тронуто» директива узнаёт по `blur`, а компонент сообщает сам. Значение передаёт `model()` `value` — это единственный обязательный член договора; без `touch` ошибка под звёздами появится только при отправке (шаг «Своё поле формы»).
    step: 09-custom-control
