# Квиз главы «Авторизация». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      В магазине есть ссылка «Админка» только для администратора, гард на маршруте и проверка роли на сервере. Что из этого на самом деле защищает данные админки?
    options:
      - Проверка на сервере — она выполняется на каждый запрос по токену
      - 'Гард маршрута: без него код админки нельзя даже загрузить в браузер'
      - 'Скрытая ссылка: без неё покупатель не узнает адрес раздела'
      - Сочетание гарда и ссылки — по отдельности они не защищают
    explanation: |
      Код магазина работает в браузере покупателя, и его можно изменить. Ссылка и гард — удобство для человека, а данные и действия проверяет сервер. В опыте с `isAdmin = computed(() => true)` гард пустил покупателя, а сервер ответил `403` (шаг «Роли»).
    step: 07-roles

  - question: |
      Почему `logIn` в `AuthStore` не ловит ошибку запроса `POST /api/login`?
    options:
      - 'Что сказать покупателю при неверном пароле, решает форма, которая вызвала `logIn`'
      - 'Angular сам покажет ошибку `401` под формой, к которой привязан запрос'
      - 'Интерцептор входа перехватывает все ответы `401` и сам показывает ошибку'
      - '`firstValueFrom` не передаёт ошибки дальше — их можно поймать только в `subscribe`'
    explanation: |
      Ошибку хранилище отдаёт тому, кто его о чём-то просил. Если «проглотить» её в `logIn`, форма решит, что вход удался: при неверном пароле превью уйдёт на главную, а в шапке останется «Войти» (шаг «Вход и выход»).
    step: 02-login-logout

  - question: |
      Почему в `AuthStore` «вошёл» считается по пользователю, а не по токену?

      ```ts
      readonly isLoggedIn = computed(() => this.user() !== null);
      ```
    options:
      - 'После перезагрузки токен уже есть, а сервер ещё не подтвердил, чей он'
      - 'Сигнал токена закрыт, и `computed` в том же классе не может его читать'
      - 'Токен хранится только в `localStorage`, а в сигнале его нет совсем'
      - 'Сравнение строки с `null` в `computed` всегда даёт `true`, даже без входа'
    explanation: |
      Токен и пользователь появляются не одновременно: после перезагрузки токен из `localStorage` уже в сигнале, а пользователя сервер пришлёт через сотни миллисекунд. «Вошёл» значит «сервер подтвердил пользователя», а не «есть какая-то строка-токен» (шаг «Как устроен вход»).
    step: 01-how-login-works

  - question: |
      Покупатель нажал «Выйти»: `logOut` очистил сигналы и `localStorage`. Что стало с самим токеном доступа на учебном сервере?
    options:
      - 'Он действителен до своего `exp`: сервер не хранит токены, и отменять ему нечего'
      - Сервер получил сигнал выхода и сразу перестал принимать этот токен
      - Токен стал недействительным, потому что `localStorage` его больше не хранит
      - Сервер отзовёт его при следующем запросе любого пользователя магазина
    explanation: |
      Сервер проверяет подпись и срок, а выданные токены не запоминает. Даже `POST /api/logout` из шага про обновление отзывает только refresh-токен: «выход… ничто не отменит токен до его `exp`». Поэтому токены доступа делают короткоживущими, а долгую сессию держат на refresh-токене, который сервер может отозвать (шаги «Вход и выход» и «Обновление токена»).
    step: 02-login-logout

  - question: |
      Покупатель вошёл и перезагрузил страницу. Что изменится, если инициализатор не возвращает промис?

      ```ts
      provideAppInitializer(() => {
        inject(AuthStore).restore();
      }),
      ```
    options:
      - 'Шапка появится сразу с «Войти», а имя — после ответа на `GET /api/me`'
      - 'Ничего: Angular сам дождётся всех запросов, начатых в инициализаторе'
      - 'Приложение не запустится: инициализатор обязан вернуть промис'
      - 'Проверка входа не начнётся: `restore` вызовут только после запуска'
    explanation: |
      Angular ждёт только то, что инициализатор вернул. Без `return` приложение и роутер запускаются сразу, и шапка показывает «Войти», пока сервер не ответил (шаг «Сессия после перезагрузки»).
    step: 03-session

  - question: |
      Покупатель вошёл. Из `restore` убрали `try`/`catch`, а сервер отвечает `500`. Что увидит покупатель после перезагрузки?
    options:
      - 'Пустую страницу: промис инициализатора отклонён, и приложение не запустилось'
      - 'Магазин без входа: Angular пропустит упавший инициализатор и продолжит запуск'
      - 'Магазин с «Пользователем» в шапке: токен ведь остался в `localStorage`'
      - 'Страницу входа: роутер переадресует туда при ошибке инициализатора'
    explanation: |
      Отклонённый промис инициализатора останавливает запуск: превью остаётся пустым, в консоли — ошибка `HttpErrorResponse`. Поэтому `restore` ошибок не бросает (шаг «Сессия после перезагрузки»).
    step: 03-session

  - question: |
      `restore` вызвали из конструктора `AuthStore` вместо инициализатора (`provideAppInitializer` убрали), а запрос `GET /api/me` проходит через интерцептор с `inject(AuthStore)`. Что произойдёт после перезагрузки?
    options:
      - '`NG0200`: круговая зависимость, её поймал `catch` в `restore` — покупатель не вошёл'
      - 'Всё работает: Angular создаёт `AuthStore` целиком до того, как запускаются интерцепторы'
      - 'Запрос уйдёт без токена, потому что интерцептор получит пустой `AuthStore`'
      - 'Angular заметит запрос в конструкторе и отложит его до конца запуска приложения'
    explanation: |
      `AuthStore` ещё создаётся, его конструктор отправляет запрос, интерцептор просит `AuthStore` — круг. `NG0200: Circular dependency detected for AuthStore` поймал `catch` в `restore`, и запроса `GET /api/me` в «Сети» нет (шаг «Токен в запросах»).
    step: 04-token-interceptor

  - question: |
      Где ошибка в этом интерцепторе?

      ```ts
      return next(withToken(req, token)).pipe(
        catchError((error: unknown) => {
          if (error instanceof HttpErrorResponse && error.status === 401) {
            inject(Router).navigateByUrl('/login');
          }
          return throwError(() => error);
        }),
      );
      ```
    options:
      - '`inject` вызван, когда пришёл ответ, — вне контекста внедрения, будет `NG0203`'
      - '`throwError` нельзя вызывать из `catchError` — ошибку нужно вернуть как значение'
      - '`Router` нельзя внедрять в интерцептор: он создаётся раньше роутера'
      - '`catchError` должен стоять до `next`, иначе он не увидит ответ сервера'
    explanation: |
      Функция интерцептора выполняется в контексте внедрения, а `catchError` вызовет свою функцию позже. В опыте покупатель вышел, но остался в каталоге: дальше ушла ошибка `NG0203: The Router token injection failed` (шаг «Ответ 401»).
    step: 05-unauthorized

  - question: |
      Зачем интерцептор при `401` проверяет `auth.isLoggedIn()`, прежде чем отправить покупателя на страницу входа?
    options:
      - Чтобы истёкший токен при запуске не уводил на вход открывшего каталог
      - Чтобы ответ на неверный пароль в форме входа не вызывал повторный вход
      - 'Чтобы не отправлять запрос `GET /api/me`, если покупатель ещё не входил'
      - Чтобы гард входа успел проверить сессию раньше, чем интерцептор
    explanation: |
      `401` на `GET /api/me` при запуске разбирает `restore`: покупатель остаётся на открытой странице гостем. Без условия превью после перезагрузки открылось на `/login`, а не в каталоге. Неверный пароль сюда не попадает: запрос входа уходит без токена (шаг «Ответ 401»).
    step: 05-unauthorized

  - question: |
      Почему `safeReturnUrl` не принимает адрес `//evil.example/x`, хотя он начинается с `/`?

      ```ts
      function safeReturnUrl(url: string | undefined): string {
        return url?.startsWith('/') && !url.startsWith('//') ? url : '/';
      }
      ```
    options:
      - Браузер читает его как адрес другого сайта с тем же протоколом
      - Роутер Angular не умеет переходить по адресам с двумя косыми чертами
      - 'В query-параметре двойная косая черта ломает разбор `returnUrl`'
      - Такой адрес не пропустит гард входа на странице, куда ведёт возврат
    explanation: |
      Возвращаем только на свои страницы: `/…`, но не `//…`. Иначе ссылка «от магазина» превращает настоящую страницу входа в переход на сайт мошенника — открытый редирект (шаг «Гард входа и возврат»).
    step: 06-auth-guard

  - question: |
      Покупатель (роль `user`) набрал в адресе `/admin`. Гард вернул `false`. Что произойдёт?

      ```ts
      {
        path: 'admin',
        canMatch: [adminGuard],
        loadChildren: () =>
          import('./admin/admin.routes').then((m) => m.adminRoutes),
      },
      ```
    options:
      - 'Роутер возьмёт следующий маршрут, `**`, а код админки не загрузится'
      - 'Роутер загрузит код админки и покажет его без данных: сервер ответит `403`'
      - 'Навигация упадёт с ошибкой `NG04002`, и превью останется на прежней странице'
      - 'Роутер отправит на страницу входа с `returnUrl=%2Fadmin`, как гард заказов'
    explanation: |
      `canMatch` с `false` говорит «маршрут не подходит», роутер ищет дальше и доходит до `'**'` — «Нет такой страницы». Строки «Админка: модуль загружен» в консоли нет (шаг «Роли»).
    step: 07-roles

  - question: |
      На главной два запроса одновременно получили `401`. Почему нельзя, чтобы каждый отправил свой `POST /api/refresh`?
    options:
      - 'Второй придёт с refresh-токеном, который первый уже израсходовал, и получит `401`'
      - 'Сервер ограничивает частоту запросов и отвечает `429` на второе обновление'
      - 'Два одинаковых запроса подряд `HttpClient` объединяет, и второй не получит ответа'
      - 'Повторные запросы получат разные токены, и шапка покажет двух пользователей'
    explanation: |
      Ротация: каждый refresh-токен работает один раз. В опыте с `=` вместо `??=` второе обновление получило `401` «Сессия истекла», и покупателя выбросило на вход. Общий поток `refreshing` с `shareReplay(1)` отправляет одно обновление на всех (шаг «Обновление токена»).
    step: 08-refresh-token

  - question: |
      Почему `catchError` стоит **до** `switchMap`?

      ```ts
      return auth.refresh().pipe(
        catchError(() => { /* выход */ }),
        switchMap((fresh) => next(withToken(req, fresh))),
      );
      ```
    options:
      - 'Так он ловит ошибку обновления, но не ошибки повторного запроса'
      - 'После `switchMap` ошибки не доходят до `catchError` в принципе'
      - 'Иначе `switchMap` отменит обновление, не дождавшись нового токена'
      - 'Порядок не важен: операторы `pipe` выполняются одновременно'
    explanation: |
      Если бы `catchError` стоял после `switchMap`, он ловил бы и ошибки повторного запроса — и, например, `409` при оформлении заказа превратился бы в выход из магазина (шаг «Обновление токена»).
    step: 08-refresh-token

  - question: |
      Выход в шапке: `auth.logOut()`, затем `router.navigateByUrl(router.url, { onSameUrlNavigation: 'reload' })`. Что ещё нужно, чтобы гард `canActivate` увёл с «Моих заказов»?
    options:
      - "`runGuardsAndResolvers: 'always'` у маршрута заказов"
      - '`canDeactivate` у маршрута заказов'
      - '`replaceUrl: true` во втором аргументе `navigateByUrl`'
      - 'Ничего: гард читает сигнал `isLoggedIn` и перезапустится сам'
    explanation: |
      На тот же маршрут роутер по умолчанию не перезапускает гарды — только при смене параметров пути. Маршруту заказов нужно `runGuardsAndResolvers: 'always'`. А вот `canMatch` админки перепроверяется при каждом переходе и без этой настройки (практикум «Личный кабинет»).
    step: 09-practice

  - question: |
      В браузере есть cookie `XSRF-TOKEN=demo-123`. Какой запрос `HttpClient` по умолчанию получит заголовок `X-XSRF-TOKEN: demo-123`?
    options:
      - '`POST /api/login` на тот же сайт'
      - '`GET /api/games` на тот же сайт'
      - '`POST` на адрес API другого сайта'
      - 'Любой запрос `HttpClient`'
    explanation: |
      XSRF-интерцептор `HttpClient` включён по умолчанию: пропускает `GET` и `HEAD`, пропускает запросы на другой сайт и копирует cookie в заголовок остальным. В опыте заголовок был у `POST /api/login` и не было у `GET /api/games` (шаг «Безопасность сессии»).
    step: 10-session-security
