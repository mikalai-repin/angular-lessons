# Квиз главы «Анимации, @defer и производительность». Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается
questions:
  - question: |
      Что делает Angular, когда элемент с этим атрибутом пора удалить из DOM?

      ```html
      <div class="cart-row" animate.leave="row-leave">…</div>
      ```
    options:
      - 'Добавляет класс `row-leave`, ждёт конца его CSS-анимации и только потом удаляет элемент'
      - 'Удаляет элемент сразу, а класс `row-leave` получает строка, которая встала на его место'
      - 'Ищет в `@angular/animations` триггер с именем `row-leave` и проигрывает его'
      - 'Ставит класс `row-leave` и удаляет элемент через секунду — срок, заданный в Angular'
    explanation: |
      `animate.leave` задерживает удаление: Angular сначала добавляет класс, спрашивает у браузера, какую анимацию он запустил, и ждёт её конца. Длительность в шаблоне не пишут — она живёт в CSS (шаг «Анимация появления и исчезновения»).
    step: 01-enter-leave

  - question: |
      Покупатель включил в системе «уменьшить движение». Что сделает Angular со строками корзины, у которых `animate.enter="row-enter"` и `animate.leave="row-leave"` (как в первом шаге)?
    options:
      - 'Сам — ничего: анимации выключает правило CSS с `prefers-reduced-motion`'
      - 'Пропустит анимации появления и исчезновения: эту настройку он проверяет сам'
      - 'Проиграет анимации вдвое быстрее и напишет предупреждение в консоль'
      - 'Перестанет добавлять классы, но удаление строк всё равно задержит на 300 мс'
    explanation: |
      Angular эту настройку не проверяет. Поэтому в `cart-page.css` есть правило `@media (prefers-reduced-motion: reduce)` с `animation: none`: у класса нет анимации — ждать нечего, и строки появляются и исчезают сразу (шаг «Анимация появления и исчезновения»).
    step: 01-enter-leave

  - question: |
      Функция исчезновения забыла сказать «готово». Что увидит покупатель после `×`?

      ```ts
      protected collapse(event: AnimationCallbackEvent) {
        const row = event.target as HTMLElement;
        row.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300 });
      }
      ```
    options:
      - 'Строка растает, вернётся целиком и исчезнет примерно через четыре секунды'
      - 'Строка растает и исчезнет сразу, как только закончится анимация'
      - 'Строка растает и останется на странице, пока код не вызовет `animationComplete()`'
      - 'Строка растает и тут же исчезнет: Angular удалит её по событию `finish`'
    explanation: |
      С функцией Angular ничего не замеряет: элемент удаляется по `animationComplete()` или по таймеру `MAX_ANIMATION_TIMEOUT` — по умолчанию 4000 мс. Анимация Web Animations после конца отпускает элемент к его обычным стилям, поэтому строка возвращается (шаг «Анимация из кода»).
    step: 02-animation-functions

  - question: |
      Почему в `collapse` начальную высоту строки берут из `getComputedStyle(row).height`, а не из `offsetHeight`?
    options:
      - '`offsetHeight` считает высоту вместе с полями, и в начале анимации строка бы выросла'
      - 'В момент ухода `offsetHeight` равен нулю: строка уже отцеплена от шаблона'
      - '`offsetHeight` есть только у SVG-элементов, а строка корзины — это `<div>`'
      - '`getComputedStyle` даёт высоту вместе с полями, и строка схлопнется ровнее'
    explanation: |
      `height` в кадре — высота без полей, а `offsetHeight` включает поля: в опыте строка сначала выросла с 34 до 42 пикселей и только потом начала сжиматься. Поля убирает отдельное свойство в последнем кадре — `paddingBlock: '0px'` (шаг «Анимация из кода»).
    step: 02-animation-functions

  - question: |
      Когда Angular создаст `GameReviews` из этого блока?

      ```html
      @defer {
        <app-game-reviews [gameId]="game.id" />
      }
      ```
    options:
      - 'Когда браузер освободится после первой отрисовки — это триггер `on idle`'
      - 'Сразу вместе со страницей: `@defer` без триггера откладывает только данные'
      - 'Когда место блока появится в видимой части экрана, как у `on viewport`'
      - 'Никогда: без триггера блок навсегда остаётся в состоянии заглушки'
    explanation: |
      Блок `@defer` ждёт триггера, а без указания триггер — `on idle`: браузер освободился после первой отрисовки (`requestIdleCallback`). (шаг «Отложенная отрисовка»).
    step: 03-defer

  - question: |
      `GameReviews` используется в шаблоне страницы только внутри `@defer`. Что из этого помешает компилятору AOT вынести его в отдельный чанк?
    options:
      - 'Строка `protected readonly x = GameReviews` в классе страницы'
      - 'Вход `[gameId]="game.id"`, который блок передаёт компоненту'
      - 'Блоки `@placeholder` и `@loading` с простой разметкой'
      - 'То, что блок `@defer` стоит внутри вкладки `<app-tab>`'
    explanation: |
      Код уходит в чанк, только если в файле он используется лишь в основном блоке `@defer`. Упоминание в классе оставляет обычный импорт, а функция загрузки становится `() => [GameReviews]`. Массив `imports`, вход `[gameId]` и вкладка вокруг блока не мешают: именно такой шаблон собран в шаге «Под капотом» (шаги «Отложенная отрисовка» и «Под капотом: @defer в JIT и в AOT»).
    step: 03-defer

  - question: |
      Из блока убрали `@placeholder`. Что будет в превью?

      ```html
      @defer (on viewport) {
        <app-game-reviews [gameId]="game.id" />
      } @loading { … }
      ```
    options:
      - 'Страница игры не откроется: JIT не скомпилирует шаблон, ошибка в консоли'
      - 'Блок сработает сразу при открытии страницы, как с триггером `on immediate`'
      - 'Angular будет следить за первым элементом основного блока вместо заглушки'
      - 'В превью всё заработает, а ошибку покажет только сборка AOT'
    explanation: |
      `on viewport` без ссылки следит за заглушкой, и без неё следить не за чем: «defer on trigger with no target name must have a placeholder block», страница игры не открывается. В настоящем проекте ту же ошибку покажет сборка — `NG8019` (шаг «Триггеры»).
    step: 04-triggers

  - question: |
      `showReviews()` стал `true`, отзывы появились. Потом `showReviews()` снова `false`. Что на месте блока?

      ```html
      @defer (when showReviews()) {
        <app-game-reviews [gameId]="game.id" />
      } @placeholder { … }
      ```
    options:
      - 'По-прежнему отзывы: сработав, блок не возвращается к заглушке'
      - 'Снова заглушка: `when` показывает блок, пока условие истинно'
      - 'Блок загрузки: блок ждёт, когда условие снова станет истинным'
      - 'Пустое место: Angular уничтожает содержимое вместе с кодом блока'
    explanation: |
      `@defer` — про «когда загрузить и создать в первый раз». Условие стало истинным — содержимое создано, и обратного пути у инструкции `ɵɵdeferWhen` нет. Чтобы убирать и показывать, нужен `@if` (шаг «Триггеры»).
    step: 04-triggers

  - question: |
      На странице игры включили «Ошибка 500», открыли «Отзывы» — блок показал `@error`. Ошибку выключили, открыли другую игру и её вкладку «Отзывы». Что в ней?
    options:
      - 'Снова сообщение из `@error`: загрузка одна на шаблон и осталась в ошибке'
      - 'Отзывы новой игры: у новой страницы своя попытка загрузить чанк'
      - 'Заглушка: блок ждёт, пока покупатель ещё раз откроет вкладку'
      - 'Пустое место: после ошибки Angular убирает блок со всех страниц'
    explanation: |
      Состояние загрузки Angular хранит у скомпилированного шаблона, общего для всех экземпляров страницы: `FAILED` остаётся до перезагрузки. Поэтому и текст в `@error` — «Обновите страницу» (шаги «Триггеры» и «Под капотом: @defer в JIT и в AOT»).
    step: 04-triggers

  - question: |
      Что происходит, когда браузер освободился, а покупатель ещё не открывал «Отзывы»?

      ```html
      @defer (on viewport; prefetch on idle) {
        <app-game-reviews [gameId]="game.id" />
      } @placeholder { … }
      ```
    options:
      - 'Скачивается код блока, а `GameReviews` не создан и отзывы не запрошены'
      - 'Скачивается код блока и создаётся `GameReviews` — он запрашивает отзывы'
      - 'Запрашиваются отзывы, а код блока скачается при открытии вкладки'
      - 'Ничего: `prefetch` срабатывает, только когда видна заглушка блока'
    explanation: |
      `prefetch on …` отвечает на вопрос «когда загрузить код», `on …` — «когда создать содержимое». Предзагрузка скачала код, но не данные: компонент не создан, и его `httpResource` никого ни о чём не просил (шаг «Предзагрузка»).
    step: 05-prefetch

  - question: |
      Что будет с этой обложкой на странице игры?

      ```html
      <img class="cover" [ngSrc]="game.cover" priority [alt]="game.title" />
      ```
    options:
      - 'Ошибка `NG02954` во время работы: у картинки нет `width` и `height`'
      - 'Директива подставит размеры 300 × 400 из файла картинки сама'
      - 'Ошибка сборки AOT: шаблон с такой картинкой не скомпилируется'
      - 'Предупреждение `NG02952`: пропорции на экране не совпадают с картинкой'
    explanation: |
      `width` и `height` у `NgOptimizedImage` обязательны: по ним браузер заранее резервирует место и страница не прыгает. Без них — `NG02954`, и страница разваливается. AOT эту ошибку не ловит: это проверка во время выполнения (шаг «Картинки»).
    step: 06-images

  - question: |
      Зачем в `game-card.html` две ветки `@if (priority())` с почти одинаковыми картинками?
    options:
      - '`priority` читается один раз: сменить его можно, только создав картинку заново'
      - '`NgOptimizedImage` принимает `priority` только статическим атрибутом, без привязки'
      - 'Без `@if` все карточки каталога получили бы `priority` одновременно'
      - 'Чтобы первым обложкам можно было дать отдельные стили в CSS'
    explanation: |
      Браузер уже начал грузить картинку, поэтому менять её приоритет поздно, и директива бросает `NG02953`, если `priority` изменился. А в каталоге карточки переезжают: после сортировки игра с седьмого места может стать второй. `@if` создаёт новую картинку (шаг «Картинки»).
    step: 06-images

  - question: |
      Каталог показывает шесть карточек. Покупатель меняет сортировку. Что делает `@for` с таким выражением отслеживания?

      ```html
      @for (game of shownGames(); track game) { … }
      ```
    options:
      - 'Пересоздаёт все карточки и пишет предупреждение `NG0956` в консоль'
      - 'Оставляет карточки на местах и передаёт им другие игры через вход'
      - 'Пересоздаёт только карточки игр, которых раньше не было на экране'
      - 'Переставляет карточки так же, как при отслеживании по `game.id`'
    explanation: |
      `track game` сравнивает объекты, а сервер на каждый запрос присылает новые: для `@for` все игры — новые. В опыте — 6 карточек из 6 и `NG0956`; с `track game.id` — 4, с `track $index` — 0, но с чужими играми внутри (шаг «Большие списки»).
    step: 07-big-lists

  - question: |
      Почему в практикуме летящие обложки рисует компонент в шапке, а не сама карточка?
    options:
      - 'Карточка может исчезнуть посреди полёта, а шапка и ссылка на корзину есть всегда'
      - 'Внутри карточки `animate.enter` не работает у элементов `<img>`'
      - 'Стили `position: fixed` не действуют внутри шаблона компонента'
      - 'Карточка не может внедрить сервис `FlyToCart` — он доступен только компонентам шапки'
    explanation: |
      Покупатель может уйти со страницы, пока обложка летит, и карточка будет уничтожена. Шапка есть всегда, и цель полёта — ссылка на корзину — тоже в ней. Карточка только замеряет картинку и запускает полёт через сервис (шаг «Практикум: летящая обложка»).
    step: 08-practice

  - question: |
      Почему в превью курса без особых мер блок `@loading (after 100ms)` не появился бы никогда?
    options:
      - 'JIT не выносит код в чанк: функция загрузки — `null`, всё готово за микрозадачу'
      - 'В JIT триггеры не работают, и содержимое блока создаётся сразу вместе со страницей'
      - 'JIT загружает все чанки синхронно, ещё до первой отрисовки страницы'
      - 'Превью грузит чанки с учебного бэкенда без задержки, пока она не включена в «Сети»'
    explanation: |
      JIT получает компонент со всеми импортами и передаёт блоку пустую функцию загрузки. С `null` Angular считает загрузку законченной через `Promise.resolve().then(…)`. Поэтому превью подкладывает свою загрузку через служебный токен режима разработки — запрос `/chunk-defer-N.js` во вкладке «Сеть» (шаг «Под капотом: @defer в JIT и в AOT»).
    step: 09-defer-inside
