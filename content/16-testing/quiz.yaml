# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      Почему этот тест падает?

      ```ts
      expect({ min: 2, max: 4 }).toBe({ min: 2, max: 4 });
      ```
    options:
      - '`toBe` сравнивает через `Object.is`, а это два разных объекта'
      - Vitest не умеет сравнивать объекты — только строки, числа и логические значения
      - Порядок полей в двух объектах для `toBe` считается разным
      - '`toBe` требует, чтобы ожидаемое значение было переменной'
    explanation: |
      `toBe` сравнивает через `Object.is`, как `===`: два объекта с одинаковыми полями — всё равно разные объекты. Содержимое сравнивает `toEqual` (шаг «Зачем тесты», врезка «Что делает toBe»).
    step: 01-why-tests

  - question: |
      Функцию `plural` «упростили» до `count === 1 ? 'one' : count < 5 ? 'few' : 'many'`. Какой из тестов упадёт?
    options:
      - Тест для 21 — «игрок»
      - Тест для 1 — «игрок»
      - Тест для 3 — «игрока»
      - Тест для 5 — «игроков»
    explanation: |
      Для 21 «упрощённая» функция выбирает `many` — «игроков», а нужно «игрок». Остальные случаи она проходит. Поэтому тесты проверяют границы, а не только «как обычно» (шаг «Зачем тесты»).
    step: 01-why-tests

  - question: |
      Тест создаёт пайп так — и падает с `NG0203`. Почему?

      ```ts
      const pipe = new PricePipe();
      ```
    options:
      - '`PricePipe` вызывает `inject()` в полях, а вне контекста внедрения это нельзя'
      - Пайпы в тестах можно создавать только через `TestBed.createComponent`, а не через `new`
      - У `PricePipe` нет конструктора без параметров, и TypeScript запрещает `new`
      - В тестах нет `LOCALE_ID`, и Angular бросает `NG0203` вместо `NG0701`
    explanation: |
      `PricePipe` берёт локаль и валюту через `inject()` в полях. В приложении пайп создаёт Angular, а в тесте — `TestBed.runInInjectionContext(() => new PricePipe())` (шаг «Тест пайпа»).
    step: 02-pipe-tests

  - question: |
      Тест ждёт `'1 990 ₽'`, а получает «то же самое»: в отчёте `Expected: "1 990 ₽"` и `Received: "1 990 ₽"`. В чём дело?
    options:
      - Пайп ставит неразрывные пробелы — в ожидаемой строке нужен `\u00a0`
      - '`toBe` сравнивает строки без учёта пробелов, и ошибка — в символе рубля'
      - Тест не дождался `await fixture.whenStable()`
      - В стенде нет `DEFAULT_CURRENCY_CODE`, и пайп вернул доллары
    explanation: |
      Пайпы форматирования ставят между разрядами и перед «₽» неразрывный пробел U+00A0. На вид строки одинаковые, а символы разные (шаг «Тест пайпа»).
    step: 02-pipe-tests

  - question: |
      Что случится в этом `beforeEach`?

      ```ts
      pipe = TestBed.runInInjectionContext(() => new PricePipe());
      TestBed.configureTestingModule({
        providers: [{ provide: LOCALE_ID, useValue: 'ru' }],
      });
      ```
    options:
      - '`configureTestingModule` бросит ошибку: стенд уже собран, менять его нельзя'
      - 'Пайп получит локаль `ru`: провайдеры стенда применяются ко всему, что в нём уже создано'
      - Пайп получит `en-US`, а локаль `ru` достанется следующему тесту набора
      - Ничего особенного — порядок вызовов `TestBed` не важен
    explanation: |
      Стенд собирается при первой просьбе — здесь это `runInInjectionContext`. Менять собранный стенд нельзя: сначала конфигурация, потом всё остальное (шаг «Тест пайпа», опыт «Порядок важен»).
    step: 02-pipe-tests

  - question: |
      `CartStore` сохраняет корзину эффектом. Почему тест читает пустой `localStorage` сразу после `cart.add(game)`?
    options:
      - Эффект выполнится при обновлении приложения — нужен `TestBed.tick()`
      - '`localStorage` в тестах всегда пуст: записать туда нельзя ни из кода, ни из теста'
      - '`add` пишет в `localStorage` только после `await`'
      - Эффекты в `@Service()` в тестах не выполняются никогда
    explanation: |
      Запись в сигнал только помечает эффект. Выполнит его Angular, когда будет обновлять приложение; в синхронном тесте до этого не доходит. `TestBed.tick()` делает обновление прямо сейчас (шаг «Тест сервиса»).
    step: 03-service-tests

  - question: |
      Все тесты `CartStore` ✓, но в отчёте «Ошибки вне тестов: 9» с `NG0205: Injector has already been destroyed`. Откуда они?
    options:
      - Модуль аналитики загрузился, когда стенд уже был разобран
      - Тесты создают корзину через `new CartStore()` вместо `TestBed.inject`
      - '`localStorage.clear()` в `beforeEach` уничтожает инжектор стенда вместе с корзиной'
      - Vitest уничтожает инжектор, если тест длится дольше 5 секунд
    explanation: |
      `add` вызывает `this.analytics().then(…)`. Загрузка модуля асинхронная: тест кончился, стенд разобран, а `injectAsync` обращается к уничтоженному инжектору. Промис отклонён, и его никто не ловит — отсюда `.catch(() => {})` в `CartStore` (шаг «Тест сервиса»).
    step: 03-service-tests

  - question: |
      Тест щёлкает по сердечку и сразу проверяет текст:

      ```ts
      heart.click();
      expect(heart.textContent?.trim()).toBe('♥');
      ```

      Что он увидит?
    options:
      - '`♡`: отрисовки ещё не было, нужен `await fixture.whenStable()`'
      - '`♥`: щелчок DOM синхронно обновляет шаблон'
      - '`♥`, но только если у карточки стратегия обнаружения изменений `Eager`'
      - 'Ошибку: щёлкать по элементам фикстуры из теста можно только через `debugElement`'
    explanation: |
      Обработчик изменил избранное и пометил представление «грязным», а обновление запланировано на ближайший кадр. `await fixture.whenStable()` дожидается его (шаг «Тест компонента»).
    step: 04-component-tests

  - question: |
      Тест карточки падает в `beforeEach` с `NG0201: No provider found for ActivatedRoute. Source: DynamicTestModule`. Что исправить?
    options:
      - Добавить в стенд `provideRouter([])`
      - Добавить `GameCard` в `imports` тестового модуля ещё раз
      - Вызвать `fixture.detectChanges()` перед `setInput`
      - Перенести `ActivatedRoute` в `imports` карточки, рядом с `RouterLink`
    explanation: |
      `RouterLink` внедряет `ActivatedRoute`, а провайдера нет. Маршрутов не нужно — достаточно `provideRouter([])` (шаг «Тест компонента», опыт «Без роутера»).
    step: 04-component-tests

  - question: |
      Зачем тест карточки подменяет `FlyToCart` подделкой `{ launch: vi.fn() }`?
    options:
      - Тест проверяет карточку, а не полёт; к тому же в jsdom нет `matchMedia`
      - Без подмены `inject(FlyToCart)` в тесте вернёт `undefined`
      - '`@Service()` в тестах не работает, поэтому такие сервисы нужно подменять всегда'
      - Подделка нужна, чтобы корзина тоже стала поддельной
    explanation: |
      Тест проверяет карточку, а не анимацию: ему важно, что `launch` вызвали с обложкой и картинкой. В `ng test` с jsdom настоящий `launch` бросает `TypeError: matchMedia is not a function` (шаг «Подмена зависимостей»).
    step: 05-test-doubles

  - question: |
      Провайдеры стенда для тестов HTTP. Почему важен порядок?

      ```ts
      providers: [provideHttpClient(), provideHttpClientTesting()],
      ```
    options:
      - Обе объявляют отправителя запросов, а действует последний
      - '`provideHttpClientTesting` читает настройки из `provideHttpClient` при вызове'
      - Порядок на самом деле не важен, это соглашение руководства по стилю
      - Иначе `HttpTestingController` не найдёт `HttpClient` в инжекторе
    explanation: |
      `provideHttpClient` объявляет отправителя `FetchBackend`, а `provideHttpClientTesting` — тестовый. Из двух провайдеров одного токена действует последний (шаг «Тест HTTP»).
    step: 06-http-tests

  - question: |
      В тесте опечатка: `server.expectOne('/api/logon')` вместо `'/api/login'`. Тест падает — и с ним остальные тесты набора с ошибкой «Cannot configure the test module…». Почему падают остальные?
    options:
      - Упал `verify` в `afterEach`, и очистка стенда не выполнилась
      - Опечатка ломает `HttpTestingController` для всех следующих тестов
      - Тесты одного набора выполняются параллельно и мешают друг другу
      - '`expectOne` уничтожил стенд, и его нельзя настроить заново'
    explanation: |
      Запрос на `/api/login` остался без ответа — `verify` в `afterEach` упал. Упавший `afterEach` прерывает остальные, среди них — очистку стенда из CLI; следующий `configureTestingModule` падает. Читайте первую ошибку (шаг «Тест HTTP», опыт «Не тот адрес — и цепная реакция»).
    step: 06-http-tests

  - question: |
      Покупатель вошёл. Что сделает обвязка роутера?

      ```ts
      await harness.navigateByUrl('/account/orders', OrdersPage);
      ```
    options:
      - Бросит ошибку — в корневом `<router-outlet>` окажется `Account`
      - Откроет страницу заказов и вернёт экземпляр `OrdersPage`
      - Зависнет до ответа на запрос `/api/orders`
      - 'Откроет `OrdersPage` без кабинета: обвязка пропускает компоненты родительских маршрутов'
    explanation: |
      Обвязка видит только свой корневой `<router-outlet>`. Для `/account/orders` второй аргумент — `Account`, страница заказов внутри него (шаг «Тест маршрутов»).
    step: 07-route-tests

  - question: |
      После `request.flush({ id: 42 })` тест оформления ждёт `await fixture.whenStable()`, но заголовок всё ещё «Оформление заказа». Почему?
    options:
      - Номер записывает `async`-функция, которую Angular не ждёт
      - '`flush` отвечает асинхронно, через 5 секунд'
      - '`whenStable` в зонлесс-приложении не ждёт отрисовки — только запросы `HttpClient`'
      - Без `TestBed.tick()` форма не отправляется на сервер
    explanation: |
      `placeOrder` — `async`-функция, не задача `PendingTasks`, а тестовые запросы стабильность не держат. Стенд «стабилен» раньше, чем номер записан; `vi.waitFor` повторяет утверждение, пока оно не станет правдой (практикум).
    step: 08-practice

  - question: |
      В шаблоне компонента из теста опечатка — `<app-nope />`. Что будет в `ng test`?
    options:
      - Сборка остановится с `NG8001`, и не запустится ни один тест
      - Упадёт только тест, который создаёт этот компонент, с `NG0304`
      - Тесты пройдут, а `NG0304` будет только в консоли
      - '`ng test` пропустит этот файл и запустит остальные'
    explanation: |
      `ng test` компилирует тесты AOT: ошибка шаблона — ошибка сборки. В превью (JIT) падает один тест с `NG0304` (шаг «Под капотом: как запускаются тесты»).
    step: 09-tests-inside
