@let state = field()();
@if (state.touched() && state.invalid()) {
  <ul class="field-errors" [id]="errorsId(state.name())">
    @for (error of state.errors(); track error.kind) {
      <!-- Без текста только ошибка разбора (kind: 'parse'): её ставит [formField], когда в числовом поле не число -->
      <li>{{ error.message ?? 'Введите число' }}</li>
    }
  </ul>
}
