# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      Покупатель (вошёл как `user@example.com`) набирает в адресной строке `/admin/games`. Что он увидит?
    options:
      - «Нет такой страницы», и код админки не загрузится — `canMatch` у `admin` отказал раньше
      - Макет админки с меню, но без таблицы — гард родителя закрывает только его собственную страницу
      - Страницу входа с `returnUrl=/admin/games`, как у «Моих заказов», а после входа — таблицу игр
      - Таблицу игр — `GET /api/games` открыт всем, а гард `adminGuard` стоит только на сводке
    explanation: |
      `adminGuard` стоит на родителе всего раздела. Роутер спрашивает `canMatch` у `admin`, прежде чем загрузить `admin.routes.ts`: гард отказал — до детей дело не доходит, в консоли нет «Админка: модуль загружен», а маршрут `'**'` показывает 404 (шаг «Раздел админки»).
    step: 01-admin-section

  - question: |
      Что будет на `/admin/games`, если у ссылки «Сводка» убрать `[routerLinkActiveOptions]="{ exact: true }"`?

      ```html
      <a routerLink="." routerLinkActive="active" ariaCurrentWhenActive="page">Сводка</a>
      <a routerLink="games" routerLinkActive="active" ariaCurrentWhenActive="page">Игры</a>
      ```
    options:
      - Подсвечены обе ссылки, и у обеих `aria-current="page"`
      - Подсвечена только «Сводка» — она первая в меню
      - Не подсвечена ни одна — `routerLink="."` без `exact` не работает
      - Подсвечены обе, но `aria-current` — только у «Игр»
    explanation: |
      Без `exact` ссылка считается активной на любом адресе, который начинается с её адреса. `/admin/games` начинается с `/admin` — активны обе, и обе получают `aria-current` (шаг «Раздел админки», эксперимент «Без `exact`»).
    step: 01-admin-section

  - question: |
      Почему для несортированной колонки `sortOf` возвращает `null`, а не `'none'`?

      ```html
      <th scope="col" [attr.aria-sort]="sortOf('price')">…</th>
      ```
    options:
      - '`null` убирает атрибут, а `aria-sort` нужен только одной колонке'
      - С `'none'` пропали бы стрелки ↑ и ↓, которые рисует CSS
      - "`[attr.aria-sort]` с `'none'` даёт ошибку шаблона в JIT и в AOT"
      - Angular сам превращает `null` в `aria-sort="none"` — так короче
    explanation: |
      `[attr.x]="null"` удаляет атрибут. Со значением `'none'` стрелки не меняются, но атрибут появляется у каждого заголовка, а спецификация ARIA советует ставить `aria-sort` только той колонке, по которой отсортировано (шаг «Сортировка», эксперимент «Без `null`»).
    step: 02-sorting

  - question: |
      Админ открыл `/admin/games`, щёлкнул «3» и на `/admin/games?page=3` набирает в поиске «ка» (поиск — с `replaceUrl`, страница сбрасывается), а потом нажимает «Назад». Где он окажется?
    options:
      - На первой странице без поиска — запись `?page=3` заменили буквы поиска
      - На третьей странице без поиска — `replaceUrl` не трогает её запись
      - На странице с поиском «к» — каждая буква осталась в истории
      - На сводке админки — query-параметры в истории не хранятся
    explanation: |
      `replaceUrl` заменяет текущую запись истории, а текущей, когда админ начал печатать, была `?page=3`. Перед ней в истории — `/admin/games`, туда «Назад» и ведёт (шаг «Поиск и страницы»).
    step: 03-search-pages

  - question: |
      Зачем таблица показывает `shown()` — последний полученный ответ, — а не `games.value()`?
    options:
      - Пока грузится новая страница, значения у ресурса нет — таблица исчезала бы
      - Чтобы при щелчке по открытой странице не уходил повторный запрос
      - Чтобы `debounced` откладывал запрос — без `linkedSignal` он не работает
      - Чтобы `httpResource` не отменял запрос прошлой страницы, пока идёт новый
    explanation: |
      Во время загрузки ресурс не даёт значения. `linkedSignal` помнит прошлое, и таблица лишь бледнеет. Без него при задержке 1500 мс на каждом щелчке — «Загружаем игры…» вместо таблицы (шаг «Поиск и страницы», эксперимент «Без `shown`»).
    step: 03-search-pages

  - question: |
      Почему модель формы редактирования — `linkedSignal`, а не обычный `signal`?

      ```ts
      private readonly draft = linkedSignal<GameDraft>(() =>
        this.game.hasValue() ? toDraft(this.game.value()) : EMPTY,
      );
      protected readonly gameForm = form(this.draft, gameSchema);
      ```
    options:
      - '`form()` нужна модель сразу, а игра придёт позже — с ответом черновик сменится'
      - '`form()` принимает только `linkedSignal` — с `signal` форма не создастся'
      - '`linkedSignal` сам отправит изменения на сервер, когда админ поменяет поле'
      - С `signal` черновик тоже сменился бы сам — `signal` следит за ресурсом
    explanation: |
      Данные приходят позже, чем создаётся компонент, а модель нужна в поле класса. `linkedSignal` — записываемый сигнал от источника: пока игры нет — `EMPTY`, пришёл ответ (или другая игра) — черновик начинается с неё, а форма пишет в него, как в любой сигнал (шаг «Форма редактирования»).
    step: 04-edit-form

  - question: |
      В схеме цены — `required` и `min(game.price, 1)`. Админ вводит 2990.5 и нажимает «Сохранить». Что будет?
    options:
      - '`min` её пропустит, а сервер ответит `400`, и его сообщение будет под формой'
      - '`min` покажет ошибку под полем цены: дробные числа это правило не пропускает никогда'
      - Поле `<input type="number">` само округлит цену до 2990, и сохранение пройдёт без ошибок
      - Сервер сохранит цену 2990.5, а таблица админки покажет её как «2 990,5 ₽»
    explanation: |
      `min` сравнивает с единицей, а 2990.5 больше. Проверку целых рублей делает сервер: ответ `400` с причиной, которую `save` возвращает ошибкой формы. Форма проверяет то, что удобно заранее, сервер — всё (шаг «Форма редактирования», эксперимент «Сервер проверяет сам»).
    step: 04-edit-form

  - question: |
      `AdminGames` объявлен с `@Service({ autoProvided: false })` и указан в `providers` маршрута админки. Что будет, если попросить его в шапке магазина?

      ```ts
      private readonly adminGames = inject(AdminGames);
      ```
    options:
      - Ошибка `NG0201` — шапка ищет сервис в `root`, а он есть только в инжекторе маршрута
      - Шапка получит тот же экземпляр, что и страницы админки, — сервис один на всё приложение
      - Шапка получит свой экземпляр из `root`, и журналов станет два
      - Angular создаст для шапки свой инжектор маршрута, как только она впервые попросит сервис
    explanation: |
      Шапка живёт не в ветке маршрута админки: её поиск идёт сразу в инжектор окружения `root`. С `autoProvided: false` сервиса там нет — ошибка `NG0201`. Два журнала получились бы с `@Service()` без `autoProvided: false` (шаг «Сервис раздела»).
    step: 05-section-service

  - question: |
      Админ сохранил игру, ушёл в каталог магазина и вернулся в админку. Что с журналом на сводке? (`withAutoCleanupInjectors` не включён.)
    options:
      - Запись на месте — инжектор маршрута по умолчанию не уничтожается, и сервис живёт
      - Журнал пуст — сервис раздела создаётся заново при каждом входе в админку
      - Журнал пуст — `AdminHome` создан заново, а журнал хранился в нём
      - Запись на месте — при уходе из раздела Angular сохраняет состояние сервиса в `localStorage`
    explanation: |
      Инжектор маршрута создаётся при первом обращении и по умолчанию не уничтожается: второй строки «экземпляр создан» нет. С `withAutoCleanupInjectors()` роутер уничтожает инжекторы неактивных маршрутов — и журнал пропадает (шаг «Сервис раздела»).
    step: 05-section-service

  - question: |
      Почему после успешного `PUT /api/games/4` интерцептор очищает весь кэш, а не только ответ `/api/games/4`?
    options:
      - Устарели и страницы каталога, а в каких ответах есть эта игра, интерцептор не знает
      - '`ResponseCache` хранит ответы в `Map`, а из `Map` нельзя удалить одну запись'
      - В ответе на `PUT` нет адреса игры, и найти её ответ в кэше нельзя
      - Angular запрещает интерцептору читать адрес у запроса, который меняет данные на сервере
    explanation: |
      После изменения игры устарело всё, где она есть: сама игра, страницы каталога с любым поиском и сортировкой, подборки. Интерцептор видит адреса, а не смысл данных — надёжнее забыть всё (шаг «Изменения и кэш»).
    step: 06-cache

  - question: |
      Сервер ответил на `PUT` ошибкой `400`. Очистит ли новый `cacheInterceptor` кэш?

      ```ts
      return next(req).pipe(
        tap((event) => {
          if (event instanceof HttpResponse) {
            cache.clear();
          }
        }),
      );
      ```
    options:
      - Нет — ответ с ошибкой приходит ошибкой потока, а не `HttpResponse`
      - Да — `tap` вызывается на любой ответ, и `400` — тоже `HttpResponse`
      - Да — кэш очищается, как только запрос не `GET` прошёл через этот интерцептор
      - Нет — `retryInterceptor` повторит запрос, и второй раз он пройдёт
    explanation: |
      Ответ с ошибкой `HttpClient` выдаёт как ошибку потока, `HttpResponse` не приходит. Сохранение не удалось — кэш прав, и после ошибки игра снова приходит из кэша (шаг «Изменения и кэш», эксперимент «Ошибка не очищает»).
    step: 06-cache

  - question: |
      В `Confirmation.ask` забыли одну строку. Что будет при щелчке «Удалить»?

      ```ts
      const dialog = createComponent(ConfirmDialog, {
        environmentInjector: this.injector,
        bindings: [inputBinding('question', () => question), …],
      });
      document.body.append(dialog.location.nativeElement);
      // this.appRef.attachView(dialog.hostView);
      ```
    options:
      - Окно не откроется — его представление никто не проверяет, и привязки не сработают
      - Окно откроется с вопросом, но кнопки не будут реагировать на щелчки
      - '`createComponent` бросит ошибку: без `attachView` динамический компонент создать нельзя'
      - Окно откроется и тут же закроется — без `attachView` Angular уничтожает компонент сразу
    explanation: |
      У динамического компонента нет родителя, который проверял бы его вместе с собой. Без `attachView` в `<body>` появляется `<app-confirm-dialog>` с закрытым окном, в котором есть только статичный текст «Отмена» (шаг «Подтверждение удаления», эксперимент «Без `attachView`»).
    step: 07-confirm-dialog

  - question: |
      Зачем `save()` страницы редактирования вызывает `this.gameForm().reset()` перед переходом в таблицу?
    options:
      - Иначе форма останется `dirty`, и гард спросит «Изменения не сохранятся» после «Сохранить»
      - Чтобы стереть введённые значения — иначе таблица после перехода покажет старые цены игр
      - Чтобы ресурс игры заново загрузил её с сервера, уже с сохранёнными изменениями
      - Без `reset()` форма не отправит `PUT` второй раз, если админ снова откроет эту игру
    explanation: |
      `reset()` снимает `dirty` и `touched`, не трогая значения. Гард `unsavedChangesGuard` спрашивает, если форма `dirty`, а о сохранении он не знает (шаг «Подтверждение удаления», эксперимент «Без `reset`»).
    step: 07-confirm-dialog

  - question: |
      Маршрут `new` поставили после `:id`. Что откроется по адресу `/admin/games/new`?

      ```ts
      children: [
        { path: '', component: GamesTable },
        { path: ':id', component: GameEdit },
        { path: 'new', component: GameNew },
      ],
      ```
    options:
      - Страница редактирования — `:id` подошёл к слову `new`, в «Сети» ответ `404`
      - Форма новой игры — роутер выбирает самый точный маршрут, а не первый
      - «Нет такой страницы» — подошли два маршрута, и роутер не выбрал ни один
      - Ошибка при запуске — роутер запрещает ставить маршрут `:id` раньше обычных путей
    explanation: |
      Роутер перебирает маршруты по порядку и берёт первый подходящий, а `:id` подходит к любому слову. Отсюда «Игра не найдена» в крошке и `404` в «Сети» (практикум «Новая игра», подсказка 1).
    step: 08-practice

  - question: |
      Что будет, если при загрузке обложки поставить заголовок самим?

      ```ts
      this.http.post('/api/covers', body, {
        headers: { 'Content-Type': 'multipart/form-data' },
      });
      ```
    options:
      - Потеряется граница частей тела (`boundary`), и сервер ответит `400`
      - Ничего — `HttpClient` и сам ставит такой же заголовок для `FormData`
      - Браузер отправит файл JSON-строкой, и сервер ответит `415`
      - '`HttpClient` бросит `NG02824`: заголовок у `FormData` менять нельзя'
    explanation: |
      Для `FormData` `HttpClient` заголовок не ставит — его ставит браузер вместе с границей (`boundary`). Свой заголовок её теряет: учебный бэкенд отвечает `400` «Не удалось разобрать тело multipart/form-data» (практикум «Новая игра»).
    step: 08-practice
