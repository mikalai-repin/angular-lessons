# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      Что возвращает `signalStore(...)` в этом коде?

      ```ts
      export const FavoritesStore = signalStore(
        { providedIn: 'root' },
        withState({ ids: [] as number[] }),
      );
      ```
    options:
      - Класс — его выдаёт DI, компонент просит `inject(FavoritesStore)`
      - Готовый экземпляр хранилища — его импортируют и используют без DI
      - Сигнал с объектом состояния — его читают как `FavoritesStore().ids`
      - Функцию-фабрику — каждый компонент вызывает её и получает своё хранилище
    explanation: |
      `signalStore` объявляет класс с `@Injectable({ providedIn })` и возвращает его. Для компонента это обычный сервис: `inject(FavoritesStore)`, `favorites.count()` — поэтому шапку и карточку менять не пришлось (шаг «Signal Store»).
    step: 01-signal-store

  - question: |
      В шапку добавили метод. Что скажет TypeScript?

      ```ts
      protected clearFavorites() {
        patchState(this.favorites, { ids: [] });
      }
      ```
    options:
      - Ошибка TypeScript — снаружи сигналы хранилища только для чтения
      - Ничего — `patchState` принимает любое хранилище Signal Store
      - Код скомпилируется, а при вызове метода в консоли будет ошибка `NG0201`
      - В консоли предупреждение, а состояние останется прежним
    explanation: |
      По умолчанию состояние закрыто (`protectedState`): снаружи хранилище — `StateSource` с сигналами только для чтения, а `patchState` нужен `WritableStateSource` — TypeScript код не пропустит. Менять состояние можно внутри `withMethods` и `withHooks` (шаг «Signal Store», раздел «Состояние закрыто»).
    step: 01-signal-store

  - question: |
      Части поменяли местами. Что скажет TypeScript?

      ```ts
      signalStore(
        withComputed(({ ids }) => ({ count: () => ids().length })),
        withState({ ids: [] as number[] }),
      );
      ```
    options:
      - "`Property 'ids' does not exist on type '{}'` — выше пусто"
      - Ничего — части собираются вместе, и порядок не важен
      - 'Ничего, но `count` всегда будет `0`: когда `withComputed` создавался, `ids` ещё не было'
      - 'Ошибку у `withState`: состояние должно стоять первым аргументом'
    explanation: |
      Каждая часть видит только то, что добавили части выше неё: она получает заготовку хранилища, собранную ими. Выше `withComputed` ничего нет — хранилище для него пустое (шаг «Signal Store», эксперимент «Порядок частей»).
    step: 01-signal-store

  - question: |
      Зачем у свойств корзины имена с подчёркиванием?

      ```ts
      withProps(() => ({
        _config: inject(SHOP_CONFIG),
        _analytics: injectAsync(…),
      })),
      ```
    options:
      - Это закрытые члены — части ниже их видят, а код снаружи хранилища нет
      - Так NgRx отличает свойства от состояния — без `_` они попали бы в `getState`
      - Подчёркивание откладывает создание свойства до первого чтения
      - Свойства с `_` живут только во время `onInit`, потом хранилище их удаляет
    explanation: |
      Член хранилища с `_` в начале — закрытый: TypeScript убирает его из типа экземпляра, `this.cart._config` в шапке — ошибка TypeScript `Property '_config' does not exist…`. Во время выполнения он всё равно лежит в экземпляре — это защита типами, как `private` (шаг «Корзина на Signal Store»).
    step: 02-cart-store

  - question: |
      Во второй `withComputed` корзины случайно добавили `count: () => 0`. Что будет в магазине?
    options:
      - 'Предупреждение в консоли, а в шапке всегда «В корзине: 0 · …»'
      - Ошибка TypeScript — два члена с одним именем в одном хранилище
      - Предупреждение, а в шапке настоящее число — первый `count` важнее
      - Магазин не запустится — `signalStore` бросит исключение
    explanation: |
      TypeScript молчит. При разработке в консоли `@ngrx/signals: SignalStore members cannot be overridden. Trying to override: count`, и нижний `count` заменяет верхний — шапка показывает `0`. В собранном приложении предупреждения нет (шаг «Корзина на Signal Store», эксперимент «Два члена с одним именем»).
    step: 02-cart-store

  - question: |
      `add` всегда зовёт `addEntity`, без проверки, есть ли игра в корзине. Покупатель дважды нажимает «В корзину» у одной игры. Что будет?

      ```ts
      patchState(store, addEntity({ game, quantity: 1 }, cartItems));
      ```
    options:
      - Одна позиция с количеством 1, и никаких ошибок
      - Две позиции с одной игрой — коллекция допускает повторы
      - Одна позиция, количество 2 — `addEntity` складывает количества
      - Ошибка в консоли — сущность с таким id уже есть в коллекции
    explanation: |
      Если сущность с таким id уже есть, `addEntity` не делает ничего — ни ошибки, ни предупреждения. Для «добавить или поменять» есть `setEntity` и `upsertEntity` (шаг «Коллекции», эксперимент «`addEntity` не добавляет дважды»).
    step: 03-entities

  - question: |
      В `onInit` корзины есть эффект, который читает только порядок позиций. Покупатель меняет количество уже лежащей игры (`updateEntity`). Перезапустится ли эффект?

      ```ts
      effect(() => console.log('ids:', JSON.stringify(store.ids())));
      ```
    options:
      - Нет — `ids` остался тем же массивом, сообщать нечего
      - Да — любое изменение коллекции перезапускает всех, кто её читает
      - 'Да — `updateEntity` заменяет коллекцию целиком: и `entityMap`, и `ids`'
      - Нет — эффекты в `onInit` выполняются один раз
    explanation: |
      `patchState` записывает только те поля состояния, которые изменились (сравнение `!==`). `updateEntity` меняет `entityMap`, а массив `ids` остаётся тем же — кто читает `ids`, не пересчитывается (шаг «Коллекции», эксперимент «Что поменялось — то и сообщило»).
    step: 03-entities

  - question: |
      Избранное пусто, `game1.id` — 1, `game2.id` — 2. В `onInit` избранного два `toggle` подряд. Что напечатается?

      ```ts
      watchState(store, (s) => console.log('watchState:', JSON.stringify(s)));
      effect(() => console.log('effect:', JSON.stringify(getState(store))));
      store.toggle(game1);
      store.toggle(game2);
      ```
    options:
      - Три строки `watchState` и одна строка `effect` с `[1,2]`
      - По две строки `watchState` и `effect` — по одной на каждый `toggle`
      - Одна строка `watchState` и одна строка `effect` — обе с итоговым `[1,2]`
      - Три строки `watchState` и три строки `effect`
    explanation: |
      `watchState` вызывает функцию сразу при подключении и синхронно на каждый `patchState`. Эффект выполняется позже и один раз на все изменения подряд. Для `localStorage` хватает эффекта, `watchState` — для журнала и «отменить/повторить» (шаг «Своё расширение»).
    step: 04-custom-feature

  - question: |
      В `refresh` корзины `tapResponse` заменили на `tap({ next: … })` без обработки ошибки. Сервер ответил 500. Что дальше?
    options:
      - «Сверяем…» висит, и `refresh` больше не отправляет запросов
      - Появится «Не удалось сверить корзину…» — ошибку поймает `switchMap`
      - Ошибка в консоли, но следующий вызов `refresh` снова отправит запросы, как обычно
      - Сработает `catchError` в `loadGame` — он превратит 500 в `null`
    explanation: |
      Ошибка внутреннего потока прошла через `switchMap` в единственный поток `rxMethod` и завершила его — до перезапуска приложения. `loadGame` превращает в `null` только 404. Поэтому ошибку ловят внутри `switchMap` — это и делает `tapResponse` (шаг «Асинхронные методы», эксперимент «Без `tapResponse`»).
    step: 05-rx-method

  - question: |
      Задержка 1500 мс. Покупатель открыл корзину и сразу ушёл на главную — больше в корзину не возвращался. Что с запросами сверки?
    options:
      - Дойдут до конца — `rxMethod` живёт в хранилище, а не на странице
      - Будут отменены — страница корзины уничтожена, и `switchMap` отписался
      - 'Будут отменены: при смене адреса роутер отменяет все незаконченные запросы'
      - Отправятся заново, когда покупатель окажется на главной
    explanation: |
      Хранилище корзины живёт всё время работы приложения, и поток `rxMethod` — вместе с ним. Отменяет прошлую сверку только следующий вызов `refresh` (`switchMap`): открыли корзину снова — первые запросы «отменён» (шаг «Асинхронные методы»).
    step: 05-rx-method

  - question: |
      Какой корзину видит обработчик из `withEventHandlers`, когда получает `orderPlaced`?

      ```ts
      withReducer(on(checkoutEvents.orderPlaced, () => [removeAllEntities(), { promo: null }])),
      withEventHandlers((store, events = inject(Events)) => ({
        trackOrder$: events.on(checkoutEvents.orderPlaced).pipe(tap(…)),
      })),
      ```
    options:
      - Уже пустой — редьюсеры получают событие раньше обработчиков
      - Ещё полной — обработчики получают событие первыми
      - Как повезёт — порядок зависит от скорости сервера
      - Никакой — событие уже забрал редьюсер, обработчик его не получит
    explanation: |
      Редьюсеры слушают `ReducerEvents`, обработчики — `Events`, и `Dispatcher` отдаёт событие сначала первому, потом второму. (шаг «События», раздел «Кто первый»).
    step: 06-events

  - question: |
      Что будет, если редьюсер классического Store поменяет массив на месте?

      ```ts
      on(GameCardActions.favoriteToggled, (state, { gameId }) => {
        state.ids.push(gameId);
        return state;
      }),
      ```
    options:
      - При разработке — `TypeError`, и счётчик избранного не меняется
      - Сердечко сработает — редьюсер вернул состояние с новым id
      - Ошибка TypeScript — `state` объявлен только для чтения
      - Store сам скопирует состояние, применит изменение к копии и сохранит её
    explanation: |
      При разработке Store замораживает состояние (`Object.freeze`) — изменить его на месте нельзя, счётчик остаётся `♥ 0`. В собранном приложении проверки нет, и такой редьюсер молча сломал бы подписчиков (шаг «Классический Store», эксперимент «Состояние не меняют»).
    step: 07-classic-store

  - question: |
      У эффекта убрали `dispatch: false`. Что будет при щелчке по сердечку?

      ```ts
      export const saveFavorites = createEffect(
        (actions$ = inject(Actions), store = inject(Store)) =>
          actions$.pipe(
            ofType(GameCardActions.favoriteToggled),
            concatLatestFrom(() => store.select(favoritesFeature.selectIds)),
            tap(([, ids]) => localStorage.setItem(KEY, JSON.stringify(ids))),
          ),
        { functional: true },
      );
      ```
    options:
      - Ошибка в консоли — эффект выдаёт пары, а не действия
      - Ничего не изменится — `tap` ничего не возвращает в Store
      - Бесконечный цикл — эффект снова получит своё же действие
      - Избранное перестанет сохраняться в `localStorage`, но ошибок в консоли не будет
    explanation: |
      По умолчанию Store отправляет всё, что выдал эффект. `tap` пропускает значения дальше — а это пары `[действие, ids]`: `Effect "saveFavorites()" dispatched an invalid action`. `dispatch: false` говорит, что эффект — конец пути (шаг «Эффекты»).
    step: 08-effects

  - question: |
      Что делает этот вызов в конструкторе страницы игры?

      ```ts
      inject(RecentStore).remember(() =>
        this.game.hasValue() ? this.game.value() : undefined,
      );
      ```
    options:
      - Запоминает каждую новую загруженную игру, пока жива страница
      - Запоминает игру один раз — ту, что загрузится первой
      - Подписывается навсегда — слежение остановится только с приложением
      - Ничего — `signalMethod` принимает только обычные значения, а не функции
    explanation: |
      С функцией, читающей сигналы, `signalMethod` создаёт `effect` в контексте внедрения того, кто вызвал, — здесь страницы. Слежение закончится вместе со страницей, а обработка получает каждое новое значение ресурса (практикум «Вы смотрели»).
    step: 09-practice

  - question: |
      Что напечатает шапка?

      ```ts
      constructor() {
        patchState(this.cart as never, { promo: { code: 'ВЗЛОМ', percent: 99 } });
        console.log('Промокод:', this.cart.promo()?.code);
      }
      ```
    options:
      - '`Промокод: ВЗЛОМ` — защита состояния существует только в типах'
      - '`Промокод: undefined` — снаружи `patchState` молча ничего не меняет'
      - Ошибку времени выполнения — сигналы снаружи только для чтения
      - '`Промокод: null` — `withLinkedState` сразу сбросит чужой промокод'
    explanation: |
      Снаружи тип говорит «сигналы только для чтения», а в экземпляре — те же записываемые сигналы. `as never` обманул TypeScript, и JavaScript ничего не заметил. В тестах для этого есть честный способ — `unprotected(store)` (шаг «Под капотом: что такое signalStore»).
    step: 10-store-inside
