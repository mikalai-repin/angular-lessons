# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      Что компилятор записывает в блок обновления на месте этого `@if`?

      ```html
      @if (priority()) {
        <img class="cover" priority />
      } @else {
        <img class="cover" />
      }
      ```
    options:
      - 'В `conditional(ctx.priority() ? 0 : 1)` — номер места выбранной ветки'
      - "В два `property('hidden', …)`: обе ветки созданы заранее и прячутся"
      - 'В `if (ctx.priority())` вокруг создания `<img>` прямо в функции шаблона'
      - В создание директивы `NgIf` с входом `priority()` на месте блока
    explanation: |
      Каждая ветка стала отдельной функцией шаблона, а весь `@if … @else` — одним выражением, которое выбирает номер места: здесь `0` или `1` (`-1` — «ничего», когда `@else` нет). `conditional` сравнивает его с прошлым и при изменении пересоздаёт ветку (шаг «Код шаблона»).
    step: 01-template-code

  - question: |
      Привязка `[routerLink]="['/games', game().id]"` скомпилирована в `property('routerLink', pureFunction1(26, _c3, ctx.game().id))`. Зачем `pureFunction1`?
    options:
      - Пока `id` прежний, она отдаёт тот же массив — вход `RouterLink` не меняется
      - Она переносит создание массива из браузера в сборку AOT, где он строится один раз
      - Она превращает массив в строку `/games/8`, которую ждёт `RouterLink`
      - Литералы массивов в шаблонах запрещены, и компилятор заменяет их вызовом
    explanation: |
      Без неё каждая проверка создавала бы новый массив, а `property` сравнивает через `===` — `RouterLink` получал бы «новый» вход каждый раз. `pureFunction1` запоминает аргумент и результат в ячейках привязок (шаг «Код шаблона»).
    step: 01-template-code

  - question: |
      У `Rating` пустой `imports`, и строки звёзд созданы `domElementStart`. Что будет, если добавить в `imports` пайп, которым шаблон не пользуется?
    options:
      - 'JIT перейдёт на `elementStart`, AOT оставит `domElementStart` и предупредит `NG8113`'
      - 'Оба компилятора оставят `domElementStart`: пайпы в этом решении не учитываются'
      - 'Оба компилятора перейдут на `elementStart`: режим `DomOnly` — только без `imports`'
      - 'JIT упадёт с ошибкой «All imports are unused», а AOT соберёт компонент без замечаний'
    explanation: |
      JIT выбирает `DomOnly`, только когда `imports` пуст. AOT решает точнее: учитывает лишь директивы, которые шаблон действительно использует, и вдобавок предупреждает `NG8113: All imports are unused` (шаг «Код шаблона»).
    step: 01-template-code

  - question: |
      На главной двенадцать карточек `GameCard`. Что у каждой своё, а что одно на всех?
    options:
      - Свой `LView` у каждой; функция шаблона и TNode — в одном `TView` на тип
      - 'Свои `TView` и `LView`: шаблон заново разбирается для каждого экземпляра'
      - Один `LView` на все карточки, а значения привязок хранятся в атрибутах DOM
      - Свои TNode у каждой карточки, а общий у них только код функции шаблона
    explanation: |
      `TView` создаётся один раз на тип и хранится в `GameCard.ɵcmp.tView`. Двенадцать карточек — двенадцать массивов `LView` (копий заготовки `blueprint`) с узлами и значениями привязок (шаг «Представления: LView и TView»).
    step: 02-views

  - question: |
      Журнал по Alt + щелчку показал у карточки `81: -1`. После «В корзину» стало `81: 35`, остальные привязки прежние. Что лежит в ячейке 81?
    options:
      - Номер выбранной ветки `@if (inCart() > 0)`
      - Сколько штук этой игры уже лежит в корзине покупателя
      - Номер `__ngContext__` представления карточки
      - Версия сигнала `inCart` после записи
    explanation: |
      В участке привязок `LView` хранятся прошлые значения. Для `@if` это номер выбранного места: `-1` — ничего, `35` — ветка «В корзине: N шт.» (шаг «Представления: LView и TView»).
    step: 02-views

  - question: |
      Щелчок по кнопке в шаблоне карточки. Что сделает `markViewDirty`, которую вызывает обёртка обработчика?
    options:
      - Поставит `RefreshView` и `Dirty` карточке и всем предкам до корня
      - Поставит предкам только `HasChildViewsToRefresh`, как при записи в сигнал
      - Поставит `Dirty` одной карточке, предков оставит без флагов
      - 'Флагов не поставит: только разбудит планировщик, а флаги расставит `tick()`'
    explanation: |
      `markViewDirty` будит планировщик и в цикле до корня ставит каждому представлению `RefreshView | Dirty`. Поэтому в журнале после щелчка `App`, `Home` и карточка обновлены с причиной `RefreshView` (шаг «Обнаружение изменений изнутри»).
    step: 03-change-detection

  - question: |
      Магазин собрали дважды: `ng build` — 515,57 kB начальных файлов, `ng build --aot=false` — 1,33 MB. Откуда разница?
    options:
      - 'В JIT-сборку попадает компилятор Angular: шаблоны строятся в браузере'
      - 'В JIT-сборке шаблоны лежат дважды: код для браузера и блоки проверки типов'
      - 'JIT-сборка не сжимает код: в ней остаются пробелы и длинные имена'
      - 'AOT выносит компоненты страниц в ленивые чанки, а JIT кладёт всё в начальные'
    explanation: |
      В JIT-сборке код шаблонов строится в браузере, поэтому сборщик кладёт `@angular/compiler` в `polyfills` (512,41 kB): «Angular JIT mode requires the runtime compiler». В AOT-сборке компилятора нет — код шаблонов готов при сборке (шаг «JIT и AOT»).
    step: 06-jit-aot

  - question: |
      Компоненту `GameCard` поставили `ChangeDetectionStrategy.Eager` и нажали сердечко на одной карточке. Почему журнал показал обновление всех двенадцати?
    options:
      - '`Home` обновлён, его дети проверяются в режиме `Global`, а там действует `CheckAlways`'
      - '`Eager` обновляет компонент при каждой проверке приложения, где бы в дереве она ни шла'
      - Сердечко ставит `RefreshView` каждой карточке, у которой есть такая кнопка
      - '`Eager` отключает сигналы карточки, и Angular сравнивает все привязки заново'
    explanation: |
      Проверка в зонлесс начинается в режиме `Targeted`, но дети обновлённого представления проверяются в режиме `Global` — там учитываются `Dirty` и `CheckAlways`. Щелчок обновил `Home`, поэтому обновились все `Eager`-карточки. Звёзды внутри — нет: они OnPush (шаг «Обнаружение изменений изнутри»).
    step: 03-change-detection

  - question: |
      В зонлесс-приложении в шаблон шапки добавили `{{ stamp() }}`. Что будет в режиме разработки?

      ```ts
      protected stamp() {
        return Math.random();
      }
      ```
    options:
      - 'Ошибок нет; `NG0100` появится с `provideCheckNoChangesConfig({ exhaustive: true })`'
      - '`NG0100` при каждой проверке: повторная проверка режима разработки всегда обходит все представления'
      - 'Ошибка компиляции шаблона: метод с побочным эффектом в привязке запрещён'
      - 'Шапка перестанет обновляться: после `NG0100` Angular отключает её проверку'
    explanation: |
      По умолчанию повторная проверка режима разработки смотрит только представления, которые после проверки снова «грязные», — таких нет, ошибки нет. В режиме `exhaustive` она обходит все представления и ловит изменившееся значение: `NG0100 ExpressionChangedAfterItHasBeenCheckedError` (шаг «Обнаружение изменений изнутри»).
    step: 03-change-detection

  - question: |
      Магазин на zone.js. Шапка (OnPush) показывает обычное поле, которое меняет `setInterval(() => this.seconds++, 1000)`. Что на экране?
    options:
      - '«Секунд: 0»: зона запускает проверку, но OnPush-шапку никто не пометил'
      - 'Счётчик идёт: zone.js сама запускает проверку всего дерева после каждого таймера'
      - 'Счётчик идёт: таймер внутри OnPush-шапки помечает её сам'
      - 'Ошибка `NG0908`: в зоне нельзя менять обычные поля из таймера'
    explanation: |
      Зона после каждой задачи вызывает `tick()` в режиме `Global` от корня — в журнале строки `Проверка [—]: шаблоны не обновлялись`. Шапка OnPush и не помечена. Счётчик пошёл, только когда `Eager` поставили и `App`, и шапке (шаг «zone.js»).
    step: 04-zone

  - question: |
      Почему сборщик Angular CLI, увидев zone.js в `polyfills`, переписывает `async`/`await` в генераторы?
    options:
      - '`await` продолжает функцию в обход подменённого `Promise` — зона его не видит'
      - 'Генераторы работают быстрее нативных `async`-функций во всех браузерах'
      - 'Генераторы занимают меньше места, и сборка с zone.js становится компактнее'
      - 'Без этого AOT-компилятор не может построить код шаблонов'
    explanation: |
      Нативный `await` — механизм движка, а не вызов подменяемого `Promise`. В исходниках `@angular/build` так и сказано: «Native async/await is not supported with Zone.js». Код от этого больше и медленнее — одна из причин отказа от зоны (шаг «zone.js»).
    step: 04-zone

  - question: |
      Что выведет лаборатория после этих строк, если `watch` печатает строку «Итог …»?

      ```ts
      setQuantity(2);
      setQuantity(3);
      await pause();
      ```
    options:
      - Одну строку «Итог»; `total` вычислен один раз, версия `quantity` выросла дважды
      - Две строки «Итог»; `total` вычислен дважды — по разу на каждую запись в `quantity`
      - Две строки «Итог»; `total` вычислен один раз, второй раз взят из памяти
      - Ничего; `watch` выполняется, только когда вызывают его `notify()`
    explanation: |
      Первая запись пометила `watch` и поставила его в очередь, вторая застала уже грязным. `total` пересчитан лениво, когда `watch` его прочитал. В выводе — `quantity 2`, а счётчик вычислений `total` вырос с 1 до 2 (шаг «Сигналы изнутри»).
    step: 05-signals-inside

  - question: |
      `total` возвращает объект. Цену и количество поменяли так, что сумма осталась прежней. Напечатает ли `watch` снова?

      ```ts
      const total = createComputed(() => ({
        sum: price() * quantity(),
      }));
      watch(() => console.log(total().sum));
      ```
    options:
      - Да — объект новый, `Object.is` его не узнаёт, и версия `total` выросла
      - Нет — сумма та же, а `computed` сравнивает новые объекты с прежними по полям
      - Нет — `computed` не пересчитывается, пока сумма не изменилась
      - Да — `watch` выполняет `fn` после каждой записи, даже если версии прежние
    explanation: |
      Версия растёт, когда новое значение не равно прежнему, а по умолчанию равенство — `Object.is`. С числом `watch` молчал, с объектом печатает. Лечится функцией равенства: вторым аргументом `createComputed`, в Angular — опцией `equal` (шаг «Сигналы изнутри»).
    step: 05-signals-inside

  - question: |
      В шаблоне карточки опечатка: `{{ game().titel }}`. Что покажут превью и `ngc`?
    options:
      - 'Превью — пустые заголовки без ошибок, `ngc` — `TS2551` с местом в шаблоне'
      - 'Превью — `NG0303` в консоли, `ngc` — та же ошибка во время сборки'
      - 'Оба — пустые заголовки: `undefined` в интерполяции не ошибка'
      - 'Превью — ошибка компиляции шаблона в консоли, `ngc` — только предупреждение при сборке'
    explanation: |
      JIT не проверяет типы шаблонов: `undefined` в интерполяции — пустая строка. AOT переводит шаблон в блок проверки типов и сообщает: `Property 'titel' does not exist on type 'Game'. Did you mean 'title'?` (шаг «JIT и AOT»).
    step: 06-jit-aot

  - question: |
      В простое журнал раз в секунду пишет `Проверка [markForCheck]: App (RefreshView), Header (RefreshView)`. Где искать причину?
    options:
      - Код шапки вызывает `markForCheck()` по таймеру
      - Шапка читает сигнал, который меняется раз в секунду
      - У шапки стратегия `Eager`, и она проверяется вместе с `App`
      - В шапке остался импорт zone.js, и зона будит проверку
    explanation: |
      В квадратных скобках — источник уведомления планировщика: `markForCheck`. `markForCheck()` — та же `markViewDirty`, поэтому `App` и шапка с причиной `RefreshView`. Сигнал дал бы источник `сигнал`, зона — `[—]` (практикум).
    step: 07-practice
