# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      В `tsconfig.json` проекта, созданного `ng new` 22, нет ни `"strict": true`, ни `"strictTemplates": true`. Что это значит?
    options:
      - Оба режима включены по умолчанию, хоть их и не видно
      - Проект нестрогий, режимы нужно дописать вручную
      - Строгость задаётся не здесь, а в `angular.json`, в цели `build`
      - Строгий только TypeScript, шаблоны проверяются мягко
    explanation: |
      TypeScript 6 включает `strict` сам, а компилятор Angular 22 считает `strictTemplates` включённым, пока его не выключат явно. Наоборот, `ng new --strict=false` записывает `false` для обоих. Шаг «Angular CLI».
    step: 01-angular-cli

  - question: |
      `ng new` записал в `package.json` версию `"@angular/core": "^22.2.0"`. Какую версию может поставить `npm install`?
    options:
      - Любую 22.x.y не ниже 22.2.0
      - Ровно 22.2.0
      - Только исправления ветки 22.2
      - Любую не ниже 22.2.0, включая 23
    explanation: |
      `^` разрешает новые возможности и исправления в пределах основной версии. Только исправления — это `~`, ровно версия — запись без значка (`--save-exact`). Поэтому у проекта оказались 22.2.3 и 22.2.4. Шаг «Перенос магазина».
    step: 02-move-shop

  - question: |
      Из `angular.json` убрали `proxyConfig`, бэкенд на порту 3000 работает. Что получит магазин в `ng serve` на запрос `/api/games`?
    options:
      - Ответ 200 со страницей `index.html` вместо JSON с играми
      - 'Ответ 404: сервер разработки не знает такого адреса'
      - 'Ответ 502 Bad Gateway: прокси некуда переслать запрос'
      - 'Список игр: сервер разработки сам найдёт бэкенд на порту 3000'
    explanation: |
      Без прокси сервер разработки считает `/api/games` адресом страницы приложения и отдаёт `index.html` (`Content-Type: text/html`). Журнал интерцептора при этом пишет `→ 200`. 502 бывает, когда прокси настроен, а бэкенд остановлен. Шаг «Перенос магазина».
    step: 02-move-shop

  - question: |
      В отчёте `ng build` среди ленивых частей есть `game-reviews`. Какой приём курса его создал?
    options:
      - Блок `@defer` вокруг отзывов
      - '`loadChildren` в карте маршрутов'
      - '`loadComponent` у страницы игры'
      - '`import()` внутри `injectAsync`'
    explanation: |
      Каждая ленивая часть — результат одного приёма: `admin-routes` и `account-routes` — `loadChildren`, `game-page` — `loadComponent`, `game-reviews` — `@defer` (глава 15), `analytics` — `injectAsync`. Шаг «Сборка».
    step: 03-build

  - question: |
      Почему код форм оказался в начальных файлах сборки и превысил бюджет?
    options:
      - Страницы с формами подключены через `component`
      - Формы подключает `app.config.ts` для всего приложения
      - Формы нельзя вынести из начальных файлов — их использует ядро Angular
      - 'Формы тянет шапка: быстрый поиск сделан на формах'
    explanation: |
      Импорт класса страницы вверху `app.routes.ts` тянет в `main` и саму страницу, и всё, что она импортирует. После `loadComponent` у трёх страниц начальные файлы стали 428,48 kB, а формы ушли в общий ленивый чанк. Шаг «Сборка».
    step: 03-build

  - question: |
      Что скажет `ng build` о таком шаблоне карточки (`oldPrice` — необязательное поле)?

      ```html
      {{ game().price - game().oldPrice | price }}
      ```
    options:
      - "Ошибка `TS2532: Object is possibly 'undefined'`"
      - 'Ничего: на странице у игр без скидки будет «не число ₽»'
      - Предупреждение `NG8109`, но сборка пройдёт
      - '`NG0303` в консоли браузера во время работы'
    explanation: |
      Строгая проверка шаблонов не даёт использовать необязательное поле без проверки. «Не число ₽» — это поведение превью, где шаблон проверяется только при разборе и во время работы. Шаг «Строгие шаблоны».
    step: 04-strict-templates

  - question: |
      `ng lint` отметил пустой `.catch(() => {})` при загрузке аналитики. Как мы поступили?
    options:
      - Стали писать ошибку в консоль через `console.warn`
      - Отключили правило `no-empty-function` для всего проекта
      - Убрали `.catch`, чтобы ошибка аналитики дошла до покупателя
      - Поставили `eslint-disable-next-line` с пояснением
    explanation: |
      Линтер здесь прав: заглушённая ошибка не видна никому. `eslint-disable-next-line` мы поставили там, где линтер не знает замысла, — у селектора `[formField]` и у звёзд рейтинга. Шаг «Генераторы и линтер».
    step: 05-cli-tools

  - question: |
      Первый запуск `ng test --watch=false --coverage` в новом проекте закончился сразу. Почему?
    options:
      - Не установлен пакет `@vitest/coverage-v8` (или istanbul)
      - Покрытие считается только в браузере, нужен `--browsers`
      - В режиме наблюдения покрытие не считается
      - Покрытие нужно сначала включить в `angular.json`
    explanation: |
      Сборщик тестов так и пишет: покрытию нужен один из двух пакетов. После `npm install -D @vitest/coverage-v8` отчёт показал около половины строк кода, включая шаблоны. Шаг «Тесты в проекте».
    step: 06-tests

  - question: |
      После `ng add @angular/ssr` сборка упала с `ReferenceError: localStorage is not defined` в `AuthStore.restore`. Почему код выполнялся без браузера?
    options:
      - Сборка запускает приложение на сервере, в Node.js
      - Пререндер открывает страницы в браузере без хранилища
      - Схема `ng add` удаляет `localStorage` из продакшен-сборки
      - '`AuthStore` перенесён в `server.ts` и работает только там'
    explanation: |
      Сборка запустила приложение в Node.js — и оно упало в инициализаторе, который читает токен из `localStorage`. В Node.js нет API браузера, поэтому магазин получил токен `BROWSER_STORAGE`: в браузере — `localStorage`, на сервере — `null`. Шаг «Рендеринг на сервере».
    step: 07-ssr

  - question: |
      Какой режим рендеринга мы выбрали для корзины в `app.routes.server.ts` и почему?
    options:
      - '`RenderMode.Client`: корзина лежит в `localStorage` браузера'
      - '`RenderMode.Prerender`: страница корзины одинакова для всех'
      - '`RenderMode.Server`: корзине нужны свежие цены на каждый запрос'
      - '`RenderMode.Server`: без сервера не работает гард пустой корзины'
    explanation: |
      Корзина и кабинет — личные страницы: их содержимое лежит в `localStorage` и токене покупателя, которых сервер не видит. Поэтому они, как оформление, вход и админка, отдаются браузеру (`'**'` → `Client`). Пререндер — для одинаковых для всех страниц (главная), `Server` — для страниц с изменчивыми данными (каталог, игра). Шаг «Рендеринг на сервере».
    step: 07-ssr

  - question: |
      Продакшен-сервер SSR вместо магазина ответил: `Header "host" with value "localhost:4000" is not allowed.` Что это?
    options:
      - 'Защита от SSRF: хоста нет в `allowedHosts`'
      - Сервер не нашёл файлы сборки в `dist/…/browser`
      - Прокси не может переслать запрос бэкенду
      - Браузер заблокировал запрос к другому источнику (CORS)
    explanation: |
      `AngularNodeAppEngine` принимает только хосты из `security.allowedHosts` в `angular.json`, переменной `NG_ALLOWED_HOSTS` или опции в `server.ts`. `ng add` оставил список пустым. Шаг «Рендеринг на сервере».
    step: 07-ssr

  - question: |
      Гостю ответ `GET /api/games/4` пришёл из `ng-state` страницы, без сети. А вошедшему покупателю тот же запрос ушёл в сеть. Почему?
    options:
      - Кэш передачи не берёт запросы с заголовком `Authorization`
      - Вошедшему покупателю сервер не присылает `ng-state`
      - Кэш передачи работает только в режиме разработки
      - После входа браузер очищает `ng-state` вместе с `localStorage`
    explanation: |
      `authInterceptor` добавляет вошедшему заголовок `Authorization`, а кэш передачи по умолчанию такие запросы не берёт (`includeRequestsWithAuthHeaders`): ответ гостю мог бы отличаться от ответа покупателю. Шаг «Гидратация».
    step: 08-hydration

  - question: |
      Таблица в шаблоне страницы игры без `<tbody>` дала `NG0500: During hydration Angular expected <tr> but found <tbody>`. Откуда `<tbody>`?
    options:
      - Его вставил браузерный парсер, разбирая HTML страницы
      - Его добавил сервер при сериализации DOM в строку
      - Его добавил компилятор Angular при сборке шаблона
      - Его вставила схема `ng add @angular/ssr` в шаблон
    explanation: |
      Сервер выдал разметку как есть, а браузер, разбирая HTML, вставил `<tbody>` — так требует спецификация. Гидратации нужно совпадение структуры DOM, поэтому шаблоны должны быть валидным HTML. Шаг «Гидратация».
    step: 08-hydration

  - question: |
      Что из этого можно хранить в `environment.ts`?
    options:
      - Публичный ключ сервиса аналитики
      - Пароль к базе данных магазина
      - Закрытый ключ API платёжного сервиса
      - Секрет для подписи токенов входа
    explanation: |
      Окружение подменяется при сборке и попадает в JavaScript, который скачивает каждый покупатель. Секретов там быть не может — только то, что не жалко показать. Шаг «Окружения и деплой».
    step: 09-deploy

  - question: |
      Статический магазин лежит на простом сервере файлов. `/games/4/` открывается, а `/cart` отвечает 404. Почему?
    options:
      - 'Корзина — маршрут `Client`: файла `cart/index.html` нет'
      - Корзина не пререндерилась, потому что не работал бэкенд
      - В статической сборке нет кода корзины, она работает только с SSR
      - '`getPrerenderParams` не вернул адрес корзины'
    explanation: |
      Пререндеренные страницы — файлы вроде `games/4/index.html`. У маршрутов `Client` файлов нет: хостингу нужно правило «адрес без файла — отдать `index.csr.html`». У сервера SSR оно встроено. Шаг «Практикум: статический магазин».
    step: 10-practice
