<img class="cover" [src]="game().cover" [alt]="game().title" />
<h2 class="title">{{ game().title }}</h2>
<p class="price">
  {{ game().price }} ₽
  @if (game().oldPrice; as oldPrice) {
    <s>{{ oldPrice }} ₽</s>
  }
</p>
<p
  class="stock"
  [class.out]="game().inStock === 0"
  [class.ok]="game().inStock > 0"
>
  {{ game().inStock === 0 ? 'Нет в наличии' : 'В наличии' }}
</p>
<button
  class="button"
  [disabled]="game().inStock === 0"
  (click)="add.emit(game())"
>
  В корзину
</button>
