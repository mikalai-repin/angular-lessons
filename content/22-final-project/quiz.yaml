# Первый вариант в options — правильный: порядок вопросов и вариантов перемешивается при каждой попытке
questions:
  - question: |
      Покупатель отправляет другу ссылку на свой список желаний, друг открывает её на своём компьютере без входа. Где должен быть записан список, чтобы друг увидел именно его?
    options:
      - Весь список — в адресе ссылки, `/wishlist?ids=12,3,7`
      - В Store избранного — он уже умеет загружать игры по id
      - В `localStorage`, чтобы список пережил и перезагрузку страницы
      - В сигнале страницы избранного, с которой ушла ссылка
    explanation: |
      Store и `localStorage` живут в браузере того, кто открыл ссылку: друг увидел бы своё избранное, а не чужое. Сигнал компонента живёт до ухода со страницы и тоже только у отправителя. Поделиться можно тем, что лежит в адресе. Шаг «Вариант А: сравнение и список желаний».
    step: 02-compare-wishlist

  - question: |
      Когда в сравнении три игры, кнопки «Сравнить» остальных карточек выключены через `[disabled]`. Зачем проверять границу ещё и в методе `toggle` сервиса?
    options:
      - '`disabled` — удобство: его можно снять в инструментах разработчика'
      - Без проверки в `toggle` Angular не обновит атрибут `disabled` у кнопки
      - '`disabled` действует только на щелчок мышью, а не на Enter'
      - Проверка в `toggle` нужна только для тестов, в приложении хватит `disabled`
    explanation: |
      Атрибут в разметке ничего не гарантирует: его можно снять в инструментах разработчика, и тогда граница держится только на коде. Поэтому проверка — в методе добавления, а `disabled` лишь подсказывает покупателю. Шаг «Вариант А: сравнение и список желаний», подсказка 2.
    step: 02-compare-wishlist

  - question: |
      Сервис `GiftStore` объявлен с `@Service()`. Что будет, если его ещё и указать в `providers` рамки мастера?

      ```ts
      @Component({
        selector: 'app-gift-layout',
        providers: [GiftStore],
        …
      })
      export class GiftLayout {}
      ```
    options:
      - Шаги увидят набор рамки, а гард получит другой, пустой, и не пустит дальше
      - 'Всё заработает так же, как с `@Service()`: рамка — общий родитель и шагов, и гардов'
      - Набор будет теряться при каждом переходе между шагами мастера
      - '`NG0201`: у гарда нет провайдера для `GiftStore`'
    explanation: |
      Шаги — дети рамки и берут сервис из её инжектора. Гард берёт сервисы из инжектора маршрутов, а не из инжектора компонента, поэтому получает свой экземпляр, в котором набор пуст. Шаг «Вариант Б: подарочный набор», «С чего начать».
    step: 03-gift-box

  - question: |
      Форма набора создаётся в поле сервиса, а не компонента:

      ```ts
      @Service()
      export class GiftStore {
        private readonly model = signal<GiftBox>(emptyBox());
        readonly form = form(this.model, giftSchema);
      }
      ```

      Что будет?
    options:
      - Работает — поле сервиса создаётся в контексте внедрения, как поле компонента
      - '`NG0203`: `form()` можно вызывать только в компоненте'
      - Работает, но у каждой страницы мастера будет своя копия формы
      - Не работает — у сервиса нет инжектора, и `form()` внутри него недоступен
    explanation: |
      `form()` нужен контекст внедрения, и поле сервиса создаётся в нём так же, как поле компонента; `NG0203` бывает без контекста. Поэтому форма живёт столько же, сколько сервис, и её видят и шаги, и гарды. Шаг «Вариант Б: подарочный набор», подсказка 2.
    step: 03-gift-box

  - question: |
      Шаг 1 мастера: покупатель жмёт «Далее», не выбрав ни одной игры. Правило `minLength` у массива игр есть, `app-field-errors` стоит под списком, но ошибки на экране нет. Почему?
    options:
      - Ошибку видно у «тронутого» поля, а список без `<input>` никто не тронул
      - Правило `minLength` работает только со строками, а не с массивами игр
      - '`app-field-errors` умеет показывать только ошибки текстовых полей ввода формы'
      - '`minLength` у массива проверяется только при отправке, а «Далее» форму не отправляет'
    explanation: |
      `minLength` считает и элементы массива, а `app-field-errors` всё равно, какое значение у поля. Но он показывает ошибки тронутого поля, а в списке игр нет `<input>`. Поэтому «Далее» сам вызывает `markAsTouched()` своей части формы. Шаг «Вариант Б: подарочный набор», подсказки 3 и 4.
    step: 03-gift-box

  - question: |
      После оформления набора мастер начинается заново: в модель записали пустой набор, но `form().reset()` не вызвали. Что увидит покупатель?
    options:
      - Новый набор сразу с ошибками под полями — поля остались «тронутыми»
      - Старый набор — без `reset()` модель не очистится
      - Ничего особенного — `reset()` нужен только формам с `<input>`
      - Пустой набор, но кнопка «Далее» останется выключенной до перезагрузки
    explanation: |
      Запись в модель меняет значения, но не состояние полей. `reset()` снимает «тронутость», иначе новый пустой набор сразу покажет ошибки. Шаг «Вариант Б: подарочный набор», подсказка 5.
    step: 03-gift-box

  - question: |
      Первая версия шага 1 выключала кнопку `pick` у каждой игры с нулевым остатком. Покупатель получил ответ 409, игру из набора раскупили, шаг 1 загрузил каталог заново. Что пошло не так?
    options:
      - Раскупленную игру стало нельзя убрать из набора, и набор не оформить
      - Раскупленная игра пропала из набора сама, и покупатель этого не заметил
      - Набор очистился целиком, потому что модель формы загрузилась заново
      - Кнопка `pick` осталась включённой, и игру можно было положить снова
    explanation: |
      У раскупленной игры остаток стал 0 — и её кнопка выключилась, хотя игра лежит в наборе. Без неё набор не оформить. Поэтому в образце выключена только кнопка игры, которой нет ни на складе, ни в наборе. Шаг «Вариант Б: подарочный набор», «Образец».
    step: 03-gift-box

  - question: |
      Подарочный набор отправляет на учебный бэкенд `total` — сумму, посчитанную в браузере, и бэкенд её принимает. Как поступает настоящий сервер?
    options:
      - Сам считает итог по ценам из базы, сумму клиента в лучшем случае сверяет
      - Считает итог сам, но цены игр берёт из запроса клиента
      - Доверяет сумме клиента, если запрос пришёл с верным токеном
      - Берёт сумму клиента и только округляет её до рублей
    explanation: |
      Иначе любой покупатель отправит `total: 1` из инструментов разработчика. Цены из запроса — та же сумма от клиента, только по частям. Шаг «Вариант Б: подарочный набор», «Образец».
    step: 03-gift-box

  - question: |
      В проект CLI подключён `ng add angular-eslint` с рекомендованными правилами. В компоненте есть `*ngIf`, `@Input()` и `constructor(private http: HttpClient)`. Что отметит `ng lint`?
    options:
      - '`*ngIf` и конструктор; `@Input()` пройдёт без замечаний'
      - Все три — они входят в рекомендованный набор правил angular-eslint
      - Ничего — это предупреждения компилятора, а не линтера
      - Только `*ngIf` — остальное проверяет `strictTemplates`
    explanation: |
      Мы проверили: `ng lint` отметил `prefer-control-flow` и `prefer-inject`, а `@Input()` и `@Output()` пропустил. Поэтому чек-лист самопроверки называет их отдельно. Шаг «Вариант В: своё приложение».
    step: 04-own-app

  - question: |
      Своё приложение читает данные из файла `public/data/games.json` через `httpResource('/data/game.json')` — в пути опечатка. Что ответит `ng serve`?
    options:
      - '`200` и `index.html` — разобрать его как JSON не получится'
      - '`404 Not Found` — такого файла в `public/` нет'
      - '`200` и пустой массив — сервер разработки подставит пустой JSON'
      - '`500` — сервер разработки не смог прочитать файл'
    explanation: |
      Сервер разработки отдаёт страницу приложения на любой адрес, который не файл, — тот же случай, что эксперимент без прокси в главе 20. Поэтому при ошибке разбора JSON первым делом смотрят ответ во вкладке Network. Шаг «Вариант В: своё приложение», «Откуда брать данные».
    step: 04-own-app
